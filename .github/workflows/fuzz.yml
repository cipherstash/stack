name: Fuzz (crates)

# libFuzzer fuzzing for the stack crates' untrusted-input parsers (the
# detached `packages/*/fuzz/` crates and the `fuzz:*` mise tasks). Ported from
# cipherstash-suite's `fuzz.yml`, for the six targets in the imported set; the
# suite keeps its three cts-common targets. Two jobs with different roles:
#
#   * fuzz-regression (pull_request and manual, blocking on PRs): builds every harness, which
#     catches harness and API drift, and replays the committed seed corpus with
#     `-runs=0`. Deterministic, so it is safe to gate PRs.
#
#   * fuzz-campaign (schedule and manual, never on PRs): the time-boxed
#     bug-finding run. Each target's corpus persists across runs in the Actions
#     cache, so coverage compounds; it is minimised with `cargo fuzz cmin`, and
#     any crash reproducer is uploaded as an artifact.
#
# cargo-fuzz needs nightly; the tasks run `cargo +nightly fuzz`. The `selector`
# job decides whether a pull request runs the regression replay, and `summary`
# reports the result (ADR 0003).

on:
  # No path filter: a workflow that a path filter skips leaves its required
  # checks pending, and GitHub's documentation on required status checks says
  # that blocks a merge. The trigger paths are in the `selector` job instead.
  pull_request: {}
  schedule:
    # Nightly at 04:47 UTC. Scheduled runs fire from the default branch only.
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to fuzz each target (campaign job)"
        default: "120"

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  # The cargo tools are pinned in mise.test.toml, which mise loads only in
  # the test environment. With no install_args, mise-action installs (and
  # caches) the whole test toolset once: `mise run` and `mise x` install any
  # tool of the toolset that is missing, uncached, so narrowing the install
  # would only move the rest out of the cache.
  MISE_ENV: test
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  # The selector job: it decides which jobs a pull request runs. It runs on
  # every event and is never skipped, because the gated jobs need it. When it
  # cannot decide it fails, and that fails the summary job: a selector that
  # answered nothing would skip every gated job, and the summary job counts a
  # skipped job as passed (ADR 0003).
  #
  # On a GitHub-hosted runner because the gated jobs wait for it. No checkout:
  # on a pull request, dorny/paths-filter lists the changed files through the
  # GitHub API.
  selector:
    name: Selector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Each output is named after the filter that decides it.
    # `scripts/__tests__/workflow-selectors.test.mjs` follows a job's `if:` to
    # its filter by that name.
    outputs:
      fuzz: ${{ steps.decide.outputs.fuzz }}
    steps:
      # Only on a pull request, which has a base to compare with. Other events
      # select every job in the step below.
      #
      # `every` makes a file count only when it matches every rule. That is
      # what makes the `!` rules exclude documentation: under dorny's default,
      # `some`, a `!` rule matches every other file in the repository. So each
      # filter's trigger paths are one brace pattern, written across lines:
      # YAML drops a line break that ends in `\`, with the next line's indent.
      #
      # Each fuzz crate builds its parent crate by path, and that crate's path
      # dependencies with it: stack-profile and stack-encrypt-derive. Their
      # `workspace = true` keys are read from the root Cargo.toml.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          predicate-quantifier: every
          filters: |
            fuzz:
              - "{\
                packages/stack-auth/**,\
                packages/stack-profile/**,\
                packages/stack-kms/**,\
                packages/stack-encrypt/**,\
                packages/stack-encrypt-derive/**,\
                Cargo.toml,\
                Cargo.lock,\
                mise.toml,\
                mise.test.toml,\
                .github/workflows/fuzz.yml\
                }"
              - "!**/*.md"
              - "!**/*.example"

      # Explicit default, not `|| 'true'`, which trips GitHub's inconsistent
      # treatment of the string 'false'. On a pull request, an answer other than
      # `true` or `false` means the filter did not decide, so the step fails
      # rather than write it.
      #
      # The event and the answers arrive through `env:`, not through a `${{ }}`
      # in the script. That lets `scripts/__tests__/workflow-selectors.test.mjs`
      # run this script and read back what it wrote.
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          FUZZ: ${{ steps.filter.outputs.fuzz }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            FUZZ=true
          fi
          answers=(
            "fuzz=$FUZZ"
          )
          for answer in "${answers[@]}"; do
            case "${answer#*=}" in
              true|false) echo "$answer" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "::error::The path filter answered '${answer#*=}' for ${answer%%=*}. The selector cannot decide which jobs to run."
                exit 1
                ;;
            esac
          done

  fuzz-regression:
    name: fuzz regression (${{ matrix.slug }})
    needs: [selector]
    # Not on the nightly schedule, which is the campaign's. A manual dispatch
    # runs both jobs. On a pull request, the selector decides. Written as
    # exclusions, not a list of events.
    if: >-
      github.event_name != 'schedule'
      && (github.event_name != 'pull_request'
          || needs.selector.outputs.fuzz == 'true')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { task: "fuzz:access-key", slug: access-key }
          - { task: "fuzz:jwt-decode", slug: jwt-decode }
          - { task: "fuzz:client-key", slug: client-key }
          - { task: "fuzz:sealed-value", slug: sealed-value }
          - { task: "fuzz:term-decode", slug: term-decode }
          - { task: "fuzz:check-record", slug: check-record }
          - { task: "fuzz:plan-build", slug: plan-build }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          version: 2026.4.0
          install: true
          working_directory: .
          cache: true
          # Must name runs-on's image; see scripts/__tests__/workflow-mise-cache-image.test.mjs
          cache_key_prefix: mise-v1-ubuntu-2404

      - name: Install the nightly toolchain (cargo-fuzz requires it)
        run: rustup toolchain install nightly --profile minimal

      # Each fuzz crate is its own workspace with its own target/.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            packages/stack-auth/fuzz
            packages/stack-kms/fuzz
            packages/stack-encrypt/fuzz
          key: ${{ matrix.slug }}

      # `-runs=0` replays the committed seed corpus once and exits without
      # fuzzing. The trailing args override the task's `-max_total_time`.
      - name: Build the harness and replay the seed corpus (${{ matrix.slug }})
        run: mise run ${{ matrix.task }} -- -runs=0

  fuzz-campaign:
    name: fuzz campaign (${{ matrix.slug }})
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `dir` and `target` drive the corpus path and `cargo fuzz cmin`.
        include:
          - { task: "fuzz:access-key",   slug: access-key,   dir: packages/stack-auth,    target: access_key_parse }
          - { task: "fuzz:jwt-decode",   slug: jwt-decode,   dir: packages/stack-auth,    target: jwt_decode }
          - { task: "fuzz:client-key",   slug: client-key,   dir: packages/stack-kms,     target: client_key_encoded }
          - { task: "fuzz:sealed-value", slug: sealed-value, dir: packages/stack-encrypt, target: sealed_value_decode }
          - { task: "fuzz:term-decode",  slug: term-decode,  dir: packages/stack-encrypt, target: term_decode }
          - { task: "fuzz:check-record", slug: check-record, dir: packages/stack-encrypt, target: check_record }
          - { task: "fuzz:plan-build",   slug: plan-build,   dir: packages/stack-encrypt, target: plan_build }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          version: 2026.4.0
          install: true
          working_directory: .
          cache: true
          # Must name runs-on's image; see scripts/__tests__/workflow-mise-cache-image.test.mjs
          cache_key_prefix: mise-v1-ubuntu-2404

      - name: Install the nightly toolchain (cargo-fuzz requires it)
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ${{ matrix.dir }}/fuzz
          key: ${{ matrix.slug }}

      # A cache key is write-once, so save under a per-run key and restore the
      # most recent prior corpus by prefix. The committed seeds come from the
      # checkout and merge with the restored corpus at run time.
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.dir }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.slug }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.slug }}-

      # The trailing `-max_total_time` (last value wins) overrides the task's.
      - name: Fuzz ${{ matrix.slug }}
        env:
          MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '120' }}
        run: mise run ${{ matrix.task }} -- "-max_total_time=$MAX_TOTAL_TIME"

      # Drops inputs that add no coverage, so the saved corpus stays small.
      # Skipped when the fuzz step found a crash.
      - name: Minimise the corpus (${{ matrix.slug }})
        working-directory: ${{ matrix.dir }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo +nightly fuzz cmin "$TARGET" --sanitizer none --target "$(rustc -vV | sed -n 's/^host: //p')"

      # Saved even on a crash: the grown corpus is still worth keeping, and the
      # crash input lives in artifacts/, not corpus/.
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.dir }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.slug }}-${{ github.run_id }}

      - name: Upload the crash reproducer
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.slug }}
          path: ${{ matrix.dir }}/fuzz/artifacts/**
          if-no-files-found: ignore

  # The summary job: the one job of this workflow that branch rules require.
  # It has the same name on every event. It passes when every needed job
  # passed or was skipped. Skipped counts as passed because the selector skips
  # a job whose trigger paths a change does not touch. A failed job still
  # fails this one, because it is in `needs` and reports its failure.
  summary:
    name: Fuzz summary
    needs: [selector, fuzz-regression, fuzz-campaign]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Needed results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A needed job reported '$result'."
                exit 1
                ;;
            esac
          done
