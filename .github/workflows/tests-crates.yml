name: Tests (crates)

# The stack-* crates and their three node bindings, ported from
# cipherstash-suite's `test-unit.yml` (the stack crates' share of it),
# `test-stack-auth.yml` and `test-stack-profile.yml` when the set was imported
# to the repository root.
#
# This is the only workflow that runs the stack-encrypt `tests/ui` trybuild
# binary: `crap-crates.yml` and `mutants.yml` both filter out `binary(ui)`.
# `scripts/__tests__/crates-ci.test.mjs` pins that, and that every mise task in
# the five crate `tasks.toml` files is reached from a root workflow.
#
# The filter keeps Markdown in: `stack-auth`'s crate docs are its README
# (`#![doc = include_str!("../README.md")]`), so a README edit changes the
# doctests. The suite's `!**.md` exclude would have skipped that change.

on:
  pull_request:
    paths:
      - packages/stack-auth/**
      - packages/stack-profile/**
      - packages/stack-kms/**
      - packages/stack-encrypt/**
      - conformance/stack-encrypt/**
      - conformance/vitaminc-aead/**
      - packages/stack-encrypt-derive/**
      - packages/stack-encrypt-downstream/**
      - packages/stack-encrypt-jsonpath/**
      - packages/stack-guest-abi/**
      - packages/vitaminc-aead/**
      - packages/recipher-frame/**
      - languages/typescript/packages/auth/**
      - languages/typescript/packages/profile/**
      - languages/typescript/packages/stack-auth-wasm/**
      # Root manifest, lockfile, toolchain pin and cargo config: each can
      # change what compiles without touching a crate. The toolchain pin in
      # particular changes the trybuild UI snapshots.
      - Cargo.toml
      - Cargo.lock
      - mise.toml
      - mise.test.toml
      - .cargo/config.toml
      - .config/nextest.toml
      - pnpm-lock.yaml
      - lychee.toml
      - .github/workflows/tests-crates.yml
  push:
    branches: [main]
    paths:
      - packages/stack-auth/**
      - packages/stack-profile/**
      - packages/stack-kms/**
      - packages/stack-encrypt/**
      - conformance/stack-encrypt/**
      - conformance/vitaminc-aead/**
      - packages/stack-encrypt-derive/**
      - packages/stack-encrypt-downstream/**
      - packages/stack-encrypt-jsonpath/**
      - packages/stack-guest-abi/**
      - packages/vitaminc-aead/**
      - packages/recipher-frame/**
      - languages/typescript/packages/auth/**
      - languages/typescript/packages/profile/**
      - languages/typescript/packages/stack-auth-wasm/**
      - Cargo.toml
      - Cargo.lock
      - mise.toml
      - mise.test.toml
      - .cargo/config.toml
      - .config/nextest.toml
      - pnpm-lock.yaml
      - lychee.toml
      - .github/workflows/tests-crates.yml
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  NEXTEST_PROFILE: ci

jobs:
  rust:
    name: fmt, clippy, nextest, doctests, rustdoc
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 60
    env:
      # Job-level, not workflow-level: RUSTFLAGS replaces the
      # `[target.wasm32-unknown-unknown]` rustflags in .cargo/config.toml,
      # which the stack-auth-wasm build in `node-bindings` needs.
      RUSTFLAGS: "-D warnings"
      # nextest is pinned in mise.test.toml, which mise loads only in the
      # test environment. See the mise-action step.
      MISE_ENV: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # At the repository root: the root mise.toml pins rust 1.94.1, which the
      # trybuild snapshots record. No install_args: `mise x` and `mise run`
      # install any tool of the toolset that is missing, uncached, so this
      # installs (and caches) the whole test toolset once. The cargo: tools
      # build from source.
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          version: 2026.4.0
          install: true
          working_directory: .
          cache: true
          # Must name runs-on's image; see scripts/__tests__/workflow-mise-cache-image.test.mjs
          cache_key_prefix: mise-v1-ubuntu-2204

      # mise caches its rust install as a symlink into ~/.rustup, which the
      # cache does not hold. On a runner image that already carries a 1.94.1
      # toolchain, a cache hit makes mise skip the components mise.toml
      # declares, and the lint steps below fail. A no-op when they are there.
      # Held by scripts/__tests__/crates-ci.test.mjs.
      - name: Add rustfmt and clippy to the pinned toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --locked --no-deps --workspace --all-targets --all-features -- -D warnings

      # Every test binary in the workspace, the trybuild `ui` binary included.
      - name: nextest
        run: mise x --env test -- cargo nextest run --locked --workspace --all-features

      # The run above turns every feature on at once; this tests the AEAD
      # crates' optional features one at a time.
      - name: vitaminc-aead feature combinations
        run: mise run test:vitaminc-aead:features

      - name: doctests
        run: mise run test:doc

      # Rustdoc with warnings as errors, one `doc:<crate>` task per crate.
      # `test:doc` runs the examples; only this sees a broken intra-doc link.
      # Each task builds the public docs, then the docs of private items too,
      # so a broken link in a private module's docs also fails.
      - name: rustdoc
        run: mise run doc

      # The stack-encrypt examples need live credentials, so they are built
      # here and run in tests-golang.yml `live`.
      - name: Build the stack-encrypt examples
        run: cargo build --locked -p stack-encrypt --examples

      # The crates release-plz publishes. `--dry-run` packages and compiles
      # each the way crates.io would (all six together, so each resolves the
      # others from cargo's temporary local registry rather than from
      # crates.io), catching a publish-blocker on the PR instead of in
      # release-crates on main: missing metadata, a runtime path dependency
      # with no `version`, or a crate that uses API its dependency's packaged
      # source does not have yet. stack-profile and stack-auth are in the list
      # because stack-kms and stack-encrypt depend on them: without them, cargo
      # resolves the published versions, which lag the tree. No token.
      # `--allow-dirty` tolerates files earlier steps leave in the tree. Once a
      # version is on crates.io, cargo warns rather than fails on a dry run of
      # it.
      #
      # One failure is a warning, not an error: a dependency cargo cannot find
      # on crates.io at all, when that dependency is named in
      # `awaiting_first_publish`. Those are crates of this workspace that will
      # be published but have not been yet, so no packaged build can resolve
      # them until they are. `cargo publish` refuses the crate that needs one
      # at release time, so nothing can ship by mistake. The crate that needs
      # it is dropped with a warning and the rest are packaged again, so they
      # are still verified. Any other failure fails the step, including a
      # dependency on a crate that is `publish = false` for good, such as
      # stack-guest-abi. Remove a name from the list once it is on crates.io.
      - name: Verify the stack-* crates package cleanly for crates.io
        run: |
          set -euo pipefail
          crates=(stack-profile stack-auth stack-kms stack-encrypt-jsonpath stack-encrypt-derive stack-encrypt)
          awaiting_first_publish=(recipher-frame)
          target_dir="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.target_directory')"
          while [ "${#crates[@]}" -gt 0 ]; do
            args=()
            for crate in "${crates[@]}"; do args+=(-p "$crate"); done
            # cargo's own status is kept in `status`: `|| status=$?` reads it
            # before anything else runs.
            status=0
            out="$(cargo publish --locked --dry-run --allow-dirty "${args[@]}" 2>&1)" || status=$?
            printf '%s\n' "$out"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            missing="$(sed -n 's/^ *no matching package named `\([^`]*\)` found$/\1/p' <<<"$out" | head -n 1)"
            needs="$(sed -n 's/^ *required by package `\([^ `]*\) v.*$/\1/p' <<<"$out" | head -n 1)"
            awaiting=0
            for crate in "${awaiting_first_publish[@]}"; do
              if [ "$crate" = "$missing" ]; then awaiting=1; fi
            done
            if [ -z "$missing" ] || [ -z "$needs" ] || [ "$awaiting" -eq 0 ]; then
              exit "$status"
            fi
            remaining=()
            for crate in "${crates[@]}"; do
              if [ "$crate" != "$needs" ]; then remaining+=("$crate"); fi
            done
            if [ "${#remaining[@]}" -eq "${#crates[@]}" ]; then
              exit "$status"
            fi
            echo "::warning title=${needs} not verified against crates.io::${needs} depends on ${missing}, a crate of this workspace that is waiting for its first publish, so it cannot be packaged against crates.io. cargo publish refuses ${needs} until ${missing} is published. The other crates are verified without it."
            crates=("${remaining[@]}")
            # The attempt left its temporary registry of packaged crates
            # behind; the next one must start without it, or cargo finds a
            # crate there with no checksum and stops.
            rm -rf -- "${target_dir}/package"
          done

  # rustdoc checks intra-doc links but never fetches a URL, so this checks
  # the web links in the crates' docs with lychee. It reads every crate under
  # packages/ except EQL, which has its own docs checks. lychee.toml holds
  # the shared settings and the addresses CI cannot fetch.
  doc-links:
    name: links in the Rust docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # A Rust file is mostly code, and its test strings hold URLs that are
      # not links (`http://localhost:3001/`, `https://kms/0`). This copies
      # only the doc comments of each file, as Markdown, to one file per
      # source file. Every other line becomes blank, so a reported line
      # number is the line in the source.
      - name: Extract the doc comments
        run: |
          out="$RUNNER_TEMP/rust-docs"
          git ls-files -z 'packages/*.rs' ':(exclude)packages/eql' |
            while IFS= read -r -d '' file; do
              mkdir -p "$out/$(dirname "$file")"
              awk '{
                if (match($0, /^[ \t]*\/\/[\/!]/)) {
                  line = substr($0, RLENGTH + 1)
                  sub(/^ /, "", line)
                  print line
                } else {
                  print ""
                }
              }' "$file" > "$out/$file.md"
            done

      # lychee from its release, checked against the SHA-256 of that release
      # asset (the `digest` GitHub records for it), so the binary that runs
      # is the one that was reviewed. To move to a new version, change both
      # lines together.
      - name: Install lychee
        env:
          LYCHEE_VERSION: v0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/lychee"
          mkdir -p "$dir"
          asset=lychee-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfL -o "$dir/$asset" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/${asset}"
          echo "${LYCHEE_SHA256}  $dir/$asset" | sha256sum --check --strict
          tar -xzf "$dir/$asset" -C "$dir" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$dir" >> "$GITHUB_PATH"

      # The doc comments' intra-doc links (`crate::Foo`) read as relative
      # file paths, which rustdoc checks already, so only web links are
      # checked here.
      - name: Check the web links in the doc comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          lychee --config lychee.toml
          --scheme https --scheme http
          "$RUNNER_TEMP/rust-docs/**/*.md"

      # The crates' Markdown: READMEs (some are a crate's docs), changelogs,
      # ADRs and guides. Links to files in the repository are checked too.
      - name: Check the links in the crates' Markdown
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: lychee --config lychee.toml 'packages/*/**/*.md'

  node-bindings:
    name: node bindings, napi typings, stack-auth-wasm
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          version: 2026.4.0
          install: true
          working_directory: .
          install_args: rust aqua:wasm-bindgen/wasm-pack
          cache: true
          # Must name runs-on's image; see scripts/__tests__/workflow-mise-cache-image.test.mjs
          cache_key_prefix: mise-v1-ubuntu-2204

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: 'pnpm'

      # node-pty falls back to `node-gyp rebuild` on Linux during any
      # workspace install. See scripts/__tests__/workflow-node-gyp.test.mjs.
      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each builds the binding's cdylib, copies it next to the package, and
      # runs the package's vitest suite against it.
      - name: stack-auth node binding
        run: mise run test:integration:stack-auth

      - name: stack-profile node binding
        run: mise run test:integration:stack-profile

      # Each binding's `build:debug` is `napi build --dts native.d.ts`: napi
      # writes its generated typings to `native.d.ts`, which is committed, and
      # never to `index.d.ts`, which is hand-written. Nothing else regenerates
      # `native.d.ts`, so a `#[napi]` signature change that is not rebuilt and
      # committed would leave typings that disagree with the `.node` ABI. The
      # build must leave the tracked tree as it found it: `git status` also
      # catches an untracked file the build drops into the package.
      - name: Guard committed napi typings against drift
        run: |
          pnpm --filter @cipherstash/auth run build:debug
          pnpm --filter @cipherstash/profile run build:debug
          dirty=$(git status --porcelain -- languages/typescript/packages/auth languages/typescript/packages/profile)
          if [ -n "$dirty" ]; then
            echo "$dirty"
            git diff -- languages/typescript/packages/auth languages/typescript/packages/profile
            echo "::error::napi build changed the auth or profile binding — run 'pnpm --filter @cipherstash/auth --filter @cipherstash/profile run build:debug' and commit native.d.ts. index.d.ts is hand-written and napi must not write it."
            exit 1
          fi

      # `test:integration:stack-auth` builds only the napi module, so the
      # wasm-inline Result tests self-skip there. Build the inline shim and
      # run them here. wasm-pack comes from the root mise.toml.
      - name: Build the wasm shim and run the wasm-inline Result tests
        run: |
          mise x -- pnpm --filter @cipherstash/auth run build:wasm
          pnpm --filter @cipherstash/auth exec vitest run __tests__/wasm-inline-result.test.ts

      - name: cargo check stack-auth-wasm (wasm32-unknown-unknown)
        run: cargo check --locked --target wasm32-unknown-unknown -p stack-auth-wasm

      - name: wasm-pack test stack-auth-wasm
        run: mise x -- wasm-pack test --node languages/typescript/packages/stack-auth-wasm
