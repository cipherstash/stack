name: "Require @cipherstash/auth changeset"

on:
  pull_request:
    paths:
      - packages/stack-auth/Cargo.toml
      - packages/stack-auth/src/**
      - packages/stack-auth/node/**
      - packages/stack-auth/wasm/**
      - .github/workflows/require-auth-npm-changeset.yml

defaults:
  run:
    shell: bash

jobs:
  require-npm-changeset:
    name: Require @cipherstash/auth changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install the Changesets parser
        run: npm install --no-workspaces --ignore-scripts --no-audit --no-fund

      - name: Check for an npm changeset
        env:
          ACTOR: ${{ github.actor }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [[ "$ACTOR" == "github-actions[bot]" ]] && \
             { [[ "$HEAD_REF" == "changeset-release/main" ]] || \
               [[ "$HEAD_REF" == release-plz-* ]]; }; then
            echo "Authenticated automated release PR; release intent was already consumed"
            exit 0
          fi

          if ! SHIPPED_CHANGES="$(
            git diff --name-only "${BASE_SHA}...HEAD" -- \
              packages/stack-auth/Cargo.toml \
              packages/stack-auth/src \
              packages/stack-auth/node \
              packages/stack-auth/wasm
          )"; then
            echo "::error::Failed to determine release-relevant stack-auth changes"
            exit 1
          fi

          if [[ -z "$SHIPPED_CHANGES" ]]; then
            echo "No release-relevant stack-auth changes found"
            exit 0
          fi

          if ! CHANGESETS="$(
            git diff --diff-filter=AM --name-only "${BASE_SHA}...HEAD" -- '.changeset/*.md'
          )"; then
            echo "::error::Failed to determine added or modified changesets"
            exit 1
          fi

          mapfile -t CHANGESET_FILES <<< "$CHANGESETS"
          node scripts/check-auth-npm-changeset.mjs "${CHANGESET_FILES[@]}"
