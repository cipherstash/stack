[package]
name = "eql-bindings"
version = "3.0.6"
edition = "2021"
description = "Canonical wire types for EQL payloads — single source of truth for Rust, TypeScript (ts-rs), and JSON Schema (schemars)."
# crates.io metadata. `license` is REQUIRED by crates.io — publish fails without
# it. The rest drive discoverability and the docs.rs / crates.io sidebar links.
license = "MIT"
repository = "https://github.com/cipherstash/stack"
homepage = "https://github.com/cipherstash/stack"
readme = "README.md"
keywords = ["encryption", "postgres", "eql", "cipherstash", "searchable"]
categories = ["cryptography", "database"]
include = [
  "Cargo.toml",
  "README.md",
  "CHANGELOG.md",
  "src/**",
  "bindings/**",
  "schema/**",
  "sql/**",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
# Direct dependency again at this layer: SchemaVersion's manual JsonSchema
# impl pins `const: 2` via serde_json::json!.
serde_json = "1"
# no-serde-warnings: ts-rs's serde-compat vocabulary doesn't include
# `skip_serializing_if`, so it warns and ignores it on SteVecEntry.a — which is
# exactly what we want (TS optionality is declared explicitly via
# `#[ts(optional = nullable)]`). Ignored-attr drift that DID matter would be
# caught by the `types:check` gate on the committed TS/JSON output.
ts-rs = { version = "10", features = ["no-serde-warnings"] }
schemars = "1"
# stack-encrypt lives in this repository (packages/stack-encrypt). The path
# builds against it in-tree; `version` is what crates.io resolves for the
# PUBLISHED eql-bindings. So the stack-encrypt this names must be on crates.io
# before eql-bindings is, and must carry the API `src/encryption.rs` compiles
# against (`Describe`, `Description`, `Label`, `target::transcode`). 0.1.0 did
# not: it shipped before they landed, and the path build cannot notice,
# because it compiles whatever the tree holds. Two guards compile this feature
# from the PACKAGED crate against the registry stack-encrypt instead:
# `cargo publish --dry-run --all-features` in test-eql.yml at PR time, and
# `publish_all_features` in ../../release-plz.toml at release time.
# No default features and no `dynamic`: the typed EQL v4 types need only
# Stack Encrypt's typed API. The `targets` feature turns `dynamic` on.
stack-encrypt = { path = "../../../stack-encrypt", version = "0.3.0", optional = true, default-features = false }
# The plaintext a target reads out of its `Protected` runtime value is held
# in `Zeroizing` until it is sealed, so the copy is wiped like the original.
zeroize = { version = "1", optional = true }
# `TargetError`.
thiserror = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
# `encoding::Base85Text`: RFC 1924 base85, the encoder and decoder Stack
# Encrypt writes the json_tree ciphertext `c` with, at the version it uses,
# so the lockfile holds one copy.
base85-simd = { version = "0.1.0", optional = true }
hex = { version = "0.4", optional = true }

[features]
default = []
# The EQL v4 types as Stack Encrypt targets: `eql_bindings::v4`, with
# `EncryptFrom` / `DecryptInto` on every producible type, for a Rust program
# that encrypts through `encrypt_as`. No `dynamic` layer.
stack-encrypt = [
  "dep:stack-encrypt",
  "dep:base64",
  "dep:base85-simd",
  "dep:hex",
  "dep:zeroize",
  "dep:thiserror",
]
# Conversions between chrono's `NaiveDate` / `DateTime<Utc>` and
# `v4::plaintext::Date` / `Timestamp`.
chrono = ["stack-encrypt", "stack-encrypt/chrono"]
# Conversions between rust_decimal's `Decimal` and `v4::plaintext::Decimal`.
rust_decimal = ["stack-encrypt", "stack-encrypt/rust_decimal"]
# The by-name dispatch a language binding needs (`encryption::targets`,
# `v4::targets`): an EQL type named at run time, a `ValueFrame` plaintext,
# and the target table a guest serializes. Turns on stack-encrypt's
# `dynamic` feature. The Go guest's `eql` build and the encryption tests
# enable it.
targets = [
  "stack-encrypt",
  "stack-encrypt/dynamic",
]

[package.metadata.docs.rs]
features = ["targets", "chrono", "rust_decimal"]

[dev-dependencies]
# Parity oracle: tests/catalog_parity.rs asserts the v3 domain inventory
# exactly covers eql_domains::CATALOG, so the types here cannot drift from
# the generated SQL surface.
eql-domains = { path = "../eql-domains" }
# `encoding`'s round-trip properties. The version eql-domains uses.
proptest = "1"
