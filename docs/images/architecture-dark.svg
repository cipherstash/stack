<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 660" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="CipherStash architecture diagram"><rect width="1400" height="660" fill="#060606"></rect><defs>
    <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5b1f"></path></marker>
    <marker id="aM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(234,232,221,0.72)"></path></marker>
  </defs><path d="M28,48 H1352 V328 H880 V500 H28 Z" fill="none" stroke="#c8f031" stroke-dasharray="6 6"></path><text x="40" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.1em"><tspan fill="#c8f031">YOUR TRUST BOUNDARY</tspan><tspan fill="rgba(234,232,221,0.5)"> — PLAINTEXT AND DATA KEYS NEVER LEAVE</tspan></text><g><rect x="60" y="80" width="420" height="360" rx="2" fill="#0d0d0d" stroke="rgba(234,232,221,0.15)"></rect><text x="84" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#eae8dd" letter-spacing="0.08em">YOUR APP</text><text x="456" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="rgba(234,232,221,0.5)" letter-spacing="0.08em" text-anchor="end">[TYPESCRIPT]</text><text x="84" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#c8f031">@cipherstash/stack</text><line x1="84" y1="166" x2="456" y2="166" stroke="rgba(234,232,221,0.10)"></line><text x="84" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="rgba(234,232,221,0.72)"><tspan fill="rgba(234,232,221,0.5)">· </tspan><tspan fill="rgba(234,232,221,0.72)">encrypt / decrypt in-app</tspan></text><text x="84" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="rgba(234,232,221,0.72)"><tspan fill="rgba(234,232,221,0.5)">· </tspan><tspan fill="rgba(234,232,221,0.72)">search on </tspan><tspan fill="#ff5b1f">ciphertext</tspan></text><rect x="84" y="244" width="372" height="172" rx="2" fill="#131311" stroke="rgba(234,232,221,0.15)"></rect><text x="102" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="rgba(234,232,221,0.5)" letter-spacing="0.1em">DATA KEY DERIVATION</text><text x="438" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#c8f031" letter-spacing="0.08em" text-anchor="end">[LOCAL]</text><line x1="102" y1="284" x2="438" y2="284" stroke="rgba(234,232,221,0.10)"></line><text x="102" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#c8f031">your client key</tspan><tspan fill="rgba(234,232,221,0.5)"> — unique to this app</tspan></text><text x="102" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="rgba(234,232,221,0.72)">+ key component from ZeroKMS</tspan></text><line x1="102" y1="354" x2="438" y2="354" stroke="rgba(234,232,221,0.10)"></line><text x="102" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#eae8dd">= per-value data keys</tspan></text><text x="102" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"><tspan fill="rgba(234,232,221,0.5)">derived here — never leave the app</tspan></text></g><g><rect x="920" y="80" width="380" height="200" rx="2" fill="#0d0d0d" stroke="rgba(234,232,221,0.15)"></rect><text x="944" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#eae8dd" letter-spacing="0.08em">YOUR DATABASE</text><text x="1276" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="rgba(234,232,221,0.5)" letter-spacing="0.08em" text-anchor="end">[POSTGRESQL]</text><text x="944" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="rgba(234,232,221,0.72)">PostgreSQL · JSONB</text><line x1="944" y1="166" x2="1276" y2="166" stroke="rgba(234,232,221,0.10)"></line><text x="944" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="rgba(234,232,221,0.72)"><tspan fill="rgba(234,232,221,0.5)">· </tspan><tspan fill="rgba(234,232,221,0.72)">stores </tspan><tspan fill="#ff5b1f">ciphertext only</tspan></text><text x="944" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="rgba(234,232,221,0.72)"><tspan fill="rgba(234,232,221,0.5)">· </tspan><tspan fill="rgba(234,232,221,0.72)">searchable via EQL</tspan></text></g><g><rect x="920" y="376" width="380" height="230" rx="2" fill="#0d0d0d" stroke="rgba(234,232,221,0.15)"></rect><text x="944" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#eae8dd" letter-spacing="0.08em">ZEROKMS</text><text x="1276" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="rgba(234,232,221,0.5)" letter-spacing="0.08em" text-anchor="end">[CIPHERSTASH]</text><text x="944" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="rgba(234,232,221,0.72)">holds one key component — never a whole key</text><line x1="944" y1="462" x2="1276" y2="462" stroke="rgba(234,232,221,0.10)"></line><text x="944" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="rgba(234,232,221,0.72)"><tspan fill="rgba(234,232,221,0.5)">· </tspan><tspan fill="rgba(234,232,221,0.72)">unique key component per value</tspan></text><text x="944" y="516" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="rgba(234,232,221,0.72)"><tspan fill="rgba(234,232,221,0.5)">· </tspan><tspan fill="rgba(234,232,221,0.72)">bulk key ops — fast</tspan></text><line x1="944" y1="568" x2="1276" y2="568" stroke="rgba(234,232,221,0.10)"></line><text x="944" y="592" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="rgba(234,232,221,0.5)" letter-spacing="0.04em">EVERY DECRYPTION LOGGED → SOC 2 / ISO 27001</text></g><g><rect x="936" y="364" width="361" height="24" rx="2" fill="#060606" stroke="#c8f031"></rect><text x="950" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#c8f031" letter-spacing="0.06em">CIPHERSTASH NEVER SEES PLAINTEXT OR DATA KEYS</text></g><line x1="480" y1="150" x2="918" y2="150" stroke="#ff5b1f" stroke-width="1.25" marker-end="url(#aC)"></line><text x="700" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="undefined" text-anchor="middle"><tspan fill="#ff5b1f">ciphertext — EQL JSON payload</tspan></text><line x1="920" y1="218" x2="482" y2="218" stroke="#ff5b1f" stroke-width="1.25" marker-end="url(#aC)"></line><text x="700" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="undefined" text-anchor="middle"><tspan fill="rgba(234,232,221,0.5)">encrypted rows</tspan></text><path d="M250,440 V540 H918" fill="none" stroke="rgba(234,232,221,0.72)" stroke-width="1.25" marker-end="url(#aM)"></path><text x="584" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="undefined" text-anchor="middle"><tspan fill="rgba(234,232,221,0.5)">per-value key requests (bulk)</tspan></text><line x1="918" y1="420" x2="482" y2="420" stroke="rgba(234,232,221,0.72)" stroke-width="1.25" marker-end="url(#aM)"></line><text x="700" y="408" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="undefined" text-anchor="middle"><tspan fill="rgba(234,232,221,0.5)">key component — ½ of each key</tspan></text></svg>