name: Prisma Example README E2E

# Outside-in walkthrough of `languages/typescript/examples/prisma/README.md`'s "Run it"
# section: copies .env.example, brings up the bundled Postgres, runs
# `pnpm install`, `pnpm emit`, `pnpm migration:plan --name initial`,
# `pnpm migration:apply`, then `pnpm start`, asserting each command
# exits 0 and that `pnpm start` prints the documented "Expected
# output" lines.
#
# Lives in the root `e2e/` workspace as
# `tests/prisma-example-readme.e2e.test.ts`. Auth-gated: skips
# cleanly on fork PRs where ZeroKMS secrets are unavailable.

on:
  push:
    branches:
      - main
    # The same files as the `selector` job's filter.
    # scripts/__tests__/workflow-paths-filter-parity.test.mjs compares them.
    paths:
      - 'languages/typescript/examples/prisma/**'
      - '.github/workflows/prisma-example-readme-e2e.yml'
      # The walkthrough encrypts against the live service, so the native
      # binding and the action that builds it are inputs to this suite. Added
      # with that build step: without them a protect-ffi change would reach main
      # having never run the walkthrough. The `selector` job's filter repeats
      # them for `pull_request`, which is what makes that a gate rather than a
      # report — a PR touching any of these runs the walkthrough before the
      # change lands, not after.
      - '.github/actions/build-ffi-binding/**'
      - '.github/actions/build-auth-binding/**'
      - 'languages/typescript/packages/protect-ffi/crates/**'
      - 'languages/typescript/packages/protect-ffi/src/**'
      - 'languages/typescript/packages/protect-ffi/Cargo.toml'
      - 'languages/typescript/packages/protect-ffi/Cargo.lock'
      - 'languages/typescript/packages/protect-ffi/package.json'
      - 'languages/typescript/packages/protect-ffi/mise.toml'
      # Out of that package, and a compile input all the same: the cdylib
      # crate carries
      # `eql-bindings = { path = "../../../../../../packages/eql/crates/eql-bindings" }`, so the
      # EQL wire types are linked into the `index.node` this job encrypts
      # through. The native cache key in `.github/actions/build-ffi-binding`
      # hashes both, so an edit here misses that cache and the binding gets
      # rebuilt — correctly. Without these two entries the miss never happens,
      # because the workflow does not trigger at all: a payload-encoding change
      # under packages/eql/crates merges with this walkthrough green by absence.
      # Pinned by scripts/__tests__/wasm-build-inputs-paths-filter.test.mjs.
      - 'packages/eql/crates/**'
      - 'packages/eql/Cargo.toml'
  # No path filter: a workflow that a path filter skips leaves its required
  # checks pending, and GitHub's documentation on required status checks says
  # that blocks a merge. The trigger paths are in the `selector` job instead.
  pull_request:
    branches:
      - '**'

jobs:
  # The selector job: it decides which jobs a pull request runs. It runs on
  # every event and is never skipped, because the gated jobs need it. When it
  # cannot decide it fails, and that fails the summary job: a selector that
  # answered nothing would skip every gated job, and the summary job counts a
  # skipped job as passed (ADR 0003).
  #
  # On a GitHub-hosted runner because the gated jobs wait for it. No checkout:
  # on a pull request, dorny/paths-filter lists the changed files through the
  # GitHub API.
  selector:
    name: Selector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Each output is named after the filter that decides it.
    # `scripts/__tests__/workflow-selectors.test.mjs` follows a job's `if:` to
    # its filter by that name.
    outputs:
      readme: ${{ steps.decide.outputs.readme }}
    steps:
      # Only on a pull request, which has a base to compare with. Other events
      # select every job in the step below.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            # The same list as `on.push.paths`, which says why each entry
            # is there.
            readme:
              - "languages/typescript/examples/prisma/**"
              - ".github/workflows/prisma-example-readme-e2e.yml"
              - ".github/actions/build-ffi-binding/**"
              - ".github/actions/build-auth-binding/**"
              - "languages/typescript/packages/protect-ffi/crates/**"
              - "languages/typescript/packages/protect-ffi/src/**"
              - "languages/typescript/packages/protect-ffi/Cargo.toml"
              - "languages/typescript/packages/protect-ffi/Cargo.lock"
              - "languages/typescript/packages/protect-ffi/package.json"
              - "languages/typescript/packages/protect-ffi/mise.toml"
              - "packages/eql/crates/**"
              - "packages/eql/Cargo.toml"

      # Explicit default, not `|| 'true'`, which trips GitHub's inconsistent
      # treatment of the string 'false'. On a pull request, an answer other than
      # `true` or `false` means the filter did not decide, so the step fails
      # rather than write it.
      #
      # The event and the answers arrive through `env:`, not through a `${{ }}`
      # in the script. That lets `scripts/__tests__/workflow-selectors.test.mjs`
      # run this script and read back what it wrote.
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          README: ${{ steps.filter.outputs.readme }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            README=true
          fi
          answers=(
            "readme=$README"
          )
          for answer in "${answers[@]}"; do
            case "${answer#*=}" in
              true|false) echo "$answer" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "::error::The path filter answered '${answer#*=}' for ${answer%%=*}. The selector cannot decide which jobs to run."
                exit 1
                ;;
            esac
          done

  walkthrough:
    name: Run README walkthrough
    runs-on: blacksmith-4vcpu-ubuntu-2404

    # Skip cleanly on fork PRs where secrets aren't available. The
    # test's `describe.skipIf(!authConfigured)` would also skip, but
    # gating at the job level produces a clean "skipped" status.
    # Every OTHER event runs, which is why this gates on "not a fork PR" rather
    # than listing the event names allowed through: the listing form skipped
    # the job on `workflow_dispatch` in integration-protect-ffi.yml, making a
    # declared manual trigger do nothing. Enforced by
    # scripts/__tests__/workflow-dispatch-job-conditions.test.mjs.
    needs: [selector]
    # The first clause is the selector's answer; both are exclusions of
    # pull_request, not lists of events.
    if: >-
      (github.event_name != 'pull_request'
       || needs.selector.outputs.readme == 'true')
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)

    env:
      CS_WORKSPACE_CRN: ${{ vars.CS_WORKSPACE_CRN }}
      CS_CLIENT_ID: ${{ vars.CS_CLIENT_ID }}
      CS_CLIENT_KEY: ${{ secrets.CS_CLIENT_KEY }}
      CS_CLIENT_ACCESS_KEY: ${{ secrets.CS_CLIENT_ACCESS_KEY }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: 'pnpm'

      # node-pty's install hook falls back to `node-gyp rebuild` when no
      # linux-x64 prebuild matches. pnpm/action-setup v6 no longer ships
      # node-gyp on PATH, so install it explicitly.
      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A missing / rotated / fork-PR-absent secret makes the walkthrough skip
      # its live steps silently, hiding regressions behind a green job. Fail loud.
      # First, ahead of the binding build: this costs seconds and that costs
      # minutes on a cold cache.
      - name: Require CipherStash secrets
        uses: ./.github/actions/require-cs-secrets
        with:
          workspace-crn: ${{ vars.CS_WORKSPACE_CRN }}
          client-id: ${{ vars.CS_CLIENT_ID }}
          client-key: ${{ secrets.CS_CLIENT_KEY }}
          client-access-key: ${{ secrets.CS_CLIENT_ACCESS_KEY }}

      # The walkthrough encrypts against the live service, so it needs the
      # native binding — `languages/typescript/packages/protect-ffi` is a workspace package now, so
      # `index.node` is a build output rather than tarball contents. This step
      # runs on push to main and on any PR whose diff matches the paths filter
      # above, the absorption PR that introduced the need included: that PR
      # edits this workflow, the build action, and the package itself, and all
      # three are in the filter. The exception is a fork PR — it triggers the
      # workflow, but the job's `if` skips it for want of CS_* credentials.
      - name: Build the protect-ffi binding
        uses: ./.github/actions/build-ffi-binding

      - name: Build the @cipherstash/auth binding
        uses: ./.github/actions/build-auth-binding

      # Build via turbo so `^build` on `@cipherstash/stack-prisma` and
      # its `@cipherstash/stack` peer is honoured. The test's
      # `pnpm install` subprocess inside `languages/typescript/examples/prisma/` is a no-op
      # given the lockfile is already in steady state from this step.
      - name: Build @cipherstash/stack-prisma
        run: pnpm exec turbo run build --filter @cipherstash/stack-prisma

      - name: Run README walkthrough e2e
        run: pnpm exec turbo run test:e2e --filter @cipherstash/e2e -- --run tests/prisma-example-readme.e2e.test.ts

      - name: Tear down bundled Postgres (best-effort)
        if: always()
        working-directory: languages/typescript/examples/prisma
        run: docker compose down -v || true

  # The summary job: the one job of this workflow that branch rules require.
  # It has the same name on every event. It passes when every needed job
  # passed or was skipped. Skipped counts as passed because the selector skips
  # a job whose trigger paths a change does not touch. A failed job still
  # fails this one, because it is in `needs` and reports its failure.
  summary:
    name: Prisma example README summary
    needs: [selector, walkthrough]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Needed results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A needed job reported '$result'."
                exit 1
                ;;
            esac
          done
