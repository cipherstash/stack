["test:integration:stack-auth"]
description = "Run stack-auth Node.js integration tests"
dir = "{{config_root}}/packages/stack-auth/node"
run = [
  "npm install",
  "cargo build -p stack-auth-node --features stack-auth-node/test-utils",
  "node -e \"const fs=require('fs'),p=require('path'); const ext=process.platform==='win32'?'dll':process.platform==='darwin'?'dylib':'so'; const src=p.resolve('..','..','..','target','debug',ext==='dll'?'stack_auth_node.dll':'libstack_auth_node.'+ext); fs.copyFileSync(src,'stack-auth-node.node')\"",
  "npx vitest run",
]
