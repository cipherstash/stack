# Rustdoc with warnings as errors: a broken intra-doc link or a rustdoc
# warning fails the build. The root `doc` task fans out over every
# `doc:<crate>`; the root `test:doc` runs the doc examples.
["doc:stack-kms-vault"]
description = "Build docs for stack-kms-vault with all features (warnings are errors)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc -p stack-kms-vault --no-deps --all-features"

# The Vault Transit backend against a running `vault server -dev`
# (tests/vault_dev.rs). The test skips itself when STACK_KMS_VAULT_ADDR is
# unset, which is right for `cargo nextest run --workspace` and wrong here: a
# skip would read as a pass. So this task refuses to run without it.
# tests-crates.yml's `vault` job runs Vault as a service and calls this task.
#
#   docker run -d --rm -p 8200:8200 -e VAULT_DEV_ROOT_TOKEN_ID=root hashicorp/vault:1.20
#   STACK_KMS_VAULT_ADDR=http://127.0.0.1:8200 mise run test:vault:stack-kms-vault
["test:vault:stack-kms-vault"]
description = "Run the stack-kms-vault tests against vault server -dev (needs STACK_KMS_VAULT_ADDR)"
run = """
if [ -z "${STACK_KMS_VAULT_ADDR:-}" ]; then
  echo "error: set STACK_KMS_VAULT_ADDR (for example http://127.0.0.1:8200)" >&2
  exit 1
fi
mise x --env test -- cargo nextest run --locked -p stack-kms-vault --all-features --test vault_dev --no-tests=fail
"""
