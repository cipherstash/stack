version: 2
updates:
  # ── npm dependencies (pnpm workspace) ──────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Australia/Sydney
    # Wait for community discovery before opening PRs
    # (lirantal/npm-security-best-practices #2: install with cooldown).
    #
    # No `semver-major-days:`, and it is not an oversight. That key delays
    # major VERSION update PRs, and the `ignore` below stops Dependabot
    # proposing one at all; nor could it apply on the security path, because
    # "the cooldown option is only available for version updates, not
    # security updates" (Dependabot options reference). So it would be
    # configuration that does nothing — the same reason the cargo entry
    # below leaves `day:` out of its monthly schedule. Enforced by
    # e2e/tests/supply-chain.e2e.test.ts, in both directions.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - supply-chain
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      type-definitions:
        patterns:
          - "@types/*"
    ignore:
      # 0.x bumps ship breaking type changes (e.g. 0.2 → 0.3 tightened the
      # FailureOption constraint). Review and apply manually.
      - dependency-name: "@byteslice/result"
      # Major bumps are reviewed and applied manually, not by Dependabot.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # ── Cargo (languages/typescript/packages/protect-ffi — one of two Rust workspaces) ───
  # Absorbing protect-ffi brought a 494-crate Cargo.lock in-tree. osv-scanner
  # already sees it — `--recursive ./` walks the tree and extracts every
  # lockfile it recognises — so known advisories were visible from day one, but
  # nothing proposed routine version updates. That is the gap this entry
  # closes, and the only one it closes. Coverage is enforced by
  # e2e/tests/supply-chain.e2e.test.ts, which derives the required ecosystems
  # from the lockfiles actually present rather than from a list.
  - package-ecosystem: cargo
    # NOT `/`. The Cargo workspace root is the package directory — Cargo.toml
    # and Cargo.lock live there, the crate itself under crates/protect-ffi.
    # A misaimed directory fails silently: Dependabot records "no manifest
    # found" on a log page nobody visits, and the symptom is simply that no PR
    # ever arrives. The e2e test asserts this path holds a Cargo.toml.
    directory: /languages/typescript/packages/protect-ffi
    # Lockfile only, like the EQL entry below and for the same reason: this
    # workspace depends by path on eql-bindings, a member of the EQL
    # workspace. A requirement this entry raised could be written into
    # packages/eql/crates/eql-bindings/Cargo.toml without the EQL Cargo.lock,
    # the #1205 shape one edge over. An update that needs a manifest change,
    # in this workspace or that one, is dropped and made by hand. This applies
    # to Dependabot security updates too; osv-scanner still reports the
    # advisory. Held by
    # scripts/__tests__/dependabot-cargo-cross-workspace.test.mjs.
    versioning-strategy: lockfile-only
    # Monthly, where npm and actions are weekly. The deviation is about
    # validation cost, not risk appetite: a Cargo.lock bump is checked by
    # tests-rust.yml — one Blacksmith job, 45-minute timeout, cargo test +
    # clippy on host AND wasm32 — and the release additionally cross-builds
    # six platform binaries. Security fixes are not delayed by this: Dependabot
    # security updates are driven by alerts, not by `schedule`.
    #
    # No `day:`, unlike the two weekly entries — that key picks a weekday for
    # `interval: weekly` and has nothing to pick here. Left out rather than
    # copied across, so it does not read as configuration that does nothing.
    schedule:
      interval: monthly
    # Same community-discovery window as npm above and pnpm's
    # minimumReleaseAge. crates.io has no unpublish, but it does have
    # yanking, and a yank is the signal this window waits for.
    #
    # No `semver-major-days:` here either, for the reason recorded on the npm
    # entry: majors are ignored below, and cooldown never reaches the security
    # path, so a major window would have nothing to delay.
    cooldown:
      default-days: 7
    # Lower than npm's 10. Each open PR here costs a full native rebuild to
    # validate, and the grouping below means one PR normally covers everything.
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - supply-chain
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      # One PR for the whole minor/patch sweep, as with actions below. Cargo
      # resolves the lock as a unit, so per-crate PRs each re-resolve the
      # others and conflict on every merge.
      #
      # Read the diff; do not rubber-stamp it. Dependabot classifies update
      # types from the version numbers alone, so a 0.2 → 0.3 bump lands in this
      # group as "minor" even though cargo treats it as breaking — several
      # direct deps here are 0.x (wasm-bindgen, js-sys, web-sys, getrandom,
      # serde-wasm-bindgen). The `ignore` on semver-major below does not catch
      # those. Same trap the @byteslice/result note records on the npm side.
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # The CipherStash crates are pinned with EXACT `=` requirements in
      # crates/protect-ffi/Cargo.toml and are one release train —
      # cipherstash-client, cts-common, stack-auth and stack-profile all sit at
      # the same `=` version. Dependabot bumping a subset would rewrite one `=`
      # pin and leave the rest, and the crates do not tolerate skew (a skewed
      # @cipherstash/auth platform set was the npm form of this, the rc.2 B1
      # bug). Bump them together, manually.
      #
      # Caveat worth knowing: `ignore` suppresses Dependabot SECURITY PRs too,
      # not just version updates. osv-scanner is the compensating control —
      # it scans this lockfile on every PR and on a weekday schedule, and
      # surfaces crates.io advisories in code scanning.
      - dependency-name: "cipherstash-client"
      - dependency-name: "cts-common"
      - dependency-name: "stack-auth"
      - dependency-name: "stack-profile"
      - dependency-name: "eql-bindings"
      - dependency-name: "vitaminc"
      # Major bumps are reviewed and applied manually, not by Dependabot.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # ── Cargo (packages/eql — the second Rust workspace) ───────────
  # The EQL subtree brought a second Cargo workspace: six members
  # (crates/eql-{domains,codegen,tests-macros,bindings}, tests/sqlx and
  # tests/encryption) and its own Cargo.lock. It needs its own entry because
  # Dependabot's cargo `directory:` is a single workspace root, not a glob —
  # the protect-ffi entry above cannot reach it. The lockfile-to-ecosystem
  # check in e2e/tests/supply-chain.e2e.test.ts asserts coverage per
  # ECOSYSTEM, so it was already satisfied by that entry and would NOT have
  # caught this gap; the symptom would simply have been that no PR ever
  # arrived.
  - package-ecosystem: cargo
    # The workspace root, where Cargo.toml and Cargo.lock live. Not `/`, and
    # not a crate directory — same trap as the protect-ffi entry documents.
    directory: /packages/eql
    # Lockfile only: this entry must never edit a manifest. The workspace
    # depends by path on root-workspace crates (see the ignores below), so a
    # requirement it would raise can live in the ROOT Cargo.toml, outside this
    # workspace; editing it there without the root Cargo.lock broke every root
    # `--locked` build (#1205, #1207). An update that needs a manifest change is
    # dropped rather than proposed, and is made by hand.
    #
    # That includes Dependabot SECURITY updates: `versioning-strategy` governs
    # them as well as version updates, so a security fix that needs a
    # requirement raised gets no PR from this entry. osv-scanner still reports
    # the advisory (it reaches this lockfile with `--recursive ./`), and the fix
    # is made by hand. Held, with the other two cargo entries, by
    # scripts/__tests__/dependabot-cargo-cross-workspace.test.mjs.
    versioning-strategy: lockfile-only
    # Monthly, matching protect-ffi and for the same reason: validating a
    # Cargo.lock bump here means the sharded SQLx matrix in test-eql.yml, which
    # compiles the full dependency tree and runs against live Postgres with
    # CipherStash credentials. The schedule does not delay security fixes —
    # those are driven by alerts, not by `schedule` — though `lockfile-only`
    # above still drops one that needs a manifest edit.
    #
    # No `day:`, for the reason recorded above: it applies to `interval: weekly`
    # and would be configuration that does nothing.
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - supply-chain
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # `cipherstash-client = "=0.42.0"` in tests/sqlx/Cargo.toml — the SAME
      # exact pin, at the SAME version, as languages/typescript/packages/protect-ffi. That is not a
      # coincidence and it is the reason the subtree was imported: the two now
      # share one release train, and a Dependabot PR that moved one workspace
      # and not the other would reintroduce precisely the skew the absorption
      # removed. Bump both, manually, in step with the npm catalog.
      #
      # Same caveat as above: `ignore` suppresses security PRs too. osv-scanner
      # is the compensating control and already reaches this lockfile
      # (`--recursive ./`).
      - dependency-name: "cipherstash-client"
      - dependency-name: "cts-common"
      - dependency-name: "stack-auth"
      - dependency-name: "stack-profile"
      # Published from this workspace by release-plz. A Dependabot PR proposing
      # a registry version for a crate we release here would fight the lockstep
      # version hook (scripts/sync-lockstep-versions.mjs).
      - dependency-name: "eql-bindings"
      # Inherited from the ROOT workspace. tests/encryption depends by path on
      # packages/stack-kms and packages/stack-encrypt, and eql-bindings on
      # stack-encrypt behind its optional `stack-encrypt` feature. Those crates
      # declare these `{ workspace = true }`, so their requirements come from
      # the root Cargo.toml even when built here. The root entry below ignores
      # them because they move by hand: the root manifest pins recipher,
      # clww-ore and ore-rs with `=`, and the Go guest pins recipher with `=`.
      # Without these lines this entry bumped them in this lockfile and, to
      # satisfy the exact pins, rewrote the root Cargo.toml without touching
      # the root Cargo.lock or the guest's pin, breaking every root `--locked`
      # build and the guest (#1205, #1207). vitaminc* also keeps eql-bindings
      # on the line stack-encrypt and the guest build against.
      # versioning-strategy above already stops the manifest edit; these keep
      # the lockfile from moving these crates apart from the root's.
      # scripts/__tests__/dependabot-eql-inherited-ignores.test.mjs fails when
      # the root entry ignores a crate this entry does not.
      - dependency-name: "recipher"
      - dependency-name: "clww-ore"
      - dependency-name: "ore-rs"
      - dependency-name: "zerokms-protocol"
      - dependency-name: "vitaminc*"
      # Major bumps are reviewed and applied manually, not by Dependabot.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # ── Cargo (the root workspace — the stack-* crates) ─────────────
  # The root workspace (the six stack-* crates and the three node binding
  # crates) and the five detached workspaces beside it: the three cargo-fuzz
  # crates and the two Go WASI guests. Each has its own Cargo.lock, and each
  # is its own workspace root, so each is listed.
  - package-ecosystem: cargo
    directories:
      - /
      - /packages/stack-auth/fuzz
      - /packages/stack-kms/fuzz
      - /packages/stack-encrypt/fuzz
      - /languages/golang/encrypt/guest
      - /languages/golang/auth/guest
    # Lockfile only, like the other two cargo entries. Every one of these
    # workspaces shares crates by path with another: the fuzz crates and both
    # guests depend on root-workspace crates, the encrypt guest also on
    # eql-bindings, and the EQL workspace on stack-encrypt and stack-kms. Those
    # root crates take `{ workspace = true }` requirements from the root
    # Cargo.toml, so a manifest edit made for any one of these lockfiles can
    # leave the others stale under `--locked`. An update that needs a manifest
    # change, security updates included, is dropped and made by hand; osv-scanner
    # still reports the advisory. Held by
    # scripts/__tests__/dependabot-cargo-cross-workspace.test.mjs.
    versioning-strategy: lockfile-only
    # Monthly, matching the other two cargo entries.
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - supply-chain
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Released from cipherstash-suite: stack-auth's API carries their types,
      # so they move in lockstep with the suite, by hand. The guests pin them
      # with `=`; the root Cargo.toml pins recipher with `=`, and gives
      # cts-common and zerokms-protocol caret requirements.
      - dependency-name: "cts-common"
      - dependency-name: "zerokms-protocol"
      - dependency-name: "recipher"
      # The order schemes, from cipherstash/ore.rs, moved by hand with
      # vitaminc: a new release can change every stored order term.
      - dependency-name: "clww-ore"
      - dependency-name: "ore-rs"
      # vitaminc is pinned at 0.8.0 across the crates. The encrypt guest
      # takes it only through stack-encrypt's re-exports, so it cannot
      # resolve a second version; one would fail at `ValueFrame: Decrypt`.
      - dependency-name: "vitaminc*"
      # Major bumps are reviewed and applied manually, not by Dependabot.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # ── Go (languages/golang) ──────────────────────────────────────
  - package-ecosystem: gomod
    directory: /languages/golang
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - supply-chain
    commit-message:
      prefix: "chore"
      include: scope
    ignore:
      # Major bumps are reviewed and applied manually, not by Dependabot.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # ── pip (.github/impact-gate — the advisory ImpactGate toolchain) ──
  # impact.yml installs this hashed requirements.txt with `--require-hashes
  # --no-deps`, so every transitive package is a pin here and nothing resolves
  # in CI. Dependabot regenerates the hashes when it bumps one. Any change here
  # also changes the baseline cache key, so a bump costs one cold rebuild.
  - package-ecosystem: pip
    directory: /.github/impact-gate
    # Monthly, matching the other non-npm toolchains: the tools only feed an
    # advisory report, and security fixes are driven by alerts, not `schedule`.
    # No `day:`, for the reason recorded on the cargo entries.
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - supply-chain
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      # impact-gate constrains lizard (it excludes 1.24.0), so the set moves
      # together in one PR rather than as conflicting per-package bumps.
      impact-gate-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major bumps are reviewed and applied manually, not by Dependabot.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # ── GitHub Actions ─────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major bumps are reviewed and applied manually, not by Dependabot.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # ── Docker ─────────────────────────────────────────────────────
  # The Alpine image the musl binaries are built in. Only the `FROM` digest is
  # read here: the `apk` pins in that Dockerfile are moved by hand, and
  # musl-build-image.yml says when they stop resolving.
  - package-ecosystem: docker
    directory: /.github/docker/musl-build
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - supply-chain
    commit-message:
      prefix: "chore"
      include: scope
    ignore:
      # A new Node.js major (node:24-alpine) is reviewed and applied manually,
      # with the host legs' Node version, not by Dependabot.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
