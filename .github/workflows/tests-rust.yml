name: Tests (Rust)

# The Rust half of languages/typescript/packages/protect-ffi. Path-filtered and separate from
# tests.yml because it is the only Rust in the repo.
#
# Since the absorption these checks ran NOWHERE. Phase 1 deliberately moved
# `cargo test` + `cargo fmt --check` behind `test:cargo` and clippy behind
# `mise run lint:rust`, to keep cargo off every contributor's default
# `pnpm test` — but no root workflow picked them back up.
# `languages/typescript/packages/protect-ffi/src/lintWiring.test.ts` asserts the split from the
# manifest side; this is the other half, and that test now reads this file.
#
# The trigger paths are broader than `crates/**`: dependency, feature and
# toolchain changes all alter what cargo builds without touching a .rs file.
# The `selector` job holds them, and `summary` reports the result (ADR 0003).

on:
  # No path filter: a workflow that a path filter skips leaves its required
  # checks pending, and GitHub's documentation on required status checks says
  # that blocks a merge.
  pull_request: {}
  # No path filter here either, so main runs a superset of what pull requests
  # run.
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The selector job: it decides which jobs a pull request runs. It runs on
  # every event and is never skipped, because the gated jobs need it. When it
  # cannot decide it fails, and that fails the summary job: a selector that
  # answered nothing would skip every gated job, and the summary job counts a
  # skipped job as passed (ADR 0003).
  #
  # On a GitHub-hosted runner because the gated jobs wait for it. No checkout:
  # on a pull request, dorny/paths-filter lists the changed files through the
  # GitHub API.
  selector:
    name: Selector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Each output is named after the filter that decides it.
    # `scripts/__tests__/workflow-selectors.test.mjs` follows a job's `if:` to
    # its filter by that name.
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
    steps:
      # Only on a pull request, which has a base to compare with. Other events
      # select every job in the step below.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            # Out of the package, and compiled by every check all the same:
            # `crates/protect-ffi/Cargo.toml` carries
            # `eql-bindings = { path = "../../../../../../packages/eql/crates/eql-bindings" }`,
            # so `cargo test`, `cargo fmt --check` and both clippy passes build that
            # tree. The EQL workspace root manifest comes with it: cargo reads it for
            # the crate's workspace context. Same two entries as the native cache key
            # in `.github/actions/build-ffi-binding`, which is where the list is
            # derived from, pinned by
            # scripts/__tests__/wasm-build-inputs-paths-filter.test.mjs.
            #
            # The root mise.toml pins the rust this job builds with: mise reads the
            # parent directory's config, and protect-ffi's own does not pin rust.
            rust:
              - "languages/typescript/packages/protect-ffi/crates/**"
              - "languages/typescript/packages/protect-ffi/Cargo.toml"
              - "languages/typescript/packages/protect-ffi/Cargo.lock"
              - "languages/typescript/packages/protect-ffi/mise.toml"
              - "languages/typescript/packages/protect-ffi/package.json"
              - "packages/eql/crates/**"
              - "packages/eql/Cargo.toml"
              - "mise.toml"
              - ".github/workflows/tests-rust.yml"

      # Explicit default, not `|| 'true'`, which trips GitHub's inconsistent
      # treatment of the string 'false'. On a pull request, an answer other than
      # `true` or `false` means the filter did not decide, so the step fails
      # rather than write it.
      #
      # The event and the answers arrive through `env:`, not through a `${{ }}`
      # in the script. That lets `scripts/__tests__/workflow-selectors.test.mjs`
      # run this script and read back what it wrote.
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUST: ${{ steps.filter.outputs.rust }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            RUST=true
          fi
          answers=(
            "rust=$RUST"
          )
          for answer in "${answers[@]}"; do
            case "${answer#*=}" in
              true|false) echo "$answer" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "::error::The path filter answered '${answer#*=}' for ${answer%%=*}. The selector cannot decide which jobs to run."
                exit 1
                ;;
            esac
          done

  rust:
    name: cargo test + clippy + rustfmt
    needs: [selector]
    # Written as an exclusion, not a list of events: every event other
    # than a pull request runs this job.
    if: >-
      github.event_name != 'pull_request'
      || needs.selector.outputs.rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # `working_directory` is load-bearing, not tidiness. mise reads config
      # from the current directory and its PARENTS, so an action running at the
      # repo root never sees languages/typescript/packages/protect-ffi/mise.toml — it would install
      # nothing and leave the config untrusted. A later `mise run` then fails
      # with "Config files ... are not trusted", which reads as a toolchain
      # problem rather than a trust one.
      #
      # Caching is allowed here: this workflow publishes nothing, so
      # scripts/lint-no-workflow-caching.mjs does not cover it. That matters —
      # `cargo:cargo-zigbuild` builds from source, and the cache makes it a
      # one-off rather than a per-run cost.
      #
      # SHA-pinned rather than `@v3`: mise-action is a third-party trust
      # dependency the absorption introduced, and the tag is mutable. Same pin
      # as .github/actions/build-ffi-binding — keep the two in step.
      # scripts/__tests__/ffi-binding-action.test.mjs asserts both.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          working_directory: languages/typescript/packages/protect-ffi
          # Must name runs-on's image; see scripts/__tests__/workflow-mise-cache-image.test.mjs
          cache_key_prefix: mise-v1-ubuntu-2404

      # `--all-targets` in the clippy invocation means all target KINDS (lib,
      # bins, tests, benches), not all platform targets — it lints the host and
      # nothing else. wasm32 needs its own invocation, and it is the build that
      # ships to edge runtimes with the least test coverage behind it.
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: 'pnpm'

      # node-pty's install hook falls back to `node-gyp rebuild` when no
      # linux-x64 prebuild matches. pnpm/action-setup v6 no longer ships
      # node-gyp on PATH, so install it explicitly.
      #
      # This job compiles no JS and runs no pty — it needs `pnpm install` only
      # to reach the `test:cargo` script. But node-pty is the repo's one entry
      # in `pnpm.onlyBuiltDependencies`, its install hook fires on every
      # workspace install, and the 1.1.0 tarball ships prebuilds for darwin and
      # win32 ONLY. So the fallback is unconditional on a Linux runner, and
      # without this step the job dies in `Install dependencies` with
      # `sh: 1: node-gyp: not found` — before cargo is ever invoked.
      # Enforced by scripts/__tests__/workflow-node-gyp.test.mjs.
      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo test + rustfmt
        run: pnpm --filter @cipherstash/protect-ffi run test:cargo

      # `lint:rust` is the aggregate entry point, and running it by name rather
      # than its arms is the point: an arm reachable only by name is an arm
      # nobody runs (#145). lintWiring.test.ts asserts every `lint:rust:*` task
      # is in its `depends` list.
      - name: clippy (host + wasm32)
        working-directory: languages/typescript/packages/protect-ffi
        run: mise run lint:rust

  # The summary job: the one job of this workflow that branch rules require.
  # It has the same name on every event. It passes when every needed job
  # passed or was skipped. Skipped counts as passed because the selector skips
  # a job whose trigger paths a change does not touch. A failed job still
  # fails this one, because it is in `needs` and reports its failure.
  summary:
    name: Tests (Rust) summary
    needs: [selector, rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Needed results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A needed job reported '$result'."
                exit 1
                ;;
            esac
          done
