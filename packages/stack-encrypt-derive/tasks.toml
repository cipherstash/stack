# Tasks for stack-encrypt-derive, the derives that stack-encrypt re-exports.
# Included from the root mise.toml.

# Rustdoc with warnings as errors. The root `doc` task runs this task.
# It builds the public docs first, then the docs of private items too. Only
# the public build warns when a public doc links to a private item. Only the
# private build checks the links in private docs.
["doc:stack-encrypt-derive"]
description = "Build docs for stack-encrypt-derive with all features, public then private items (warnings are errors)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
  "cargo doc -p stack-encrypt-derive --no-deps --all-features",
  "cargo doc -p stack-encrypt-derive --no-deps --all-features --document-private-items",
]
