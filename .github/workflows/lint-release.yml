name: Lint release tooling

# The release machinery runs roughly once per release, so a syntax error, a
# shell mistake or an unknown runner label in it surfaces at the worst possible
# moment — mid-release, with a Version PR already merged. This runs on every
# pull request that touches any of it.
#
# actionlint is introduced here and nowhere else in the repo. It reads
# `.github/actionlint.yaml` for the Blacksmith runner label, and it runs
# shellcheck over every `run:` block — which is why the workflows it gates
# avoid `sed`-into-`export` (SC2001, SC2155), `ls | wc -l` (SC2012), and
# dollar-braces or backticks inside single-quoted `node -e` arguments (SC2016).
#
# The EQL release workflows are in scope. They came from `packages/eql/.github/`,
# where an EQL-local copy of this file linted them and ran on nothing — along
# with its two unique checks, the `prepare-bindings-assets` shellcheck and that
# wrapper's bash unit test, neither of which ran anywhere here until now.
#
# The `selector` job decides whether a pull request runs the lint, and
# `summary` reports the result (ADR 0003).

on:
  # No path filter: a workflow that a path filter skips leaves its required
  # checks pending, and GitHub's documentation on required status checks says
  # that blocks a merge. The trigger paths are in the `selector` job instead.
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The selector job: it decides which jobs a pull request runs. It runs on
  # every event and is never skipped, because the gated jobs need it. When it
  # cannot decide it fails, and that fails the summary job: a selector that
  # answered nothing would skip every gated job, and the summary job counts a
  # skipped job as passed (ADR 0003).
  #
  # On a GitHub-hosted runner because the gated jobs wait for it. No checkout:
  # on a pull request, dorny/paths-filter lists the changed files through the
  # GitHub API.
  selector:
    name: Selector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Each output is named after the filter that decides it.
    # `scripts/__tests__/workflow-selectors.test.mjs` follows a job's `if:` to
    # its filter by that name.
    outputs:
      release_lint: ${{ steps.decide.outputs.release_lint }}
    steps:
      # Only on a pull request, which has a base to compare with. Other events
      # select every job in the step below.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            # Exactly what the job reads: the workflows actionlint is pointed at,
            # the config it resolves the Blacksmith label from, and the shell
            # scripts the later steps check and run. It does not run
            # `test:scripts` (see the job comment), so scripts/release-gate.mjs and
            # the other release scripts are not here: `tests.yml` runs
            # `test:scripts` for them.
            #
            # `lint-release-scope.test.mjs` asserts the `.github/workflows/` half
            # of this list and the actionlint argument list below stay the same
            # set.
            release_lint:
              - ".github/workflows/release.yml"
              - ".github/workflows/_build-ffi-artifacts.yml"
              - ".github/workflows/ffi-preflight.yml"
              - ".github/workflows/_build-auth-artifacts.yml"
              - ".github/workflows/auth-preflight.yml"
              - ".github/workflows/_build-eql-sql.yml"
              - ".github/workflows/_build-eql-docs.yml"
              - ".github/workflows/release-plz.yml"
              - ".github/workflows/release-postgres-eql-image.yml"
              - ".github/workflows/lint-release.yml"
              - ".github/actionlint.yaml"
              - "packages/eql/tasks/release/*.sh"
              - "scripts/check-c-library.sh"

      # Explicit default, not `|| 'true'`, which trips GitHub's inconsistent
      # treatment of the string 'false'. On a pull request, an answer other than
      # `true` or `false` means the filter did not decide, so the step fails
      # rather than write it.
      #
      # The event and the answers arrive through `env:`, not through a `${{ }}`
      # in the script. That lets `scripts/__tests__/workflow-selectors.test.mjs`
      # run this script and read back what it wrote.
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_LINT: ${{ steps.filter.outputs.release_lint }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            RELEASE_LINT=true
          fi
          answers=(
            "release_lint=$RELEASE_LINT"
          )
          for answer in "${answers[@]}"; do
            case "${answer#*=}" in
              true|false) echo "$answer" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "::error::The path filter answered '${answer#*=}' for ${answer%%=*}. The selector cannot decide which jobs to run."
                exit 1
                ;;
            esac
          done

  # No pnpm, no Node, no install: actionlint is a downloaded Go binary and
  # shellcheck ships in the runner image, so this job is a checkout and a few
  # commands.
  #
  # It deliberately does NOT also run `test:scripts` or `lint:workflow-cache`.
  # `tests.yml`'s `lint` job runs `test:scripts` on every pull request with no
  # path filter, and `tests-supply-chain.yml` runs both — so a copy here would
  # be the second and third run of the same checks on any PR touching the
  # release machinery, each behind its own uncached full-workspace install. What
  # this workflow uniquely has is actionlint, and the two shell checks below.
  lint:
    name: actionlint (release workflows)
    needs: [selector]
    # Written as an exclusion, not a list of events: every event other
    # than a pull request runs this job.
    if: >-
      github.event_name != 'pull_request'
      || needs.selector.outputs.release_lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          echo "$PWD" >> "$GITHUB_PATH"

      # Scoped to the release workflows rather than the whole directory: this
      # gate has to be green on the day it lands, and actionlint has never run
      # over the other twelve. Widening it is its own change, with its own
      # findings to work through.
      - name: actionlint (release workflows)
        run: |
          set -euo pipefail
          actionlint \
            .github/workflows/release.yml \
            .github/workflows/_build-ffi-artifacts.yml \
            .github/workflows/ffi-preflight.yml \
            .github/workflows/_build-auth-artifacts.yml \
            .github/workflows/auth-preflight.yml \
            .github/workflows/_build-eql-sql.yml \
            .github/workflows/_build-eql-docs.yml \
            .github/workflows/release-plz.yml \
            .github/workflows/release-postgres-eql-image.yml \
            .github/workflows/lint-release.yml

      # `prepare-bindings-assets.sh` stamps the SQL bundle and rewrites the four
      # release manifests during `pnpm run version`, so a shell mistake in it
      # lands mid-release with every manifest already rewritten.
      - name: shellcheck (EQL release wrappers)
        run: |
          set -euo pipefail
          shellcheck \
            packages/eql/tasks/release/prepare-bindings-assets.sh \
            packages/eql/tasks/release/prepare-bindings-assets.test.sh

      - name: prepare-bindings-assets validation unit test
        run: bash packages/eql/tasks/release/prepare-bindings-assets.test.sh

      # Every release build runs it on each Linux binary before packing, so a
      # shell mistake in it fails a release mid-build. Its tests run in
      # `test:scripts`.
      - name: shellcheck (C library check)
        run: shellcheck scripts/check-c-library.sh

  # The summary job: the one job of this workflow that branch rules require.
  # It has the same name on every event. It passes when every needed job
  # passed or was skipped. Skipped counts as passed because the selector skips
  # a job whose trigger paths a change does not touch. A failed job still
  # fails this one, because it is in `needs` and reports its failure.
  summary:
    name: Lint release tooling summary
    needs: [selector, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Needed results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A needed job reported '$result'."
                exit 1
                ;;
            esac
          done
