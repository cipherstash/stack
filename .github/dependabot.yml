version: 2
updates:
  # ── npm dependencies (pnpm workspace) ──────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Australia/Sydney
    # Wait for community discovery before opening PRs
    # (lirantal/npm-security-best-practices #2: install with cooldown).
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - supply-chain
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      type-definitions:
        patterns:
          - "@types/*"
    ignore:
      # Catalog-managed; bump manually via pnpm-workspace.yaml + changeset.
      - dependency-name: "@cipherstash/auth"
      # The platform bindings MUST move in lockstep with @cipherstash/auth:
      # auth pins them as exact-version optional peer deps, so a skewed set
      # makes npm nest per-consumer binding copies the hoisted auth package
      # cannot resolve, and every project-local install of the CLI/SDK dies
      # with "Failed to load native binding". Dependabot once bumped these
      # six to 0.42.0 while the ignored auth stayed 0.41.0 (the rc.2 B1
      # bug). Bump all seven catalog entries together, manually. Lockstep is
      # enforced by e2e/tests/supply-chain.e2e.test.ts.
      - dependency-name: "@cipherstash/auth-*"
      # Release-managed manually alongside stack releases. Grouped bumps are
      # actively harmful here: Dependabot's "group consistency" once upgraded
      # the sunsetting packages/protect off its 0.23.0 pin (0.24+ renames the
      # exports it imports) while DOWNGRADING the stack packages from 0.29.0
      # (see #673).
      - dependency-name: "@cipherstash/protect-ffi"
      # 0.x bumps ship breaking type changes (e.g. 0.2 → 0.3 tightened the
      # FailureOption constraint). Review and apply manually.
      - dependency-name: "@byteslice/result"
      # Major bumps are reviewed and applied manually, not by Dependabot.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # ── GitHub Actions ─────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major bumps are reviewed and applied manually, not by Dependabot.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
