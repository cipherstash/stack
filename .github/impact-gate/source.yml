# Appended to ImpactGate defaults. Production generators remain eligible.
ignore:
  - '**/dist/**'
  - 'dist/**'
  - '**/target/**'
  - 'target/**'
  - '**/generated/**'
  - 'generated/**'
  - '**/*.generated.*'
  - '**/*.gen.*'
  - '**/*.d.ts'
  - '**/node_modules/**'
  - '**/vendor/**'
  # Test FILE exclusions do not remove inline Rust test modules.
  - 'test/**'
  - '**/test/**'
  - 'tests/**'
  - '**/tests/**'
  - '**/__tests__/**'
  - '__tests__/**'
  - '**/__mocks__/**'
  # Other fixture-only trees are under tests/__tests__/integration-tests above.
  # eql-domains/src/fixtures is the production catalog DSL: keep it eligible.
  - '**/cli/scripts/fixtures/**'
  - 'fixtures/**'
  - '**/test-fixtures/**'
  - '**/integration-tests/**'
  - 'e2e/**'
  - '**/e2e/**'
  - '**/*.test.*'
  - '**/*.spec.*'
  - '**/*_test.go'
  - '*_test.go'
  - '**/eql-tests-macros/**'
  # Shared test harness and injectable fake backend, including historical homes.
  - '**/test-kit/**'
  - '**/internal/guest/testing.go'
  - '**/*_stash.go'
  - '**/*_gen.go'
  - '**/__fixtures__/**'
  - '**/test_*.py'
  - '**/tests.rs'
  - '**/proptest_invariants.rs'
  - '**/internal/testpolicy/**'
  - '**/internal/testusers/**'
