# Rustdoc with warnings as errors: a broken intra-doc link or a rustdoc
# warning fails the build. The root `doc` task fans out over every
# `doc:<crate>`; the root `test:doc` runs the doc examples.
["doc:stack-kms-gcp"]
description = "Build docs for stack-kms-gcp with all features (warnings are errors)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc -p stack-kms-gcp --no-deps --all-features"

# The Cloud KMS backend against real Google Cloud KMS (tests/live.rs). Google
# publishes no Cloud KMS emulator, so this needs a real key and credentials.
# The test skips itself when STACK_KMS_GCP_LIVE_KEY is unset, which is right
# for `cargo nextest run --workspace` and wrong here: a skip would read as a
# pass. So this task refuses to run without the key and the credentials.
# integration-gcp-kms.yml (opt-in, credentialed) calls this task.
#
#   STACK_KMS_GCP_LIVE_KEY=projects/<p>/locations/<l>/keyRings/<r>/cryptoKeys/<k> \
#   GOOGLE_APPLICATION_CREDENTIALS=<service account key file> \
#     mise run test:live:stack-kms-gcp
["test:live:stack-kms-gcp"]
description = "Run the stack-kms-gcp tests against real Cloud KMS (needs STACK_KMS_GCP_LIVE_KEY and credentials)"
run = """
if [ -z "${STACK_KMS_GCP_LIVE_KEY:-}" ]; then
  echo "error: set STACK_KMS_GCP_LIVE_KEY to a crypto key name (projects/.../cryptoKeys/...)" >&2
  exit 1
fi
if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] && [ -z "${GOOGLE_OAUTH_ACCESS_TOKEN:-}" ]; then
  echo "error: set GOOGLE_APPLICATION_CREDENTIALS (a service account key file) or GOOGLE_OAUTH_ACCESS_TOKEN" >&2
  exit 1
fi
mise x --env test -- cargo nextest run --locked -p stack-kms-gcp --all-features --test live --no-tests=fail
"""
