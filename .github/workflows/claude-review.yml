name: Claude PR Review

# Runs Anthropic's `code-review` plugin, unmodified, on a pull request. See
# "Claude PR review" in AGENTS.md before changing anything here.

on:
  pull_request:
    # Not `synchronize`: a review per push paid for every intermediate commit.
    # A pull request is reviewed when it opens or leaves draft; to review a
    # later push, add the `claude-review` label (remove and re-add it to run
    # again).
    types:
      - opened
      - ready_for_review
      - reopened
      - labeled
    paths-ignore:
      - .changeset/**
      - "**/__snapshots__/**"
      - "**/*.snap"
      - docs/plans/**

permissions:
  contents: read

# Any other label also fires a `labeled` run. It skips the job, but it would
# still join this group and cancel a review in progress, so it gets a group of
# its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'claude-review' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    # Off unless the repository variable CLAUDE_REVIEW_ENABLED is 'true'.
    if: >-
      vars.CLAUDE_REVIEW_ENABLED == 'true'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.pull_request.draft != true
      && github.event.pull_request.user.type != 'Bot'
      && (github.event.action != 'labeled'
      || github.event.label.name == 'claude-review')
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Require Anthropic federation configuration
        shell: bash
        env:
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          missing=0
          for name in FEDERATION_RULE_ID ORGANIZATION_ID SERVICE_ACCOUNT_ID WORKSPACE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions variable for ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # The action restores the root CLAUDE.md and .claude/ from the base
      # branch, but not the files CLAUDE.md imports, nor nested CLAUDE.md files.
      # The plugin audits the change against every CLAUDE.md beside a changed
      # file, so without these two steps the pull request could rewrite the
      # rules it is reviewed against.
      - name: Checkout base-branch agent instructions
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .review-base
          fetch-depth: 1
          persist-credentials: false
          # Non-cone patterns: a name without a slash matches at any depth.
          sparse-checkout: |
            CLAUDE.md
            CLAUDE.local.md
            AGENTS.md
          sparse-checkout-cone-mode: false

      - name: Restore base-branch agent instructions
        shell: bash
        run: |
          # Remove the pull request's copies first, including ones the base
          # does not have, so a planted symlink is replaced, not written
          # through.
          find . \( -path ./.git -o -path ./.review-base \) -prune -o \
            \( -type f -o -type l \) \
            \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name AGENTS.md \) \
            -print0 | xargs -0 rm -f
          root=$(realpath .)
          (cd .review-base && find . -path ./.git -prune -o -type f -print0) |
            while IFS= read -r -d '' path; do
              dir=$(dirname "$path")
              # A directory the pull request replaced with a symlink could
              # point outside the checkout.
              case "$(realpath -m "$dir")" in
                "$root" | "$root"/*) ;;
                *)
                  echo "::warning::Not restoring ${path}: its directory resolves outside the checkout"
                  continue
                  ;;
              esac
              mkdir -p "$dir"
              cp ".review-base/$path" "$path"
            done
          rm -rf .review-base

      # The action accepts a plugin marketplace only as a URL ending in .git
      # (no commit pin) or a local path, so the plugin is installed from this
      # pinned checkout. It sits inside the pull request's working tree, so
      # anything the pull request committed at that path is removed first.
      - name: Clear plugin checkout path
        run: rm -rf .review-plugins

      # Anthropic's code-review plugin. Its licence is "All rights reserved",
      # so it runs from this pinned checkout rather than being copied in. When
      # bumping, re-read plugins/code-review/commands/code-review.md and match
      # `--allowedTools` below to its `allowed-tools`. Dependabot does not
      # track checkout refs.
      - name: Checkout code-review plugin
        uses: actions/checkout@v6
        with:
          repository: anthropics/claude-code
          ref: 52c76441cae91f6891e4712306bffb057ff6fec5
          path: .review-plugins/claude-code
          fetch-depth: 1
          persist-credentials: false

      - name: Review pull request
        id: claude-review
        uses: anthropics/claude-code-action@bf38e86e58df9ebf3420326d019f955bb3be64dd # v1.0.225
        with:
          # Without this the action trades the job's OIDC token for a Claude
          # GitHub App installation token with write access to contents, pull
          # requests and issues, which this job's `permissions:` cannot narrow.
          # The job token is limited to the grants above. The action puts
          # whichever token it uses in GH_TOKEN and in the checkout's git
          # remote URL, so it is the token a misled review could leak.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          plugin_marketplaces: |
            ${{ github.workspace }}/.review-plugins/claude-code
          plugins: |
            code-review@claude-code-plugins
          # A prompt on a pull_request event selects the action's agent mode.
          # `track_progress: true` would switch to tag mode, which grants git
          # commit and push and auto-accepts file edits.
          track_progress: false
          include_fix_links: false
          classify_inline_comments: false
          show_full_output: false
          # The command posts its own inline comments, and a summary comment
          # when it finds nothing. Its first step stops if Claude has already
          # commented on the pull request; the label is how a later review is
          # asked for, so this run is told to review regardless.
          prompt: >-
            /code-review ${{ github.event.pull_request.number }} --comment
            This review was requested for commit
            ${{ github.event.pull_request.head.sha }}. Review it even if Claude
            has already commented on this pull request.
          # The tools are the command's `allowed-tools` frontmatter at the
          # pinned commit, plus Task for its subagents. `Read(./.git/**)`
          # keeps Claude out of .git/config, where the action writes the token
          # into the remote URL. Never disallow a blanket `Bash`: it overrides
          # the scoped `Bash(gh …)` allows.
          claude_args: |
            --model sonnet
            --max-turns 60
            --allowedTools "Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch,Read(./.git/**)"

      - name: Require completed Claude review
        if: always()
        shell: bash
        env:
          REVIEW_CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
        run: |
          if [ "$REVIEW_CONCLUSION" != "success" ]; then
            # The action leaves `conclusion` unset when it exits before Claude
            # runs.
            echo "::error::Claude review did not complete; action conclusion was '${REVIEW_CONCLUSION:-unset}'. An unset conclusion means the action exited before Claude ran; see the 'Review pull request' step log."
            exit 1
          fi
