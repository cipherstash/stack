name: "Report an unattended failure (reusable)"

# Records a failed run that nobody is watching on a GitHub issue. Called as the
# last job of fuzz.yml, bench-eql.yml, macro-expand-eql.yml and test-eql.yml.
#
# WHY. A scheduled run, or a push to main, has no pull request to turn red.
# GitHub mails a scheduled run's failure to one person — whoever last edited
# the cron line — and a push run's to whoever pushed. Everyone else learns of
# it only by opening the Actions tab. An issue notifies the repository's
# watchers and stays open until someone deals with it.
#
# ONE ISSUE PER WORKFLOW AND BRANCH, NOT PER RUN. The issue is found by its
# exact title, which names both. If one is open, the failure is added to it as
# a comment, so a workflow that keeps failing nightly builds one thread rather
# than a pile of duplicates. Once it is closed, the next failure opens a new
# one.
#
# The caller decides when this runs and grants the permission, because a called
# workflow cannot raise its caller's token:
#
#     report:
#       needs: [<every other job>]
#       if: >-
#         failure() && github.event_name != 'pull_request' &&
#         github.event_name != 'workflow_dispatch' &&
#         github.event_name != 'merge_group'
#       permissions:
#         issues: write
#       uses: ./.github/workflows/_report-unattended-failure.yml
#       with:
#         guidance: <what the person who picks this up should do>
#
# A pull request shows its own failure, and whoever dispatches a run by hand is
# watching it (and may have pointed it at any branch). A merge queue run fails
# its pull request's merge in front of the author, and its ref
# (`gh-readonly-queue/main/pr-<n>-<sha>`) is unique per attempt, so each one
# would open a new issue. Every other event is reported, so a trigger added
# later is covered without editing the condition.
#
# `needs` must list every other job in the workflow: `failure()` only sees the
# jobs a job needs, so a failure in one left out is not reported.
# scripts/__tests__/unattended-failure-report.test.mjs checks this, and that
# every scheduled workflow either calls this file or is listed there with the
# reason it does not.
on:
  workflow_call:
    inputs:
      guidance:
        description: "What to do about the failure. Goes in the issue body and in every comment."
        required: true
        type: string

# Nothing at the workflow level. A called workflow gets at most what the
# calling job grants, and GitHub checks this block against that grant even
# though the job below sets its own: asking for `contents: read` here, with
# callers granting only `issues: write`, failed every caller at startup ("is
# requesting 'contents: read', but is only allowed 'contents: none'"). A
# startup failure makes no check run, so a PR still looks green.
# unattended-failure-report.test.mjs holds every caller's grant over what this
# file asks for. The job needs no checkout: `gh` reads issues through GH_REPO.
permissions: {}

jobs:
  report:
    name: Open or update the failure issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    # Two failed runs of one workflow on one branch (two pushes in quick
    # succession, say) would otherwise both look, both find nothing, and both
    # open an issue. Serialised, the second finds the first's. GitHub keeps
    # only one pending run per group, so with three at once the middle report
    # is dropped; the others still land on the one issue.
    concurrency:
      group: report-unattended-failure-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # `github.workflow` in a called workflow is the CALLER's name.
          TITLE: "${{ github.workflow }} failed on ${{ github.ref_name }}"
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GUIDANCE: ${{ inputs.guidance }}
        run: |
          set -euo pipefail
          body="The \`$EVENT\` run at $SHA failed: $RUN_URL

          $GUIDANCE"
          # Every open issue, matched on the exact title. Not `--search`: the
          # search index lags, so an issue opened by the previous report a
          # moment ago may not be found, and its results are ranked and
          # capped at the default 30, so the right one can fall outside them.
          # A plain list reads the issues directly; the limit is far above the
          # repository's open issue count.
          issue=$(gh issue list --state open --limit 5000 \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$TITLE" --label needs-triage --body "$body"
          fi
