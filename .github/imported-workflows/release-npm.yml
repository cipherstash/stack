# Release versioning for the @cipherstash npm products (CIP-3278).
#
# Owns the *versioning* half of npm releases: on push to main, the changesets
# action opens/updates a "Version Packages" PR that applies accumulated
# .changeset/*.md entries to package.json + CHANGELOG.md for the @cipherstash
# npm products. It deliberately does NOT publish here — the @cipherstash/auth
# and @cipherstash/profile packages need a matrix napi/wasm build.
#
# Publishing is automated but lives in the per-product matrix workflows: merging
# the Version Packages PR bumps each product's node/package.json on main, which
# triggers publish-auth-npm.yml / publish-profile-npm.yml (path-filtered on that
# file, with an npm-version guard so only a genuine bump publishes). That merge
# is the human gate.
#
# This is the seam with release-plz: release-plz owns Cargo.* + crates.io;
# this owns package.json + npm. They never touch the same files.
name: "Release (npm — changesets)"

on:
  push:
    branches:
      - main

# Only one Version Packages PR in flight at a time.
concurrency:
  group: release-npm
  cancel-in-progress: false

permissions:
  contents: write # create the Version Packages branch/commit
  pull-requests: write # open/update the Version Packages PR

jobs:
  version:
    name: Open/update Version Packages PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Installs only the root manifest's devDependency (@changesets/cli).
      # `--ignore-scripts` and no workspace build keep this off the napi
      # toolchain entirely — versioning only reads/writes package.json + md.
      - name: Install changesets
        run: npm ci --no-workspaces --ignore-scripts

      - name: Create Version Packages PR
        uses: changesets/action@v1
        with:
          # `version-packages` (root package.json) runs `changeset version` to
          # regenerate package.json + CHANGELOG from .changeset/*.md, then
          # `npm install --package-lock-only` so the root lockfile's recorded
          # member versions re-sync in the same commit (otherwise they drift).
          # Run via `npm run` — not `npx` — so the local `.bin/changeset`
          # resolves and `&&` executes in a shell.
          # No `publish:` on purpose — publishing is the matrix workflows' job
          # (see header comment).
          version: npm run version-packages
          title: "Release: version @cipherstash npm packages"
          commit: "chore(release): version @cipherstash npm packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
