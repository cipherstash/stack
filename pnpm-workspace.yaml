packages:
  - packages/*
  - examples/*
  - e2e

catalogs:
  repo:
    # @cipherstash/auth ships per-platform native bindings as optional
    # peerDependencies. pnpm does not auto-install platform-matched
    # optional peer deps, so the consuming packages (wizard, cli)
    # declare them as `optionalDependencies` via `catalog:repo`. Keep
    # all seven entries on the same version so a single bump here moves
    # everything in lockstep.
    '@cipherstash/auth': 0.40.0
    '@cipherstash/auth-darwin-arm64': 0.40.0
    '@cipherstash/auth-darwin-x64': 0.40.0
    '@cipherstash/auth-linux-arm64-gnu': 0.40.0
    '@cipherstash/auth-linux-x64-gnu': 0.40.0
    '@cipherstash/auth-linux-x64-musl': 0.40.0
    '@cipherstash/auth-win32-x64-msvc': 0.40.0
    tsup: 8.5.1
    tsx: 4.22.1
    typescript: 5.9.3
    vitest: 3.2.6
  security:
    '@clerk/nextjs': 7.3.5
    next: 15.5.18
    vite: 8.0.13

# Supply-chain hardening — see skills/stash-supply-chain-security/
# 7 days in minutes; mirrors the Dependabot cooldown so manual + automated
# updates have the same community-discovery window.
minimumReleaseAge: 10080
# Forbid git/tarball deps anywhere in the lockfile (pnpm ≥ 10.26).
blockExoticSubdeps: true
# Excluded from the 7-day cooldown: first-party packages we publish or
# integrate against directly. These ship on their own release cadence and
# are not exotic deps.
#   - @prisma-next/*       first-party Prisma packages the integration is built against
#   - @cipherstash/protect-ffi*  CipherStash-published native FFI and its
#                                 per-platform binary packages (darwin-arm64,
#                                 linux-x64-gnu, etc.); bumped in lockstep with stack
#   - @cipherstash/auth*         CipherStash-published auth strategies (NAPI +
#                                 WASM-inline variant); also tracked in lockstep
#                                 with protect-ffi for the WASM path.
minimumReleaseAgeExclude:
  - '@prisma-next/*'
  - '@cipherstash/protect-ffi'
  - '@cipherstash/protect-ffi-*'
  - '@cipherstash/auth'
  - '@cipherstash/auth-*'
