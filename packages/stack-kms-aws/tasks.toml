# Rustdoc with warnings as errors: a broken intra-doc link or a rustdoc
# warning fails the build. The root `doc` task fans out over every
# `doc:<crate>`; the root `test:doc` runs the doc examples.
["doc:stack-kms-aws"]
description = "Build docs for stack-kms-aws with all features (warnings are errors)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc -p stack-kms-aws --no-deps --all-features"

# The AWS KMS backend against a running LocalStack (tests/localstack.rs). The
# test skips itself when STACK_KMS_AWS_LOCALSTACK_ENDPOINT is unset, which is
# right for `cargo nextest run --workspace` and wrong here: a skip would read
# as a pass. So this task refuses to run without it. tests-crates.yml's
# `localstack` job runs LocalStack as a service and calls this task.
#
#   docker run -d --rm -p 4566:4566 -e SERVICES=kms localstack/localstack:4.4
#   STACK_KMS_AWS_LOCALSTACK_ENDPOINT=http://localhost:4566 mise run test:localstack:stack-kms-aws
["test:localstack:stack-kms-aws"]
description = "Run the stack-kms-aws tests against LocalStack (needs STACK_KMS_AWS_LOCALSTACK_ENDPOINT)"
run = """
if [ -z "${STACK_KMS_AWS_LOCALSTACK_ENDPOINT:-}" ]; then
  echo "error: set STACK_KMS_AWS_LOCALSTACK_ENDPOINT (for example http://localhost:4566)" >&2
  exit 1
fi
mise x --env test -- cargo nextest run --locked -p stack-kms-aws --all-features --test localstack --no-tests=fail
"""
