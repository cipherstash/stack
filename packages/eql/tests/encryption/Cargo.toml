[package]
name = "eql-encryption-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Execute the exact source included in the public Rustdoc example. Keep its
# test key source and async runtime out of eql-bindings' default test build.
[[test]]
name = "text_eq_example"
path = "../../crates/eql-bindings/src/encryption/example.rs"
harness = false

# Keep crypto/Postgres test dependencies out of eql-bindings' default test build.
[dev-dependencies]
eql-bindings = { path = "../../crates/eql-bindings", features = ["stack-encrypt"] }
# The parity oracle for the generated target table (tests/targets.rs): the
# table must name every stored catalog domain, in catalog order.
eql-domains = { path = "../../crates/eql-domains" }
stack-encrypt = { path = "../../../stack-encrypt", default-features = false }
# `FfiValue`: the runtime plaintext the target dispatch takes. The same line
# eql-bindings names.
vitaminc-aead-value = "0.5.1"
stack-kms = { path = "../../../stack-kms", default-features = false, features = ["test-support"] }
serde = "1"
serde_json = "1"
uuid = "1"
tokio = { version = "1", features = ["rt", "macros"] }
postgres = "0.19"
# The SteVec selector pin (tests/ste_vec_selectors.rs). stack-encrypt has no
# JSON index yet, so the selector computation customers' stored documents
# depend on lives in cipherstash-client, which protect-ffi encrypts through.
# Its `JsonIndexer` runs offline over a supplied index key. The same exact pin
# tests/sqlx names, so this workspace's lockfile gains no second copy.
# protect-ffi resolves cipherstash-client from its own workspace and lockfile;
# scripts/__tests__/cipherstash-client-parity.test.mjs fails on every PR where
# the two lockfiles disagree on cipherstash-client or cipherstash-config (the
# crates that compute selectors), so a protect-ffi bump must move this line
# (and tests/sqlx's) with it, and the pin then covers the versions of those two
# crates protect-ffi ships. Primitive dependencies such as blake3 are not
# compared.
cipherstash-client = "=0.42.3"
# The tampering test decodes a stored body, changes one byte and re-encodes
# it. The same line eql-bindings uses, so the lockfile gains no second copy.
base64 = "0.22"
