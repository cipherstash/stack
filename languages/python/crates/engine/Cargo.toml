[package]
name = "stackencrypt-engine"
description = "The pyo3 extension `stackencrypt._engine`, built by maturin into the stackencrypt wheel"
# THE WHEEL'S VERSION. pyproject.toml declares `dynamic = ["version"]` and
# maturin reads it from here, so `stackencrypt.__version__` and the
# distribution metadata have one source. Independent semver from 0.1.0; not
# the engine's version (the engine is named by its commit, `__engine__`).
version = "0.1.0"
edition.workspace = true
# Literal, not inherited: scripts/__tests__/cargo-publish-opt-out.test.mjs
# greps each member for this exact line.
publish = false
repository.workspace = true

[lib]
# maturin installs this as `stackencrypt._engine` (pyproject.toml,
# `module-name`).
name = "_engine"
crate-type = ["cdylib"]

[dependencies]
stackencrypt-core = { path = "../core" }
# `abi3-py39`: one wheel per platform for every CPython from 3.9, and a build
# against an interpreter newer than this pyo3 knows (3.14 here).
#
# `extension-module` is deliberately NOT here. It tells pyo3 not to link
# libpython, which is right for the wheel and wrong for `cargo test`: a test
# binary has to link it or fails with undefined `_Py*` symbols. maturin turns
# the feature on through `[tool.maturin].features` in pyproject.toml.
pyo3 = { version = "0.29", features = ["abi3-py39"] }
# To wipe the owned copy of a `str` the extension reads (src/values.rs,
# `Read`). The version the workspace already resolves.
zeroize = "1"
# Only for the `gate-probe` feature below.
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }

[features]
# Gate fact 2 (#1384): a function that blocks with the GIL released, so a
# Python test can send SIGINT during the call. Off in every normal build;
# see docs/gate-facts/keyboard-interrupt.md for how to run it.
gate-probe = ["dep:tokio"]
# A test build whose client takes its keys from a seed, not from ZeroKMS, once
# `_use_deterministic_keys` is called. `mise run test:deterministic` builds it
# and runs the frozen-row tests in `tests_deterministic/`. Never in a wheel a
# user installs.
deterministic-kms = ["stackencrypt-core/deterministic-kms"]

[dev-dependencies]
# For the heap-hygiene test (src/heap_hygiene.rs): a cipher over the
# in-memory key source, and a runtime to run the engine on.
stack-encrypt = { workspace = true }
stack-kms = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["rt"] }
