name: "Require @cipherstash/auth changeset"

# Ported from cipherstash-suite with the stack-* crates. A pull request that
# changes what `@cipherstash/auth` ships must carry a changeset with a patch,
# minor or major entry for it, even when the change is inside the Rust crate
# and the npm API does not move: the npm binary is built from that crate, and
# nothing else would release it.
#
# Changes that never ship (tests, examples, devDependencies) are filtered out
# by `check-auth-npm-changeset.mjs --shipped`.
#
# The `selector` job's filter and the job's `git diff` pathspec are held to
# the same set by scripts/__tests__/check-auth-npm-changeset.test.mjs. There is
# no `push:` trigger: the check compares a pull request with its base. The
# `summary` job reports the result (ADR 0003).

on:
  # No path filter: a workflow that a path filter skips leaves its required
  # checks pending, and GitHub's documentation on required status checks says
  # that blocks a merge. The trigger paths are in the `selector` job instead.
  pull_request: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The selector job: it decides which jobs a pull request runs. It runs on
  # every event and is never skipped, because the gated jobs need it. When it
  # cannot decide it fails, and that fails the summary job: a selector that
  # answered nothing would skip every gated job, and the summary job counts a
  # skipped job as passed (ADR 0003).
  #
  # On a GitHub-hosted runner because the gated jobs wait for it. No checkout:
  # on a pull request, dorny/paths-filter lists the changed files through the
  # GitHub API.
  selector:
    name: Selector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Each output is named after the filter that decides it.
    # `scripts/__tests__/workflow-selectors.test.mjs` follows a job's `if:` to
    # its filter by that name.
    outputs:
      auth_changeset: ${{ steps.decide.outputs.auth_changeset }}
    steps:
      # Only on a pull request, which has a base to compare with. Other events
      # select every job in the step below.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            # What `@cipherstash/auth` ships, which the job diffs, and the
            # job's own inputs.
            auth_changeset:
              - "packages/stack-auth/Cargo.toml"
              - "packages/stack-auth/src/**"
              - "languages/typescript/packages/auth/**"
              - "languages/typescript/packages/stack-auth-wasm/**"
              - "scripts/check-auth-npm-changeset.mjs"
              - ".github/workflows/require-auth-npm-changeset.yml"

      # Explicit default, not `|| 'true'`, which trips GitHub's inconsistent
      # treatment of the string 'false'. On a pull request, an answer other than
      # `true` or `false` means the filter did not decide, so the step fails
      # rather than write it.
      #
      # The event and the answers arrive through `env:`, not through a `${{ }}`
      # in the script. That lets `scripts/__tests__/workflow-selectors.test.mjs`
      # run this script and read back what it wrote.
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTH_CHANGESET: ${{ steps.filter.outputs.auth_changeset }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            AUTH_CHANGESET=true
          fi
          answers=(
            "auth_changeset=$AUTH_CHANGESET"
          )
          for answer in "${answers[@]}"; do
            case "${answer#*=}" in
              true|false) echo "$answer" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "::error::The path filter answered '${answer#*=}' for ${answer%%=*}. The selector cannot decide which jobs to run."
                exit 1
                ;;
            esac
          done

  require-npm-changeset:
    name: Require @cipherstash/auth changeset
    needs: [selector]
    # Written as an exclusion, not a list of events: every event other
    # than a pull request runs this job.
    if: >-
      github.event_name != 'pull_request'
      || needs.selector.outputs.auth_changeset == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # The job diffs the pull request head against its base.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          run_install: false
          cache: false

      - name: Install Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      # The root alone declares `@changesets/parse`, and nothing here builds.
      - name: Install the Changesets parser
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @cipherstash/stack-monorepo

      - name: Check for an @cipherstash/auth changeset
        env:
          ACTOR: ${{ github.actor }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          # The Version Packages PR consumes the changesets it releases.
          if [[ "$ACTOR" == "github-actions[bot]" ]] && \
             [[ "$HEAD_REF" == "changeset-release/main" ]]; then
            echo "Automated Version Packages PR; release intent was already consumed"
            exit 0
          fi

          # --no-renames: a shipped file moved under __tests__/ must still be
          # reported by its deleted source path, or isShipped never sees it.
          if ! CHANGED="$(
            git diff --name-only --no-renames "${BASE_SHA}...HEAD" -- \
              packages/stack-auth/Cargo.toml \
              packages/stack-auth/src \
              languages/typescript/packages/auth \
              languages/typescript/packages/stack-auth-wasm
          )"; then
            echo "::error::Failed to determine changed stack-auth paths"
            exit 1
          fi

          if ! SHIPPED_CHANGES="$(
            node scripts/check-auth-npm-changeset.mjs --shipped "$BASE_SHA" <<< "$CHANGED"
          )"; then
            echo "::error::Failed to determine release-relevant stack-auth changes"
            exit 1
          fi

          if [[ -z "$SHIPPED_CHANGES" ]]; then
            echo "No release-relevant stack-auth changes found"
            exit 0
          fi

          echo "Release-relevant stack-auth changes:"
          echo "$SHIPPED_CHANGES"

          if ! CHANGESETS="$(
            git diff --diff-filter=AM --name-only "${BASE_SHA}...HEAD" -- '.changeset/*.md'
          )"; then
            echo "::error::Failed to determine added or modified changesets"
            exit 1
          fi

          mapfile -t CHANGESET_FILES <<< "$CHANGESETS"
          node scripts/check-auth-npm-changeset.mjs "${CHANGESET_FILES[@]}"

  # The summary job: the one job of this workflow that branch rules require.
  # It has the same name on every event. It passes when every needed job
  # passed or was skipped. Skipped counts as passed because the selector skips
  # a job whose trigger paths a change does not touch. A failed job still
  # fails this one, because it is in `needs` and reports its failure.
  summary:
    name: Require @cipherstash/auth changeset summary
    needs: [selector, require-npm-changeset]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Needed results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A needed job reported '$result'."
                exit 1
                ;;
            esac
          done
