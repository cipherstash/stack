# Its own Cargo workspace, excluded from the root one. The reason is the
# `eql-bindings` path dependency below: that crate is a member of the EQL
# workspace (`packages/eql`), which pins its own vitaminc. Cargo accepts a
# path dep across workspaces, and keeping the workspaces separate is what
# stops the root resolver pulling EQL's graph into every stack-* build.
# `languages/typescript/packages/protect-ffi` is arranged the same way for
# the same reason.
[workspace]
resolver = "2"
members = ["."]

[package]
name = "stackencrypt-python"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# maturin imports this as `stackencrypt._engine`.
name = "_engine"
crate-type = ["cdylib"]

# The Rust side of the byte-parity test (`tests/test_bytes.py`): the engine
# with nothing in front of it, run AT TEST TIME under the same credentials
# as the Python side. It shares `src/tree.rs` and `src/targets.rs` with the
# lib by `#[path]`, so there is one tree walk and one resolver.
[[bin]]
name = "parity"
path = "src/bin/parity.rs"

[dependencies]
# abi3 is what makes one wheel per platform serve every Python 3.9+, instead
# of one per platform per interpreter minor. It is also what lets this build
# against a CPython newer than pyo3 knows about — the local interpreter is
# 3.14, and a non-abi3 build refuses an unknown version.
# `extension-module` is NOT here, deliberately. It tells pyo3 not to link
# libpython, which is right for the wheel and wrong for `cargo test`: a test
# binary is its own executable and has to link it, so with the feature on by
# default `cargo test` fails with ~40 undefined `_Py*` symbols. maturin turns
# it on through `[tool.maturin].features` in pyproject.toml, so the wheel
# still gets it and the Rust tests still run.
pyo3 = { version = "0.29", features = ["abi3-py39"] }
# `dynamic` is NOT a default feature and is the whole of what this shell
# calls: `stack_encrypt::dynamic::record`, the data-plan entry point. Without
# it the module does not exist and every call site here fails to resolve.
# `http` IS a default, and is what gives `StackCipher::new()` its credential
# discovery (CS_* then the `stash auth login` profile); it is named
# explicitly so a later `default-features = false` cannot remove it silently.
stack-encrypt = { path = "../../packages/stack-encrypt", features = [
  "dynamic",
  "http",
] }
# Never a registry version: the Rust that EMITS a payload and the SQL that
# STORES one must move together. `scripts/lint-no-eql-registry-pins.mjs`
# enforces this.
#
# Its own `stack-encrypt` feature takes stack-encrypt with
# `default-features = false` and does not enable `dynamic`, so the feature
# line above is what turns it on for the whole graph. Cargo unifies features
# across a dependency graph, so enabling it once here is enough.
eql-bindings = { path = "../../packages/eql/crates/eql-bindings", features = [
  "stack-encrypt",
] }
# The same 0.5.1 line the root workspace and eql-bindings both name. Two
# vitaminc lines in one graph do not interoperate, and the failure is two
# `FfiValue` types with one name.
vitaminc-aead-value = "0.5.1"
# The `Controlled` trait, which carries `risky_ref` on `Protected` and
# `Utf8String`. Same 0.5.1 line; stack-encrypt re-exports `NonEmpty` and
# friends from this crate but not `Controlled`.
vitaminc-protected = "0.5.1"
# Only to NAME the cipher's type: `StackCipher::new()` returns
# `StackCipher<StackKms<stack_auth::AutoStrategy>>`, and stack-encrypt does
# not re-export `AutoStrategy`. By path, as stack-encrypt itself takes it.
stack-auth = { path = "../../packages/stack-auth" }
# The `parity` bin only: it speaks JSON to the test and base64 for bytes.
serde_json = "1"
base64 = "0.22"
# The engine's `Pending` is `IntoFuture`, so every operation is async even
# though this shell's surface is sync. `rt-multi-thread` because the ZeroKMS
# client wants a reactor; `block_on` over it is the sync path.
# `macros` is for the `parity` bin's `#[tokio::main]` only.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
