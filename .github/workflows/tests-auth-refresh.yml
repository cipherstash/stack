name: Tests (auth refresh cancellation)

# The short run covers every PR, including Version Packages. The longer run
# also covers release PRs and changes to the engine, refreshers or toolchain.
on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  short:
    uses: ./.github/workflows/_test-auth-refresh-soak.yml

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      refresh: ${{ steps.paths.outputs.refresh }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: paths
        with:
          filters: |
            refresh:
              - 'packages/stack-auth/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'mise*.toml'
              - '.config/nextest.toml'
              - '.github/workflows/*auth-refresh*.yml'
              - '.github/workflows/release-plz.yml'

  long:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'changeset-release/main' || needs.changes.outputs.refresh == 'true'
    uses: ./.github/workflows/_test-auth-refresh-soak.yml
    with:
      long: true
