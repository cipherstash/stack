name: CRAP gate (crates)

# Gates pull requests that touch stack-auth or stack-encrypt on the CRAP
# (Change Risk Anti-Patterns) metric: cyclomatic complexity weighted by test
# coverage, so it surfaces complex, under-tested functions. Ported from
# cipherstash-suite's `crap-stack-auth.yml` and `crap-stack-encrypt.yml`, as
# one job per crate in one file.
#
# Blocking: each `crap:<crate>` mise task runs `cargo crap --fail-above`, so the
# job fails when any function scores above the threshold in .cargo-crap.toml
# (30). mise appends the trailing args after `--` to the task's LAST command,
# which is `cargo crap`; `--format github` turns each offending function into
# an inline `::warning` annotation before the job fails.
#
# The `selector` job decides which crate's gate a pull request runs, and
# `summary` reports the result (ADR 0003).

on:
  # No path filter: a workflow that a path filter skips leaves its required
  # checks pending, and GitHub's documentation on required status checks says
  # that blocks a merge. The trigger paths are in the `selector` job instead.
  pull_request: {}
  workflow_dispatch: {}

# Read-only: failures surface as job status and inline annotations.
permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The cargo tools are pinned in mise.test.toml, which mise loads only in
  # the test environment. With no install_args, mise-action installs (and
  # caches) the whole test toolset once: `mise run` and `mise x` install any
  # tool of the toolset that is missing, uncached, so narrowing the install
  # would only move the rest out of the cache.
  MISE_ENV: test
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  NEXTEST_PROFILE: ci

jobs:
  # The selector job: it decides which jobs a pull request runs. It runs on
  # every event and is never skipped, because the gated jobs need it. When it
  # cannot decide it fails, and that fails the summary job: a selector that
  # answered nothing would skip every gated job, and the summary job counts a
  # skipped job as passed (ADR 0003).
  #
  # On a GitHub-hosted runner because the gated jobs wait for it. No checkout:
  # on a pull request, dorny/paths-filter lists the changed files through the
  # GitHub API.
  selector:
    name: Selector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Each output is named after the filter that decides it.
    # `scripts/__tests__/workflow-selectors.test.mjs` follows a job's `if:` to
    # its filter by that name.
    outputs:
      stack_auth: ${{ steps.decide.outputs.stack_auth }}
      stack_encrypt: ${{ steps.decide.outputs.stack_encrypt }}
    steps:
      # Only on a pull request, which has a base to compare with. Other events
      # select every job in the step below.
      #
      # `every` makes a file count only when it matches every rule. That is
      # what makes the `!` rules exclude documentation: under dorny's default,
      # `some`, a `!` rule matches every other file in the repository. So each
      # filter's trigger paths are one brace pattern, written across lines:
      # YAML drops a line break that ends in `\`, with the next line's indent.
      #
      # Each gate scores one crate, and its tests compile that crate's path
      # dependencies in the workspace: stack-auth needs stack-profile, and
      # stack-encrypt needs stack-encrypt-derive, stack-kms and both of theirs.
      # The mise tasks run nextest with the `ci` profile in .config/nextest.toml.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          predicate-quantifier: every
          filters: |
            stack_auth:
              - "{\
                packages/stack-auth/**,\
                packages/stack-profile/**,\
                Cargo.toml,\
                Cargo.lock,\
                mise.toml,\
                mise.test.toml,\
                .cargo-crap.toml,\
                .config/nextest.toml,\
                .github/workflows/crap-crates.yml\
                }"
              - "!**/*.md"
              - "!**/*.example"
            stack_encrypt:
              - "{\
                packages/stack-encrypt/**,\
                packages/stack-encrypt-derive/**,\
                packages/stack-kms/**,\
                packages/stack-auth/**,\
                packages/stack-profile/**,\
                Cargo.toml,\
                Cargo.lock,\
                mise.toml,\
                mise.test.toml,\
                .cargo-crap.toml,\
                .config/nextest.toml,\
                .github/workflows/crap-crates.yml\
                }"
              - "!**/*.md"
              - "!**/*.example"

      # Explicit default, not `|| 'true'`, which trips GitHub's inconsistent
      # treatment of the string 'false'. On a pull request, an answer other than
      # `true` or `false` means the filter did not decide, so the step fails
      # rather than write it.
      #
      # The event and the answers arrive through `env:`, not through a `${{ }}`
      # in the script. That lets `scripts/__tests__/workflow-selectors.test.mjs`
      # run this script and read back what it wrote.
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          STACK_AUTH: ${{ steps.filter.outputs.stack_auth }}
          STACK_ENCRYPT: ${{ steps.filter.outputs.stack_encrypt }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            STACK_AUTH=true
            STACK_ENCRYPT=true
          fi
          answers=(
            "stack_auth=$STACK_AUTH"
            "stack_encrypt=$STACK_ENCRYPT"
          )
          for answer in "${answers[@]}"; do
            case "${answer#*=}" in
              true|false) echo "$answer" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "::error::The path filter answered '${answer#*=}' for ${answer%%=*}. The selector cannot decide which jobs to run."
                exit 1
                ;;
            esac
          done

  crap-stack-auth:
    name: CRAP (stack-auth)
    needs: [selector]
    # Written as an exclusion, not a list of events: every event other
    # than a pull request runs this job.
    if: >-
      github.event_name != 'pull_request'
      || needs.selector.outputs.stack_auth == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # rust carries llvm-tools-preview, which cargo-llvm-cov needs.
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          version: 2026.4.0
          install: true
          working_directory: .
          cache: true
          # Must name runs-on's image; see scripts/__tests__/workflow-mise-cache-image.test.mjs
          cache_key_prefix: mise-v1-ubuntu-2204

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run the CRAP gate
        run: mise run crap:stack-auth -- --format github

  crap-stack-encrypt:
    name: CRAP (stack-encrypt)
    needs: [selector]
    # Written as an exclusion, not a list of events: every event other
    # than a pull request runs this job.
    if: >-
      github.event_name != 'pull_request'
      || needs.selector.outputs.stack_encrypt == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          version: 2026.4.0
          install: true
          working_directory: .
          cache: true
          # Must name runs-on's image; see scripts/__tests__/workflow-mise-cache-image.test.mjs
          cache_key_prefix: mise-v1-ubuntu-2204

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run the CRAP gate
        run: mise run crap:stack-encrypt -- --format github

  # The summary job: the one job of this workflow that branch rules require.
  # It has the same name on every event. It passes when every needed job
  # passed or was skipped. Skipped counts as passed because the selector skips
  # a job whose trigger paths a change does not touch. A failed job still
  # fails this one, because it is in `needs` and reports its failure.
  summary:
    name: CRAP gate summary
    needs: [selector, crap-stack-auth, crap-stack-encrypt]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Needed results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A needed job reported '$result'."
                exit 1
                ;;
            esac
          done
