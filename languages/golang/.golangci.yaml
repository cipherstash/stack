version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    presets:
      # Unchecked Close, Flush, fmt.Fprint* and friends.
      - std-error-handling
    rules:
      # Test fixtures, weak rand and subprocesses are fine in tests;
      # guesttest is imported only by _test files.
      - path: (_test\.go|internal/guesttest/)
        linters:
          - gosec
      # The frame codec converts between integer widths on purpose: it
      # reads and writes two's complement wire bytes, and it bounds every
      # length and count before it converts one.
      - path: internal/frame/
        linters:
          - gosec
        text: G115

formatters:
  enable:
    - gofmt
    - goimports
