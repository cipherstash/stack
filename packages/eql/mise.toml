[tasks."test:matrix:snapshots:regen"]
description = "Regenerate ALL FOUR scalar matrix shape snapshots atomically (ordered, eq-only, text, storage-only) from one binary listing"
dir = "{{config_root}}/tests/sqlx"
run = """
#!/usr/bin/env bash
# Atomic regeneration of the four committed scalar-matrix shape snapshots, so a
# macro change that touches every shape can't silently drift the one snapshot the
# author forgets. (Issue #300: the storage-only snapshot drifted when a
# count_distinct dispatch arm switched to a runtime early-return and began
# emitting for the storage shape too — a change that regenerated 3 of 4 snapshots
# by hand and missed the fourth.) The four shapes are NOT independent: eq-only is
# DERIVED from the ordered baseline, so regenerating them one at a time off stale
# inputs is the footgun. This task lists the encrypted_domain binary ONCE and
# rewrites all four in dependency order.
#
# Drivers (one representative type per shape; the inventory gate then asserts
# every type of that shape matches the snapshot after <T> normalization):
#   ordered      → scalars::integer::  (caps = [eq, ord])
#   text         → scalars::text::  (caps = [eq, ord, search]; superset of ordered)
#   storage-only → scalars::boolean::  (caps = [storage]; term-less surface arms)
#   eq-only      → DERIVED from the ordered baseline (minus _ord/order_by)
#
# Out of scope by design: the sibling snapshots matrix_jsonb_entry_tests.txt and
# v3_jsonb_tests.txt (driven by non-CATALOG types; regenerated by their own
# documented recipes in snapshots/README.md). This task is the scalar-matrix
# four-shape set only.
#
# This task only WRITES the snapshots; `mise run test:matrix:inventory` is the
# gate that validates them. After regen, run the inventory task and commit any
# changed snapshot. `--no-default-features` and `LC_ALL=C sort` match the
# inventory's determinism; no database is required.
set -euo pipefail

# Stub generated fixtures on a bare / no-creds worktree (see test:matrix:inventory),
# then compile + list ONCE. Harmless when real fixtures exist.
EQL_ROOT="{{config_root}}"
source "${EQL_ROOT}/tasks/test/stub-fixtures.sh"
listing=$(cargo test --no-default-features --test encrypted_domain -- --list | sed -n 's/: test$//p')

# A compile failure already aborts above (set -e on the assignment); this guards
# the rarer "compiled but produced no test names" case so an empty listing can
# never reach the writes below and overwrite the committed baselines with nothing.
[ -n "$listing" ] || { echo "No test names from 'cargo test --list' — refusing to touch snapshots." >&2; exit 1; }

# Build all four shapes into a temp dir, validate each is non-empty, THEN move
# them into place together. Writing snapshots/ directly is unsafe: the `>` redirect
# truncates the committed file before the pipeline's grep runs, so a driver type
# whose arms vanished (matrix wiring removed) would leave a truncated baseline
# behind. Staging in a temp dir keeps the task atomic — on any failure the
# committed snapshots are never touched. NOTE: stub-fixtures.sh owns the single
# EXIT trap (it removes the compile stubs), so we must NOT set our own; remove the
# temp dir explicitly instead (a harmless leak under $TMPDIR on early abort).
stage=$(mktemp -d)

# Ordered baseline (canonical) — staged first because the eq-only shape is
# DERIVED from it below.
printf '%s\\n' "$listing" | grep '^scalars::integer::' \
  | sed -e 's/^scalars::integer::/scalars::<T>::/' -e 's/_integer_/_<T>_/g' \
  | LC_ALL=C sort > "$stage/matrix_tests.txt"

# Eq-only shape: DERIVED from the freshly-regenerated ordered baseline (the
# inventory gate re-derives and pins this exact relationship).
grep -vE '_ord|order_by' "$stage/matrix_tests.txt" \
  | LC_ALL=C sort -u > "$stage/matrix_tests_eq_only.txt"

# Text shape: SUPERSET of ordered, from its own driver type.
printf '%s\\n' "$listing" | grep '^scalars::text::' \
  | sed -e 's/^scalars::text::/scalars::<T>::/' -e 's/_text_/_<T>_/g' \
  | LC_ALL=C sort > "$stage/matrix_tests_text.txt"

# Storage-only shape: term-less surface arms only, from its own driver type.
printf '%s\\n' "$listing" | grep '^scalars::boolean::' \
  | sed -e 's/^scalars::boolean::/scalars::<T>::/' -e 's/_boolean_/_<T>_/g' \
  | LC_ALL=C sort > "$stage/matrix_tests_storage_only.txt"

# Every shape must have arms; an empty one means a driver type lost its matrix
# wiring. Fail WITHOUT overwriting the committed snapshot.
for f in matrix_tests.txt matrix_tests_eq_only.txt matrix_tests_text.txt matrix_tests_storage_only.txt; do
  [ -s "$stage/$f" ] || { echo "Regenerated $f is empty (driver type missing its matrix tests?) — refusing to overwrite snapshots/$f." >&2; rm -rf "$stage"; exit 1; }
done

mv "$stage/matrix_tests.txt" "$stage/matrix_tests_eq_only.txt" \
   "$stage/matrix_tests_text.txt" "$stage/matrix_tests_storage_only.txt" snapshots/
rm -rf "$stage"

echo "Regenerated 4 scalar matrix snapshots (ordered, eq-only, text, storage-only)."
echo "Run 'mise run test:matrix:inventory' to validate, then commit any changes."
"""

