name: "Run stack-auth tests"
on:
  push:
    branches:
      - main
    paths:
      - packages/stack-auth/**
      # Root manifest/lockfile: a workspace-wide dependency change can break
      # this suite without touching any package source.
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/test-stack-auth.yml
      # Ordering matters, this needs to stay at the end if we want to include the above, but exclude all .md files.
      - "!**.md"
      - "!**.example"

  pull_request:
    paths:
      - packages/stack-auth/**
      # Root manifest/lockfile: a workspace-wide dependency change can break
      # this suite without touching any package source.
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/test-stack-auth.yml
      # Ordering matters, this needs to stay at the end if we want to include the above, but exclude all .md files.
      - "!**.md"
      - "!**.example"

  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  NEXTEST_PROFILE: ci

jobs:
  test-stack-auth:
    runs-on: blacksmith-8vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix permissions on target directory
        run: |
          mkdir -p ./target
          sudo chown -R "$(id -u):$(id -g)" ./target

      - name: test-unit
        run: mise x --env test -- cargo nextest run -p stack-auth --all-features

      - name: test-doc
        run: mise run test:doc:stack-auth

      - name: doc
        run: mise run doc:stack-auth

      - name: test-integration-stack-auth
        run: mise run test:integration:stack-auth

      - name: Guard committed napi typings against drift
        working-directory: packages/stack-auth/node
        # `native.d.ts` is generated by `napi build --dts native.d.ts` and
        # committed (shipped in `files`, re-exported by the hand-written
        # `index.d.ts`). Nothing else in CI regenerates it, so a `#[napi]`
        # signature change that isn't rebuilt and committed would silently ship
        # typings that disagree with the `.node` ABI. Rebuild and fail on any
        # diff. `index.d.ts` is hand-written — napi must never touch it — so it's
        # diffed too as a belt-and-suspenders check. biome skips `**/*.d.ts`, so
        # the committed files are raw napi output and this won't false-positive.
        run: |
          npm install
          npm run build:debug
          if ! git diff --exit-code -- native.d.ts index.d.ts; then
            echo "::error::packages/stack-auth/node/{native,index}.d.ts is stale — run 'npm run build:debug' in packages/stack-auth/node and commit the result."
            exit 1
          fi

      - name: Install wasm32 target
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # The `jetli/wasm-pack-action` GitHub Action is rejected by the
        # cipherstash org allowlist (unverified creator). Install a pinned
        # version from the official GitHub release so CI is reproducible and
        # not exposed to upstream installer-script changes.
        env:
          WASM_PACK_VERSION: v0.13.1
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/wasm-pack.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Build wasm shim and run wasm-inline Result tests
        working-directory: packages/stack-auth/node
        # `test:integration:stack-auth` builds only the napi module, so the
        # wasm-inline Result tests (`wasm-inline-result.test.ts`) self-skip there
        # for lack of the inline shim — leaving the `wasm-inline.mjs` `toFailure`
        # seam with no CI coverage. Build the shim now that wasm-pack is
        # available and run those tests explicitly.
        run: |
          npm run build:wasm
          npx vitest run __tests__/wasm-inline-result.test.ts

      - name: cargo check stack-auth-wasm
        run: cargo check --target wasm32-unknown-unknown -p stack-auth-wasm

      - name: wasm-pack test stack-auth-wasm
        run: wasm-pack test --node packages/stack-auth/wasm

      - uses: ./.github/actions/send-slack-notification
        with:
          channel: engineering
          webhook_url: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK_URL }}
