[package]
name = "stack-kms-gcp"
description = "The Google Cloud KMS key vendor backend for Stack Encrypt: a hand-written Cloud KMS client with service account and metadata server credentials, for native Rust and the WASI guest"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license-file = "LICENSE"
# Publishable, in the `stack-kms-vendor` version group with the vendor seam it
# implements. release-plz.toml keeps `release = false` until the first version
# is on crates.io (published by hand; see stack-kms-vendor's Cargo.toml).

[features]
default = ["http", "service-account"]
# `GcpKms::from_env`: the native transport (`HttpVendorTransport`) and the
# default credentials over it. Native only; on wasm32 it adds nothing.
http = ["stack-kms-vendor/http", "service-account"]
# `ServiceAccountKey` and `ServiceAccountLogin`: the RS256 JWT exchange. Off,
# the crate has no RSA code. On native targets RS256 is AWS-LC (`aws-lc-rs`);
# on wasm32 it is the pure-Rust `rsa` crate (RUSTSEC-2023-0071). The Go WASI
# guest turns it off: its host supplies the access token (ADR-0015), so the
# guest never signs with a service account key.
service-account = ["dep:aws-lc-rs", "dep:rsa", "dep:rand_core"]

[dependencies]
stack-kms = { path = "../stack-kms", version = "0.2.0", default-features = false }
stack-kms-vendor = { path = "../stack-kms-vendor", version = "0.1.0" }

vitaminc = { workspace = true, features = ["protected"] }
base64ct = { version = "1.7", features = ["alloc"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
web-time = { workspace = true }
zeroize = { workspace = true }

# RS256 for the service account JWT on native targets: AWS-LC, whose RSA
# private key operation is constant time. The native transport links it
# already (rustls). See the CIP-5308 section of
# docs/plans/2026-11-05-key-vendor-backends-decisions.md.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aws-lc-rs = { version = "1.14", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"], optional = true }

# RS256 on wasm32, where AWS-LC does not build: the pure-Rust `rsa` crate,
# which has the open advisory RUSTSEC-2023-0071. The Go guest builds this
# crate without `service-account`, so it does not link it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rsa = { version = "0.9.10", default-features = false, features = ["std", "sha2", "pem", "u64_digit"], optional = true }
# The blinding RNG of the RSA signature (rsa 0.9 takes rand_core 0.6).
rand_core = { version = "0.6.4", features = ["getrandom"], optional = true }

[dev-dependencies]
stack-kms-vendor = { path = "../stack-kms-vendor", features = ["test-support", "http"] }
stack-encrypt = { path = "../stack-encrypt", default-features = false }
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
# The tests verify the RS256 signatures with the `rsa` crate, independently
# of the signer. Verifying uses no private key, so RUSTSEC-2023-0071 does not
# apply.
rsa = { version = "0.9.10", default-features = false, features = ["std", "sha2", "pem", "u64_digit"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
uuid = { workspace = true }
vitaminc = { workspace = true, features = ["protected", "random"] }

# Builds `GcpKms::from_env`, which needs the native transport.
[[test]]
name = "live"
required-features = ["http"]

[[test]]
name = "contract"
required-features = ["service-account"]

[[test]]
name = "fixtures"
required-features = ["service-account"]

[package.metadata.docs.rs]
all-features = true
