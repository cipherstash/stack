packages:
  - packages/*
  - examples/*
  - e2e

catalogs:
  repo:
    '@cipherstash/auth': 0.36.0
    tsup: 8.5.1
    tsx: 4.22.2
    typescript: 5.9.3
    vitest: 3.2.4
  security:
    '@clerk/nextjs': 7.3.7
    next: 15.5.18
    vite: 8.0.13

# Supply-chain hardening — see skills/stash-supply-chain-security/
# 7 days in minutes; mirrors the Dependabot cooldown so manual + automated
# updates have the same community-discovery window.
minimumReleaseAge: 10080
# Forbid git/tarball deps anywhere in the lockfile (pnpm ≥ 10.26).
blockExoticSubdeps: true
# Excluded from the 7-day cooldown: first-party packages we publish or
# integrate against directly. These ship on their own release cadence and
# are not exotic deps.
#   - @prisma-next/*       first-party Prisma packages the integration is built against
#   - @cipherstash/protect-ffi*  CipherStash-published native FFI and its
#                                 per-platform binary packages (darwin-arm64,
#                                 linux-x64-gnu, etc.); bumped in lockstep with stack
minimumReleaseAgeExclude:
  - '@prisma-next/*'
  - '@cipherstash/protect-ffi'
  - '@cipherstash/protect-ffi-*'
