name: Tests (crates)

# The stack-* crates and their three node bindings, ported from
# cipherstash-suite's `test-unit.yml` (the stack crates' share of it),
# `test-stack-auth.yml` and `test-stack-profile.yml` when the set was imported
# to the repository root.
#
# This is the only workflow that runs the stack-encrypt `tests/ui` trybuild
# binary: `crap-crates.yml` and `mutants.yml` both filter out `binary(ui)`.
# `scripts/__tests__/crates-ci.test.mjs` pins that, and that every mise task in
# the five crate `tasks.toml` files is reached from a root workflow.
#
# The filters keep Markdown in: `stack-auth`'s crate docs are its README
# (`#![doc = include_str!("../README.md")]`), so a README edit changes the
# doctests. The suite's `!**.md` exclude would have skipped that change.
#
# The `selector` job decides which jobs a pull request runs, and `summary`
# reports the result (ADR 0003).

on:
  # No path filter: a workflow that a path filter skips leaves its required
  # checks pending, and GitHub's documentation on required status checks says
  # that blocks a merge. The trigger paths are in the `selector` job instead.
  pull_request: {}
  push:
    branches: [main]
    # The union of the `selector` job's filters.
    # scripts/__tests__/workflow-paths-filter-parity.test.mjs compares them.
    paths:
      - packages/stack-auth/**
      - packages/stack-profile/**
      - packages/stack-kms/**
      - packages/stack-encrypt/**
      - packages/stack-encrypt-derive/**
      - packages/stack-guest-abi/**
      - languages/typescript/packages/auth/**
      - languages/typescript/packages/profile/**
      - languages/typescript/packages/stack-auth-wasm/**
      - Cargo.toml
      - Cargo.lock
      - mise.toml
      - mise.test.toml
      - .cargo/config.toml
      - .config/nextest.toml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/tests-crates.yml
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  NEXTEST_PROFILE: ci

jobs:
  # The selector job: it decides which jobs a pull request runs. It runs on
  # every event and is never skipped, because the gated jobs need it. When it
  # cannot decide it fails, and that fails the summary job: a selector that
  # answered nothing would skip every gated job, and the summary job counts a
  # skipped job as passed (ADR 0003).
  #
  # On a GitHub-hosted runner because the gated jobs wait for it. No checkout:
  # on a pull request, dorny/paths-filter lists the changed files through the
  # GitHub API.
  selector:
    name: Selector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Each output is named after the filter that decides it.
    # `scripts/__tests__/workflow-selectors.test.mjs` follows a job's `if:` to
    # its filter by that name.
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      node_bindings: ${{ steps.decide.outputs.node_bindings }}
    steps:
      # Only on a pull request, which has a base to compare with. Other events
      # select every job in the step below.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            # Cargo over the whole root workspace. Root manifest, lockfile,
            # toolchain pin and cargo config each change what compiles without
            # touching a crate. The toolchain pin in particular changes the
            # trybuild UI snapshots.
            rust:
              - "packages/stack-auth/**"
              - "packages/stack-profile/**"
              - "packages/stack-kms/**"
              - "packages/stack-encrypt/**"
              - "packages/stack-encrypt-derive/**"
              - "packages/stack-guest-abi/**"
              - "languages/typescript/packages/auth/**"
              - "languages/typescript/packages/profile/**"
              - "languages/typescript/packages/stack-auth-wasm/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "mise.toml"
              - "mise.test.toml"
              - ".cargo/config.toml"
              - ".config/nextest.toml"
              - ".github/workflows/tests-crates.yml"
            # The node bindings and stack-auth-wasm, the two crates they wrap, and
            # the pnpm install that runs their vitest suites. .cargo/config.toml
            # carries the wasm32 rustflags the stack-auth-wasm build needs.
            node_bindings:
              - "packages/stack-auth/**"
              - "packages/stack-profile/**"
              - "languages/typescript/packages/auth/**"
              - "languages/typescript/packages/profile/**"
              - "languages/typescript/packages/stack-auth-wasm/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "mise.toml"
              - ".cargo/config.toml"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".github/workflows/tests-crates.yml"

      # Explicit default, not `|| 'true'`, which trips GitHub's inconsistent
      # treatment of the string 'false'. On a pull request, an answer other than
      # `true` or `false` means the filter did not decide, so the step fails
      # rather than write it.
      #
      # The event and the answers arrive through `env:`, not through a `${{ }}`
      # in the script. That lets `scripts/__tests__/workflow-selectors.test.mjs`
      # run this script and read back what it wrote.
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUST: ${{ steps.filter.outputs.rust }}
          NODE_BINDINGS: ${{ steps.filter.outputs.node_bindings }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            RUST=true
            NODE_BINDINGS=true
          fi
          answers=(
            "rust=$RUST"
            "node_bindings=$NODE_BINDINGS"
          )
          for answer in "${answers[@]}"; do
            case "${answer#*=}" in
              true|false) echo "$answer" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "::error::The path filter answered '${answer#*=}' for ${answer%%=*}. The selector cannot decide which jobs to run."
                exit 1
                ;;
            esac
          done

  rust:
    name: fmt, clippy, nextest, doctests, rustdoc
    needs: [selector]
    # Written as an exclusion, not a list of events: every event other
    # than a pull request runs this job.
    if: >-
      github.event_name != 'pull_request'
      || needs.selector.outputs.rust == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 60
    env:
      # Job-level, not workflow-level: RUSTFLAGS replaces the
      # `[target.wasm32-unknown-unknown]` rustflags in .cargo/config.toml,
      # which the stack-auth-wasm build in `node-bindings` needs.
      RUSTFLAGS: "-D warnings"
      # nextest is pinned in mise.test.toml, which mise loads only in the
      # test environment. See the mise-action step.
      MISE_ENV: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # At the repository root: the root mise.toml pins rust 1.94.1, which the
      # trybuild snapshots record. No install_args: `mise x` and `mise run`
      # install any tool of the toolset that is missing, uncached, so this
      # installs (and caches) the whole test toolset once. The cargo: tools
      # build from source.
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          version: 2026.4.0
          install: true
          working_directory: .
          cache: true
          # Must name runs-on's image; see scripts/__tests__/workflow-mise-cache-image.test.mjs
          cache_key_prefix: mise-v1-ubuntu-2204

      # mise caches its rust install as a symlink into ~/.rustup, which the
      # cache does not hold. On a runner image that already carries a 1.94.1
      # toolchain, a cache hit makes mise skip the components mise.toml
      # declares, and the lint steps below fail. A no-op when they are there.
      # Held by scripts/__tests__/crates-ci.test.mjs.
      - name: Add rustfmt and clippy to the pinned toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --locked --no-deps --workspace --all-targets --all-features -- -D warnings

      # Every test binary in the workspace, the trybuild `ui` binary included.
      - name: nextest
        run: mise x --env test -- cargo nextest run --locked --workspace --all-features

      - name: doctests
        run: mise run test:doc

      # Rustdoc with warnings as errors, one `doc:<crate>` task per crate.
      # `test:doc` runs the examples; only this sees a broken intra-doc link.
      - name: rustdoc
        run: mise run doc

      # The stack-encrypt examples need live credentials, so they are built
      # here and run in tests-golang.yml `live`.
      - name: Build the stack-encrypt examples
        run: cargo build --locked -p stack-encrypt --examples

      # The crates release-plz publishes. `--dry-run` packages and compiles
      # each the way crates.io would (all five together, so each resolves the
      # others from cargo's temporary local registry rather than from
      # crates.io), catching a publish-blocker on the PR instead of in
      # release-crates on main: missing metadata, a runtime path dependency
      # with no `version`, or a crate that uses API its dependency's packaged
      # source does not have yet. stack-profile and stack-auth are in the list
      # because stack-kms and stack-encrypt depend on them: without them, cargo
      # resolves the published versions, which lag the tree. No token.
      # `--allow-dirty` tolerates files earlier steps leave in the tree. Once a
      # version is on crates.io, cargo warns rather than fails on a dry run of
      # it.
      - name: Verify the stack-* crates package cleanly for crates.io
        run: cargo publish --locked --dry-run --allow-dirty -p stack-profile -p stack-auth -p stack-kms -p stack-encrypt-derive -p stack-encrypt

  node-bindings:
    name: node bindings, napi typings, stack-auth-wasm
    needs: [selector]
    # Written as an exclusion, not a list of events: every event other
    # than a pull request runs this job.
    if: >-
      github.event_name != 'pull_request'
      || needs.selector.outputs.node_bindings == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          version: 2026.4.0
          install: true
          working_directory: .
          install_args: rust aqua:wasm-bindgen/wasm-pack
          cache: true
          # Must name runs-on's image; see scripts/__tests__/workflow-mise-cache-image.test.mjs
          cache_key_prefix: mise-v1-ubuntu-2204

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: 'pnpm'

      # node-pty falls back to `node-gyp rebuild` on Linux during any
      # workspace install. See scripts/__tests__/workflow-node-gyp.test.mjs.
      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each builds the binding's cdylib, copies it next to the package, and
      # runs the package's vitest suite against it.
      - name: stack-auth node binding
        run: mise run test:integration:stack-auth

      - name: stack-profile node binding
        run: mise run test:integration:stack-profile

      # Each binding's `build:debug` is `napi build --dts native.d.ts`: napi
      # writes its generated typings to `native.d.ts`, which is committed, and
      # never to `index.d.ts`, which is hand-written. Nothing else regenerates
      # `native.d.ts`, so a `#[napi]` signature change that is not rebuilt and
      # committed would leave typings that disagree with the `.node` ABI. The
      # build must leave the tracked tree as it found it: `git status` also
      # catches an untracked file the build drops into the package.
      - name: Guard committed napi typings against drift
        run: |
          pnpm --filter @cipherstash/auth run build:debug
          pnpm --filter @cipherstash/profile run build:debug
          dirty=$(git status --porcelain -- languages/typescript/packages/auth languages/typescript/packages/profile)
          if [ -n "$dirty" ]; then
            echo "$dirty"
            git diff -- languages/typescript/packages/auth languages/typescript/packages/profile
            echo "::error::napi build changed the auth or profile binding — run 'pnpm --filter @cipherstash/auth --filter @cipherstash/profile run build:debug' and commit native.d.ts. index.d.ts is hand-written and napi must not write it."
            exit 1
          fi

      # `test:integration:stack-auth` builds only the napi module, so the
      # wasm-inline Result tests self-skip there. Build the inline shim and
      # run them here. wasm-pack comes from the root mise.toml.
      - name: Build the wasm shim and run the wasm-inline Result tests
        run: |
          mise x -- pnpm --filter @cipherstash/auth run build:wasm
          pnpm --filter @cipherstash/auth exec vitest run __tests__/wasm-inline-result.test.ts

      - name: cargo check stack-auth-wasm (wasm32-unknown-unknown)
        run: cargo check --locked --target wasm32-unknown-unknown -p stack-auth-wasm

      - name: wasm-pack test stack-auth-wasm
        run: mise x -- wasm-pack test --node languages/typescript/packages/stack-auth-wasm

  # The summary job: the one job of this workflow that branch rules require.
  # It has the same name on every event. It passes when every needed job
  # passed or was skipped. Skipped counts as passed because the selector skips
  # a job whose trigger paths a change does not touch. A failed job still
  # fails this one, because it is in `needs` and reports its failure.
  summary:
    name: Tests (crates) summary
    needs: [selector, rust, node-bindings]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Needed results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A needed job reported '$result'."
                exit 1
                ;;
            esac
          done
