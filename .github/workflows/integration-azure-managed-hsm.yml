name: Integration — stack-kms-azure (Azure Managed HSM)

# stack-kms-azure against a real Azure Key Vault Managed HSM (tests/live.rs).
# Microsoft publishes no Managed HSM emulator, so unlike the LocalStack and
# Vault jobs in tests-crates.yml this needs a real key and real credentials.
# Every other stack-kms-azure test runs in tests-crates.yml, against
# fixtures and an in-process emulator.
#
# OFF FOR NOW. We have no live Managed HSM, so this job has never run. Keep
# the repository variable STACK_KMS_AZURE_LIVE_KEY unset until an instance
# is available; the job runs only when it is set. To turn it on later:
#
#   1. Create an oct-HSM AES-256 key in a Managed HSM, for this test only (a
#      Managed HSM is billed by the hour).
#   2. Create an app registration (service principal) with a client secret.
#      Give it the local RBAC role "Managed HSM Crypto Service Encryption
#      User" on the key and nothing else.
#   3. Set the repository variable STACK_KMS_AZURE_LIVE_KEY to the key
#      identifier (https://<hsm>.managedhsm.azure.net/keys/<name>). Set the
#      repository secrets STACK_KMS_AZURE_TENANT_ID, STACK_KMS_AZURE_CLIENT_ID
#      and STACK_KMS_AZURE_CLIENT_SECRET.
#
# Once the variable is set, a missing or empty secret FAILS the job (the
# pre-flight in _test-kms-live.yml): a credentialed job that skips for want
# of a secret reads exactly like one that passes.
#
# The job itself is _test-kms-live.yml, shared with integration-gcp-kms.yml.
# This file keeps the triggers, the opt-in, the fork-PR condition and the
# names of the variables and the secrets.
#
# Fork PRs have no secrets, so the job skips them; every other event runs.
# Enforced by scripts/__tests__/workflow-dispatch-job-conditions.test.mjs.

on:
  push:
    branches: [main]
    paths:
      - packages/stack-kms-azure/**
      - packages/stack-kms-vendor/**
      - packages/stack-kms/**
      - Cargo.lock
      - .github/workflows/integration-azure-managed-hsm.yml
      - .github/workflows/_test-kms-live.yml
  pull_request:
    # Repeated verbatim: GitHub Actions does not support YAML anchors/aliases.
    paths:
      - packages/stack-kms-azure/**
      - packages/stack-kms-vendor/**
      - packages/stack-kms/**
      - Cargo.lock
      - .github/workflows/integration-azure-managed-hsm.yml
      - .github/workflows/_test-kms-live.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: stack-kms-azure against Azure Managed HSM
    if: >-
      vars.STACK_KMS_AZURE_LIVE_KEY != ''
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/_test-kms-live.yml
    with:
      crate: stack-kms-azure
      name: stack-kms-azure against Azure Managed HSM
      live-key-variable: STACK_KMS_AZURE_LIVE_KEY
      required-secrets: |
        azure-tenant-id STACK_KMS_AZURE_TENANT_ID
        azure-client-id STACK_KMS_AZURE_CLIENT_ID
        azure-client-secret STACK_KMS_AZURE_CLIENT_SECRET
      live-env: |
        STACK_KMS_AZURE_LIVE_KEY=${{ vars.STACK_KMS_AZURE_LIVE_KEY }}
    secrets:
      azure-tenant-id: ${{ secrets.STACK_KMS_AZURE_TENANT_ID }}
      azure-client-id: ${{ secrets.STACK_KMS_AZURE_CLIENT_ID }}
      azure-client-secret: ${{ secrets.STACK_KMS_AZURE_CLIENT_SECRET }}
