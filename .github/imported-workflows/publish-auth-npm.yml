name: "Publish @cipherstash/auth to npm"

on:
  push:
    tags:
      - "stack-auth-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not actually publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  WORKING_DIR: packages/stack-auth/node

concurrency:
  group: publish-auth-npm
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: blacksmith-8vcpu-ubuntu-2404
          - target: aarch64-unknown-linux-gnu
            os: blacksmith-8vcpu-ubuntu-2404-arm
          - target: x86_64-unknown-linux-musl
            os: blacksmith-8vcpu-ubuntu-2404
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm install --omit=optional

      - name: Build native module
        working-directory: ${{ env.WORKING_DIR }}
        run: npx napi build --platform --release --target ${{ matrix.target }} --strip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ env.WORKING_DIR }}/*.node
          if-no-files-found: error

  build-wasm:
    name: Build - wasm32 (bundler target)
    runs-on: blacksmith-8vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        # The `jetli/wasm-pack-action` GitHub Action is rejected by the
        # cipherstash org allowlist. Use the official rustwasm.github.io
        # installer inline.
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: wasm-pack build
        run: wasm-pack build --target bundler --out-dir ../node/wasm packages/stack-auth/wasm

      - name: Strip wasm-pack metadata
        # wasm-pack emits its own package.json / README / LICENSE / .gitignore
        # alongside the .wasm + .js shims. Replace the package.json with a
        # minimal `{ "type": "module" }` so Node recognises the .js shim as
        # ESM (it uses `import`/`export`) without treating wasm/ as a separate
        # npm package. The parent package.json owns the publish contract.
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          rm -f wasm/README.md wasm/LICENSE wasm/.gitignore
          echo '{"type":"module"}' > wasm/package.json

      - name: Emit inline-bytes shim
        # Generate the `@cipherstash/auth/wasm-inline` entry: a JS shim with
        # the wasm bytes embedded as base64. Loads with zero config in
        # runtimes that don't auto-bundle sibling `.wasm` assets (Supabase
        # Edge, Cloudflare Workers, browsers without a wasm-aware bundler).
        working-directory: ${{ env.WORKING_DIR }}
        run: node scripts/inline-wasm.mjs

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-wasm32
          path: ${{ env.WORKING_DIR }}/wasm/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build, build-wasm]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm install --omit=optional

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ env.WORKING_DIR }}/artifacts

      - name: Move artifacts to platform packages
        working-directory: ${{ env.WORKING_DIR }}
        run: npx napi artifacts --dir artifacts

      - name: Move wasm artifact into wasm/
        # `napi artifacts` only knows about the per-platform .node files;
        # the wasm32 build is bundled directly into the main package.
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          mkdir -p wasm
          mv artifacts/bindings-wasm32/* wasm/
          ls -la wasm/

      - name: Determine version and npm tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/stack-auth-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/stack-auth-v}"
          else
            VERSION=$(jq -r .version "${{ env.WORKING_DIR }}/package.json")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *"-"* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

          echo "Publishing version: $VERSION (tag: $(if [[ "$VERSION" == *"-"* ]]; then echo next; else echo latest; fi))"

      - name: Set package versions
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # Update optionalDependencies to match the publish version
          jq --arg v "$VERSION" '
            .optionalDependencies |= with_entries(
              if (.key | startswith("@cipherstash/auth-"))
              then .value = $v
              else .
              end
            )
          ' package.json > package.json.tmp && mv package.json.tmp package.json
          for dir in npm/*/; do
            if [ -f "$dir/package.json" ]; then
              cd "$dir"
              npm version "$VERSION" --no-git-tag-version --allow-same-version
              cd -
            fi
          done

      - name: List packages
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "=== Main package ==="
          cat package.json | jq '{name, version}'
          echo ""
          for dir in npm/*/; do
            echo "=== $(basename $dir) ==="
            cat "$dir/package.json" | jq '{name, version, os, cpu}'
            ls -la "$dir"*.node 2>/dev/null || echo "  (no .node file)"
            echo ""
          done

      - name: Publish platform packages
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Publishing $(jq -r .name "$dir/package.json")..."
              npm publish "$dir" --access public --tag ${{ steps.version.outputs.npm_tag }}
            fi
          done

      - name: Publish main package
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag ${{ steps.version.outputs.npm_tag }}

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: echo "Dry run complete. Set dry_run to false to actually publish."
