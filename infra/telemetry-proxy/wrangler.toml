name = "stash-telemetry-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"

# Binds the Worker to our own hostname. Cloudflare provisions and renews the TLS
# certificate for the custom domain automatically. The zone (cipherstash.com)
# must be on this Cloudflare account.
routes = [
  { pattern = "telemetry.cipherstash.com", custom_domain = true }
]

# The forward target. Change to "eu.i.posthog.com" and redeploy to move the whole
# CLI fleet to PostHog Cloud EU — no CLI release required.
[vars]
POSTHOG_HOST = "us.i.posthog.com"
