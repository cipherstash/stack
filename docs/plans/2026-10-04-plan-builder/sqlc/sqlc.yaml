version: "2"
sql:
  - engine: postgresql
    schema:
      - eql-domains.sql
      - schema.sql
    queries: query.sql
    gen:
      go:
        package: userdb
        out: ../internal/userdb
        overrides:
          - db_type: "public.eql_v3_text_search"
            go_type: { import: github.com/cipherstash/stack/languages/golang/stackencrypt/eql, type: TextSearch }
          - db_type: "public.eql_v3_integer_ord"
            go_type: { import: github.com/cipherstash/stack/languages/golang/stackencrypt/eql, type: IntegerOrd }
          - db_type: "public.eql_v3_json_search"
            go_type: { import: github.com/cipherstash/stack/languages/golang/stackencrypt/eql, type: JSON }
          - db_type: "public.eql_v3_text"
            go_type: { import: github.com/cipherstash/stack/languages/golang/stackencrypt/eql, type: Text }
          - db_type: "eql_v3.query_text_search"
            go_type: { import: github.com/cipherstash/stack/languages/golang/stackencrypt/eql, type: TextSearchQuery }
          - db_type: "eql_v3.query_integer_ord"
            go_type: { import: github.com/cipherstash/stack/languages/golang/stackencrypt/eql, type: IntegerOrdQuery }
