[package]
name = "stack-encrypt"
description = "Encrypt Rust values under per-value ZeroKMS data keys via the vitaminc cipher traits"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license-file = "LICENSE"
# Published to crates.io by release-plz.yml; release-plz.toml puts it in the
# `stack-encrypt` version group.

[dependencies]
# `profile` (native only; stack-kms gates it off wasm32 itself) lets
# `StackCipher::new()` fall back to the client key `stash auth login` writes
# to the profile directory (`secretkey.json`) when CS_CLIENT_ID /
# CS_CLIENT_KEY are not set — the same place `AutoStrategy` finds the token.
stack-kms = { path = "../stack-kms", version = "0.1.0", default-features = false, features = [
    "profile",
], optional = true }
# `StackCipher::new()` builds a ZeroKMS client from the environment, so its
# return type names the auto-detected auth strategy. Only needed with `http`.
stack-auth = { workspace = true, optional = true }
# `#[derive(EncryptFrom)]` / `#[derive(DecryptInto)]`, re-exported from `target`.
stack-encrypt-derive = { path = "../stack-encrypt-derive", version = "0.2.0" }

# The workspace vitaminc (0.5.1): one canonical context encoding shared by
# the AEAD and PRF derivations (`IntoContext`, cipherstash/vitaminc#339),
# `NonEmpty::with`, `From<integer> for NonEmpty` (#314) and the parts view
# (#318), all of which this crate relies on. All five must share one
# version or the aead crate is duplicated.
vitaminc-aead = { workspace = true }
# `dynamic`: the runtime value model every language binding funnels through.
vitaminc-aead-value = { workspace = true, optional = true }
vitaminc-encrypt = { workspace = true }
vitaminc-hmac = { workspace = true }
vitaminc-prf = { workspace = true }
vitaminc-protected = { workspace = true }
# The key-provider traits a `KeysetRegistry`'s provider implements. Pinned to
# the same git rev as `stack-kms`'s copy: a differently-sourced dependency is
# a different type at compile time, so the two must resolve to one package.
vitaminc-kms = { git = "https://github.com/cipherstash/vitaminc", rev = "b3bc6eb", default-features = false }
# The `Protected` those traits name. Same rev, same reason — see the comment
# on the identical pair in `stack-kms/Cargo.toml`.
vitaminc-protected-kms = { package = "vitaminc-protected", git = "https://github.com/cipherstash/vitaminc", rev = "b3bc6eb" }
serde = { workspace = true }
# `Descriptor`: the base64 rendering of a non-textual context for ZeroKMS.
base64ct = { version = "1.7", features = ["alloc"] }

cllw-ore = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[features]
default = ["http", "zerokms"]
# `impl KeysetRegistry for Arc<StackKms>`: ZeroKMS as a source of keysets.
# The trait itself is backend-neutral and always available; this is the one
# backend whose implementation this crate carries, because the orphan rule
# puts `impl KeyProvider for ZeroKmsKeyset` in `stack-kms` and this impl —
# local trait, foreign type — here.
#
# Nothing outside this feature reaches for `stack-kms`, which is what the
# backend-neutral claim means in dependency terms: with it off, no ZeroKMS
# code is in the graph at all.
#
# It needs `stack-auth` for the bounds `StackKms` is generic over, but not
# `stack-auth/http` — that is the `http` feature's job, and pulling a
# transport in here would break the WASI gate.
zerokms = ["dep:stack-kms", "dep:stack-auth"]
# `stack_encrypt::registry::fake`: many keysets, no network. Downstream
# crates (the WASI guest's native tests) build a cipher on it; it pulls in
# vitaminc-kms's own `FakeKeyProvider`. A caller's dev-dependency on
# stack-encrypt with this feature is enough: no direct stack-kms or
# vitaminc-kms dependency has to agree with this crate's.
test-support = ["vitaminc-kms/test-support"]
# `StackCipher::new()` / `StackCipher::builder().init()` from the environment:
# the default HTTP transport in stack-kms and the auto-detected auth strategy
# in stack-auth. Off, a cipher is built over an explicit registry
# (`StackCipherBuilder::new().registry(..)`) and no HTTP client or TLS stack
# is in the dependency graph — the shape the WASI/wazero guest builds against.
#
# Implies `zerokms`: the environment it builds from is a ZeroKMS one.
http = ["zerokms", "stack-auth/http", "stack-kms/http"]
# `stack_encrypt::dynamic`: encrypt and decrypt values whose types are known
# only at runtime, as an FFI binding's are. Off by default — it is only of
# use to a binding author, and it pulls `vitaminc-aead-value` in.
dynamic = ["dep:vitaminc-aead-value"]

[dev-dependencies]
# The crate under test, with its own `test-support` on: integration tests
# link the library as a dependency, and `cargo test` does not turn a crate's
# features on for its own test binaries.
stack-encrypt = { path = ".", features = ["test-support"] }
serde_json = { workspace = true }
# For `examples/zerokms_auth.rs`, which names the ZeroKMS client directly, and
# for `tests/registry_zerokms.rs`: `test-support` is the in-memory
# `ZeroKMSConnection` that lets `impl KeysetRegistry for Arc<StackKms>` — which
# the orphan rule puts in *this* crate — be tested without a network.
# `default-features = false`: dev-dependency features unify into the
# `cargo test -p stack-encrypt --no-default-features` graph, so leaving the
# default on would silently pull `stack-kms/http` -> `stack-auth/http` ->
# reqwest back into the "no HTTP" gate (`wasm:no-http-test`).
stack-kms = { path = "../stack-kms", default-features = false, features = [
    "test-support",
] }
# To build the request errors ZeroKMS answers a keyset lookup with (a name it
# does not know, a request that got no answer) in a test double. Already in
# the no-HTTP graph through stack-kms; it has no features of its own.
zerokms-protocol = { workspace = true }
# `StaticTokenStrategy`, the auth double `tests/registry_zerokms.rs` builds its
# `StackKms` over. `default-features = false` for the no-HTTP gate, as above.
stack-auth = { workspace = true, default-features = false, features = [
    "test-utils",
] }
tokio = { workspace = true, features = ["rt", "macros"] }
# Compile-fail tests for the derive diagnostics (`tests/ui`).
trybuild = "1"

# The derive diagnostics are recorded with every feature on, as `test:unit`
# and CI run them. They cannot hold under both feature sets — rustc lists a
# trait's other implementors in its help, and the `dynamic` feature's
# `FfiValue` joins one such list and pushes another entry off it — so the
# test is only built with that feature rather than skipped at runtime.
[[test]]
name = "ui"
required-features = ["dynamic"]

[[example]]
name = "encrypted_record"
required-features = ["http"]

[[example]]
name = "mixed_user"
required-features = ["http"]

[[example]]
name = "search_terms"
required-features = ["http"]

[[example]]
name = "zerokms_auth"
required-features = ["http"]

[package.metadata.docs.rs]
all-features = true
