[project]
name = "customer-directory"
version = "0.0.0"
description = "An internal example of the stackencrypt Python SDK. Not released."
requires-python = ">=3.9"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["stackencrypt", "fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary]>=3.1", "sqlalchemy>=2"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
# This is an application, so uv does not need to build it.
package = false

[tool.uv.sources]
# The SDK is not on any index, so it comes from this checkout.
stackencrypt = { path = "../..", editable = false }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
