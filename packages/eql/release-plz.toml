# release-plz configuration. Mirrors the canonical cipherstash-suite setup.
#
# Scope: release-plz is scoped to the one Rust crate shipped to crates.io,
# `eql-bindings`. Every other member of this workspace is `publish = false` in
# its Cargo.toml, so release-plz skips it automatically — no per-package config.
#
# THE PATHS IN THIS FILE ARE RELATIVE TO THIS DIRECTORY, not to the repository
# root. This subtree was imported into cipherstash/stack at `packages/eql`, so
# `<repo-root>/.github/workflows/release-plz.yml` passes
# `--manifest-path packages/eql/Cargo.toml --config packages/eql/release-plz.toml`.
# `changelog_config` below is only read by the `update` / `release-pr` commands,
# which this repository never runs: versioning is owned by CHANGESETS
# (`scripts/sync-lockstep-versions.mjs` bumps this crate in lockstep with the
# npm package), and the workflow runs `command: release` — publish only.
#
# This header used to point at `.github/workflows/release-eql.yml` and a
# "Cutting a release" section of CLAUDE.md. Neither existed even upstream: the
# workflow was `release.yml`, and this repository has no such CLAUDE.md section.
#
# The crate is tagged `eql-bindings-v<semver>` (release-plz's default workspace
# tag). That tag shape is part of the release identity, not a default nobody
# chose: it deliberately does NOT match the `eql-<semver>` SQL-release
# automation, so a crate release never fires an SQL build or a Docker image.
#
# In THIS repository that holds for a stronger reason than upstream's, and the
# difference matters if you go looking: upstream also had a deprecated docs-site
# webhook triggered by `eql-*` tags. That workflow was deliberately not ported.
# The SQL and docs artifact builds are jobs inside `release.yml`, and the image
# is dispatched from it by `gh workflow run`, so a tag of any shape reaches none
# of them.

[workspace]
changelog_config = "cliff.toml"
git_tag_enable = true
git_release_enable = true
publish = true
# semver_check is noisy for a pre-1.0 crate and duplicated by the PR review;
# disabled to match cipherstash-suite.
semver_check = false
# Verify the packaged crate with EVERY feature on. `cargo publish` verifies the
# default feature set, and eql-bindings' `stack-encrypt` feature is off by
# default, so a plain publish compiles none of the code that depends on
# stack-encrypt. It would ship a feature that does not build against the
# crates.io stack-encrypt its `version` names: docs.rs enables the feature and
# goes red, and a consumer enabling it fails to compile. The in-tree path
# dependency cannot catch this — it builds against whatever
# packages/stack-encrypt holds, released or not. With `--all-features` the
# verify step resolves stack-encrypt from the REGISTRY and refuses to publish
# an eql-bindings whose feature does not build there. The PR-time twin is the
# `cargo publish --dry-run --all-features` step in test-eql.yml.
publish_all_features = true
