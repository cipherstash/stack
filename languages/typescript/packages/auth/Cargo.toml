[package]
name = "stack-auth-node"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
stack-auth = { workspace = true, features = ["http"] }
stack-profile = { workspace = true }
cts-common = { workspace = true }
vitaminc-protected = { workspace = true }
napi = { version = "2", features = ["async", "tokio_rt"] }
napi-derive = "2"
serde_json = "1"
zeroize = { workspace = true }
# `stash keyset create` / `rewrap` (src/keyset.rs, CIP-5312): keyset records
# for the key vendor backends. These crates are compiled into this binary from
# the tree, by path, so their crates.io release state does not matter here.
# stack-kms-gcp has no default features: without `service-account` it has no
# `rsa` code (RUSTSEC-2023-0071), and the binding builds its own credentials
# from an access token or the metadata server.
stack-kms = { path = "../../../../packages/stack-kms", default-features = false }
stack-kms-vendor = { path = "../../../../packages/stack-kms-vendor", features = ["http"] }
stack-kms-aws = { path = "../../../../packages/stack-kms-aws" }
stack-kms-vault = { path = "../../../../packages/stack-kms-vault" }
stack-kms-gcp = { path = "../../../../packages/stack-kms-gcp", default-features = false }
stack-kms-azure = { path = "../../../../packages/stack-kms-azure" }
vitaminc = { workspace = true }
base64 = { workspace = true }
miette = { workspace = true }

[dev-dependencies]
# `stack-auth/test-utils` gives the Rust #[cfg(test)] unit tests the no-timeout
# `http_client`; the mock server itself is now a JS helper (see
# __tests__/helpers/), so the napi crate no longer ships a `test-utils` feature
# or the heavy mocktail/jsonwebtoken/reqwest deps in its published artifact.
stack-auth = { workspace = true, features = ["http", "test-utils"] }
jsonwebtoken = { workspace = true }
mocktail = "0.3.0"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
url = "2"

[build-dependencies]
napi-build = "2"
