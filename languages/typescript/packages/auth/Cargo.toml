[package]
name = "stack-auth-node"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
stack-auth = { workspace = true }
stack-profile = { workspace = true }
cts-common = { workspace = true }
vitaminc-protected = { workspace = true }
napi = { version = "2", features = ["async", "tokio_rt"] }
napi-derive = "2"
serde_json = "1"
zeroize = { workspace = true }
url = { version = "2", optional = true }
mocktail = { version = "0.3.0", optional = true }
jsonwebtoken = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
stack-auth = { workspace = true, features = ["test-utils"] }
jsonwebtoken = { workspace = true }
mocktail = "0.3.0"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
url = "2"

[build-dependencies]
napi-build = "2"

[features]
test-utils = ["stack-auth/test-utils", "dep:url", "dep:mocktail", "dep:jsonwebtoken", "dep:reqwest"]
