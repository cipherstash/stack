packages:
  - packages/*
  - examples/*
  - e2e

catalogs:
  repo:
    # NAPI consumers (wizard, cli) stay on 0.36.0 — that release uses
    # `optionalDependencies` for the per-platform native binaries, so pnpm
    # auto-installs the matching binary on each CI platform. 0.37.0-alpha
    # moved them to optional peerDependencies which pnpm does NOT install
    # by platform, breaking `import auth from '@cipherstash/auth'` on
    # Linux CI. `@cipherstash/stack` pins 0.37.0-alpha.8 directly for the
    # `/wasm-inline` subpath — it never touches the NAPI bindings, so the
    # missing native binary doesn't matter there. Promote the catalog
    # once auth 0.38.0 ships a stable release.
    '@cipherstash/auth': 0.36.0
    tsup: 8.5.1
    tsx: 4.22.1
    typescript: 5.9.3
    vitest: 3.2.4
  security:
    '@clerk/nextjs': 7.3.5
    next: 15.5.18
    vite: 8.0.13

# Supply-chain hardening — see skills/stash-supply-chain-security/
# 7 days in minutes; mirrors the Dependabot cooldown so manual + automated
# updates have the same community-discovery window.
minimumReleaseAge: 10080
# Forbid git/tarball deps anywhere in the lockfile (pnpm ≥ 10.26).
blockExoticSubdeps: true
# Excluded from the 7-day cooldown: first-party packages we publish or
# integrate against directly. These ship on their own release cadence and
# are not exotic deps.
#   - @prisma-next/*       first-party Prisma packages the integration is built against
#   - @cipherstash/protect-ffi*  CipherStash-published native FFI and its
#                                 per-platform binary packages (darwin-arm64,
#                                 linux-x64-gnu, etc.); bumped in lockstep with stack
#   - @cipherstash/auth*         CipherStash-published auth strategies (NAPI +
#                                 WASM-inline variant); also tracked in lockstep
#                                 with protect-ffi for the WASM path.
minimumReleaseAgeExclude:
  - '@prisma-next/*'
  - '@cipherstash/protect-ffi'
  - '@cipherstash/protect-ffi-*'
  - '@cipherstash/auth'
  - '@cipherstash/auth-*'
