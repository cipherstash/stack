name: "Test Benchmark JS"

# Trigger paths follow the package GRAPH, not the bench directory. bench depends
# on `@cipherstash/stack` and `@cipherstash/stack-drizzle`, and (since the fixture
# schema moved to EQL v3 domains) on the CLI's EQL installer — a break in any of
# them can red this job, so an edit to any of them has to be able to trigger it.
# Scoped the same way the `integration-*` workflows scope theirs rather than
# taking whole packages, to keep the trigger surface honest.
#
# The `selector` job decides whether a pull request runs the job, and
# `summary` reports the result (ADR 0003).
on:
  push:
    branches:
      - 'main'
    # The same files as the `selector` job's filter.
    # scripts/__tests__/workflow-paths-filter-parity.test.mjs compares them.
    paths:
      - 'languages/typescript/packages/bench/**'
      - 'languages/typescript/packages/stack/src/eql/v3/**'
      # The bench drives the typed v3 CLIENT, which lives in `encryption/`, not
      # `eql/v3/` (that is the authoring DSL). Without this the job stayed green
      # by never running for the changes most likely to break it.
      - 'languages/typescript/packages/stack/src/encryption/**'
      - 'languages/typescript/packages/stack-drizzle/**'
      - 'languages/typescript/packages/test-kit/**'
      - 'languages/typescript/packages/cli/src/installer/**'
      - 'local/**'
      - '.github/workflows/tests-bench.yml'
      - '.github/actions/integration-setup/**'
      - '.github/actions/build-auth-binding/**'
  # No path filter: a workflow that a path filter skips leaves its required
  # checks pending, and GitHub's documentation on required status checks says
  # that blocks a merge. The trigger paths are in the `selector` job instead.
  pull_request:
    branches:
      - "**"

jobs:
  # The selector job: it decides which jobs a pull request runs. It runs on
  # every event and is never skipped, because the gated jobs need it. When it
  # cannot decide it fails, and that fails the summary job: a selector that
  # answered nothing would skip every gated job, and the summary job counts a
  # skipped job as passed (ADR 0003).
  #
  # On a GitHub-hosted runner because the gated jobs wait for it. No checkout:
  # on a pull request, dorny/paths-filter lists the changed files through the
  # GitHub API.
  selector:
    name: Selector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Each output is named after the filter that decides it.
    # `scripts/__tests__/workflow-selectors.test.mjs` follows a job's `if:` to
    # its filter by that name.
    outputs:
      bench: ${{ steps.decide.outputs.bench }}
    steps:
      # Only on a pull request, which has a base to compare with. Other events
      # select every job in the step below.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            # The package graph the bench reads; see the comment at the top
            # of this file. The bench drives the typed v3 client, which lives
            # in `encryption/`, not `eql/v3/`.
            bench:
              - "languages/typescript/packages/bench/**"
              - "languages/typescript/packages/stack/src/eql/v3/**"
              - "languages/typescript/packages/stack/src/encryption/**"
              - "languages/typescript/packages/stack-drizzle/**"
              - "languages/typescript/packages/test-kit/**"
              - "languages/typescript/packages/cli/src/installer/**"
              - "local/**"
              - ".github/workflows/tests-bench.yml"
              - ".github/actions/integration-setup/**"
              - ".github/actions/build-auth-binding/**"

      # Explicit default, not `|| 'true'`, which trips GitHub's inconsistent
      # treatment of the string 'false'. On a pull request, an answer other than
      # `true` or `false` means the filter did not decide, so the step fails
      # rather than write it.
      #
      # The event and the answers arrive through `env:`, not through a `${{ }}`
      # in the script. That lets `scripts/__tests__/workflow-selectors.test.mjs`
      # run this script and read back what it wrote.
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BENCH: ${{ steps.filter.outputs.bench }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            BENCH=true
          fi
          answers=(
            "bench=$BENCH"
          )
          for answer in "${answers[@]}"; do
            case "${answer#*=}" in
              true|false) echo "$answer" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "::error::The path filter answered '${answer#*=}' for ${answer%%=*}. The selector cannot decide which jobs to run."
                exit 1
                ;;
            esac
          done

  tests-bench:
    name: Run Bench Smoke Tests
    needs: [selector]
    # Written as an exclusion, not a list of events: every event other
    # than a pull request runs this job.
    if: >-
      github.event_name != 'pull_request'
      || needs.selector.outputs.bench == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      # The shared integration preamble, which also builds the `stash` CLI — not
      # incidental here: the bench `globalSetup` installs EQL v3 by shelling out
      # to the real `stash eql install --eql-version 3`.
      - uses: ./.github/actions/integration-setup
        with:
          # This job's existing Node; the composite defaults to 24 for the
          # integration suites.
          node-version: 22

      # The bench unit checks import @cipherstash/stack, and the `stash eql
      # install` in the bench `globalSetup` runs the CLI; both load
      # @cipherstash/auth's napi module.
      - name: Build the @cipherstash/auth binding
        uses: ./.github/actions/build-auth-binding

      # `@cipherstash/stack` ships dist/-based `exports`; bench imports
      # from `@cipherstash/stack` and `@cipherstash/stack-drizzle` (the Drizzle
      # adapter split out into its own package), so both must be built before
      # vitest can resolve them — the drizzle bench/test files import
      # `@cipherstash/stack-drizzle`. Going through turbo also picks up `^build`
      # deps (stack-drizzle depends on stack).
      - name: Build stack + adapter packages
        run: pnpm exec turbo run build --filter @cipherstash/stack --filter @cipherstash/stack-drizzle

      # Deliberately BEFORE Postgres. Separate config, no globalSetup: these
      # need neither a database nor credentials, so they must not be reachable
      # only after the steps that do — a docker failure below would otherwise
      # skip the one check whose whole rationale is that it cannot be skipped.
      # The seed keying they check was wrong for the entire v2 -> v3 port
      # precisely because every suite that would have caught it needs
      # credentials, and `tsc --noEmit` passes on a hand-written row type that
      # agrees with itself (#772 review, finding 12).
      - name: Run bench unit checks (no database, no credentials)
        working-directory: languages/typescript/packages/bench
        run: pnpm test:unit

      # Service-scoped `postgres`: local/docker-compose.yml also defines a
      # PostgREST that bench never talks to.
      #
      # This container has EQL v2 baked in and NOTHING to do with the v3 domains
      # the fixture schema needs — those come from the `globalSetup` install
      # below. Do not add an EQL step here; keeping the install inside vitest is
      # what makes `pnpm test:local` and CI the same path.
      - name: Start local Postgres
        working-directory: local
        run: docker compose up --wait --wait-timeout 60 postgres

      # `pnpm test:local` resolves to `vitest run`; the trailing `db-only`
      # is a vitest path filter that narrows to __tests__/db-only.test.ts
      # (credential-free smoke). Note: pnpm 10 forwards script args without
      # `--`; using `--` here would cause vitest to treat it as the
      # option-terminator and ignore the filter, running all 3 test files
      # — including ones that need CipherStash credentials.
      - name: Run bench smoke tests
        working-directory: languages/typescript/packages/bench
        run: pnpm test:local db-only

  # The summary job: the one job of this workflow that branch rules require.
  # It has the same name on every event. It passes when every needed job
  # passed or was skipped. Skipped counts as passed because the selector skips
  # a job whose trigger paths a change does not touch. A failed job still
  # fails this one, because it is in `needs` and reports its failure.
  summary:
    name: Test Benchmark JS summary
    needs: [selector, tests-bench]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Needed results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A needed job reported '$result'."
                exit 1
                ;;
            esac
          done
