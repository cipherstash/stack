name: Integration — stack-kms-gcp (Google Cloud KMS)

# stack-kms-gcp against real Google Cloud KMS (tests/live.rs). Google
# publishes no Cloud KMS emulator, so unlike the LocalStack and Vault jobs in
# tests-crates.yml this needs a real crypto key and real credentials. Every
# other stack-kms-gcp test runs in tests-crates.yml, against fixtures and an
# in-process emulator.
#
# OPT-IN. The job runs only when the repository variable
# STACK_KMS_GCP_LIVE_KEY is set, so the workflow is inert until someone sets
# up the Google Cloud side. To turn it on:
#
#   1. Create a symmetric ENCRYPT_DECRYPT crypto key for this test only.
#   2. Create a service account with roles/cloudkms.cryptoKeyEncrypterDecrypter
#      on that key and nothing else, and make a JSON key for it.
#   3. Set the repository variable STACK_KMS_GCP_LIVE_KEY to the crypto key
#      name (projects/<p>/locations/<l>/keyRings/<r>/cryptoKeys/<k>), and the
#      repository secret STACK_KMS_GCP_SERVICE_ACCOUNT_KEY to the JSON key.
#
# Once the variable is set, a missing or empty secret FAILS the job (the
# pre-flight below): a credentialed job that skips for want of a secret reads
# exactly like one that passes.
#
# Fork PRs have no secrets, so the job skips them; every other event runs.
# Enforced by scripts/__tests__/workflow-dispatch-job-conditions.test.mjs.

on:
  push:
    branches: [main]
    paths:
      - packages/stack-kms-gcp/**
      - packages/stack-kms-vendor/**
      - packages/stack-kms/**
      - Cargo.lock
      - .github/workflows/integration-gcp-kms.yml
  pull_request:
    # Repeated verbatim: GitHub Actions does not support YAML anchors/aliases.
    paths:
      - packages/stack-kms-gcp/**
      - packages/stack-kms-vendor/**
      - packages/stack-kms/**
      - Cargo.lock
      - .github/workflows/integration-gcp-kms.yml
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: stack-kms-gcp against Cloud KMS
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 30
    if: >-
      vars.STACK_KMS_GCP_LIVE_KEY != ''
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      MISE_ENV: test
      STACK_KMS_GCP_LIVE_KEY: ${{ vars.STACK_KMS_GCP_LIVE_KEY }}
    steps:
      # Fast pre-flight: fail in seconds if the secret was rotated or
      # cleared, before the toolchain install and the compile.
      - name: Require the Cloud KMS service account key
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.STACK_KMS_GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_KEY" ]; then
            echo "::error::STACK_KMS_GCP_LIVE_KEY is set but the secret STACK_KMS_GCP_SERVICE_ACCOUNT_KEY is empty"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          version: 2026.4.0
          install: true
          working_directory: .
          cache: true
          # Must name runs-on's image; see scripts/__tests__/workflow-mise-cache-image.test.mjs
          cache_key_prefix: mise-v1-ubuntu-2204

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # The key goes to a file only this user can read, outside the
      # checkout, and is removed after the test.
      - name: Write the service account key
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.STACK_KMS_GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          umask 077
          printf '%s' "$SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/stack-kms-gcp-live.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/stack-kms-gcp-live.json" >> "$GITHUB_ENV"

      - name: stack-kms-gcp against Cloud KMS
        run: mise run test:live:stack-kms-gcp

      - name: Remove the service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/stack-kms-gcp-live.json"
