packages:
  - packages/*
  - examples/*
  - e2e

catalogs:
  repo:
    '@cipherstash/auth': 0.36.0
    tsup: 8.5.1
    tsx: 4.21.0
    typescript: 5.6.3
    vitest: 3.1.3
  security:
    '@clerk/nextjs': 6.39.3
    next: 15.5.18
    vite: 8.0.9

# Supply-chain hardening — see skills/stash-supply-chain-security/
# 7 days in minutes; mirrors the Dependabot cooldown so manual + automated
# updates have the same community-discovery window.
minimumReleaseAge: 10080
# Forbid git/tarball deps anywhere in the lockfile (pnpm ≥ 10.26).
blockExoticSubdeps: true
# Excluded from the 7-day cooldown: first-party packages from Prisma that
# the @cipherstash/prisma-next integration is built against. These ship
# alongside the framework's own release cadence and are not exotic deps.
# Wildcard covers direct + transitive @prisma-next/* dependencies.
minimumReleaseAgeExclude:
  - '@prisma-next/*'
