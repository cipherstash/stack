[package]
name = "stack-encrypt"
description = "AES-256-GCM-SIV cipher implementing the vitaminc Cipher traits, keyed by ZeroKMS data keys"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license-file = "LICENSE"

[dependencies]
stack-kms = { path = "../stack-kms" }

# Scoped to the vitaminc PR #190 branch (re-introduced ContextTag on the revised
# Cipher/Decipher traits, stacked on the new Decipher trait + zeroize-on-drop
# work). Pinned here rather than via the workspace dep so the rest of the suite
# stays on the published 0.2.0-pre until the vitaminc PRs land.
vitaminc-aead = { git = "https://github.com/cipherstash/vitaminc", branch = "claude/vitaminc-aead-issue-178-vCypS" }
vitaminc-protected = { git = "https://github.com/cipherstash/vitaminc", branch = "claude/vitaminc-aead-issue-178-vCypS" }
zeroize = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

aes-gcm-siv = "0.11.1"

[dev-dependencies]
stack-kms = { path = "../stack-kms", features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }
vitaminc-protected = { git = "https://github.com/cipherstash/vitaminc", branch = "claude/vitaminc-aead-issue-178-vCypS" }

[package.metadata.docs.rs]
all-features = true
