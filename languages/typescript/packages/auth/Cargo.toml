[package]
name = "stack-auth-node"
version = "0.34.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
stack-auth = { path = ".." }
cts-common = { path = "../../cts-common", default-features = false }
napi = { version = "2", features = ["async", "tokio_rt"] }
napi-derive = "2"
url = { version = "2", optional = true }
mocktail = { version = "0.3.0", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
stack-auth = { path = "..", features = ["test-utils"] }
mocktail = "0.3.0"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
url = "2"

[build-dependencies]
napi-build = "2"

[features]
test-utils = ["stack-auth/test-utils", "dep:url", "dep:mocktail", "dep:serde_json"]

[workspace]
