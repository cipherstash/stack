[package]
name = "stack-auth-wasm"
description = "WebAssembly bindings for stack-auth (Supabase Edge / Deno targets)"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license-file = "LICENSE"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stack-auth = { workspace = true, features = ["http"] }
cts-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `console` feature gives us `web_sys::console::warn_2` for surfacing JS
# callback rejections inside `JsTokenStore` (CIP-3114). Target-gated to
# wasm32 because the consuming code in `JsTokenStore` is itself cfg-gated;
# on native the crate has no use for it and `cargo udeps --all-targets`
# (the `test-no-unused-cargo-dependencies` workflow) would flag it as
# unused.
web-sys = { version = "0.3", features = ["console"] }
# `Zeroizing` wraps the JSON-serialised `Token` while it sits in Rust heap
# between (de)serialisation and crossing the JS boundary, matching the
# behaviour of the upstream `CallbackTokenStore` on native. Target-gated for
# the same reason as `web-sys`.
zeroize = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
base64 = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
