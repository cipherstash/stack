["test:integration:stack-profile"]
description = "Run stack-profile Node.js integration tests"
dir = "{{config_root}}/languages/typescript/packages/profile"
run = [
  "cargo build -p stack-profile-node",
  "cp ../../../../target/debug/libstack_profile_node.dylib stack-profile-node.node 2>/dev/null || cp ../../../../target/debug/libstack_profile_node.so stack-profile-node.node",
  "pnpm exec vitest run",
]

# Rustdoc with warnings as errors: a broken intra-doc link or a rustdoc
# warning fails the build. It builds twice. The first build documents
# public items only, and only it warns when a public doc links to a
# private item. The second documents private items too, so a broken link
# in a private module's docs fails as well. Doc *examples* are
# `test:doc:stack-profile`. Both run with all features so nothing feature-gated
# goes unchecked; the root `doc` task fans out over every `doc:<crate>`.
["doc:stack-profile"]
description = "Build docs for stack-profile with all features, public then private items (warnings are errors)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
  "cargo doc -p stack-profile --no-deps --all-features",
  "cargo doc -p stack-profile --no-deps --all-features --document-private-items",
]

["test:doc:stack-profile"]
description = "Run documentation tests for stack-profile"
run = "mise x --env test -- cargo test -p stack-profile --doc --all-features"
