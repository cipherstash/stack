# Secrets named one by one rather than inherited. Same verdict as
# `secrets: inherit` and as no secrets at all — see the test that runs all
# three.
name: Reusable Explicit Secrets
on:
  push:
    tags: ['v*']
jobs:
  publish:
    uses: ./.github/workflows/called-cache.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
