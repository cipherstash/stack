[package]
name = "stack-encrypt"
description = "Encrypt Rust values under per-value ZeroKMS data keys via the vitaminc cipher traits"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license-file = "LICENSE"
# Not yet released: keep release-plz from picking this crate up (it processes
# any workspace crate whose Cargo.toml lacks `publish = false`), and the git
# vitaminc deps below have no registry version to publish against anyway.
publish = false

[dependencies]
# `profile` (native only; stack-kms gates it off wasm32 itself) lets
# `StackCipher::new()` fall back to the client key `stash auth login` writes
# to the profile directory (`secretkey.json`) when CS_CLIENT_ID /
# CS_CLIENT_KEY are not set — the same place `AutoStrategy` finds the token.
stack-kms = { path = "../stack-kms", default-features = false, features = ["profile"] }
# `StackCipher::new()` builds a ZeroKMS client from the environment, so its
# return type names the auto-detected auth strategy.
stack-auth = { workspace = true }
# `#[derive(EncryptFrom)]` / `#[derive(DecryptInto)]`, re-exported from `target`.
stack-encrypt-derive = { path = "../stack-encrypt-derive" }

# The revised Cipher/Decipher traits, ContextTag, Element, and the PRF crates
# have all merged to vitaminc main but are not yet published (crates.io is 200+
# commits behind). Pinned to a commit rather than `branch = "main"` so a
# `cargo update` cannot silently move the trait definitions under this crate,
# and declared here rather than via the workspace dep so the rest of the suite
# stays on the published 0.2.0-pre until the next vitaminc release.
#
# Temporarily pinned to the commit of cipherstash/vitaminc#289 (main + the
# `vitaminc_aead::Passthrough` wrapper); move the pin back to a main commit
# once it merges. All five must share one source or the aead crate is
# duplicated.
vitaminc-aead = { git = "https://github.com/cipherstash/vitaminc", rev = "04f4faa3eeeb69ae30dd0247865e06c640585fea" }
vitaminc-encrypt = { git = "https://github.com/cipherstash/vitaminc", rev = "04f4faa3eeeb69ae30dd0247865e06c640585fea" }
vitaminc-hmac = { git = "https://github.com/cipherstash/vitaminc", rev = "04f4faa3eeeb69ae30dd0247865e06c640585fea" }
vitaminc-prf = { git = "https://github.com/cipherstash/vitaminc", rev = "04f4faa3eeeb69ae30dd0247865e06c640585fea" }
vitaminc-protected = { git = "https://github.com/cipherstash/vitaminc", rev = "04f4faa3eeeb69ae30dd0247865e06c640585fea" }
serde = { workspace = true }

cllw-ore = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
stack-kms = { path = "../stack-kms", features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }
vitaminc-hmac = { git = "https://github.com/cipherstash/vitaminc", rev = "04f4faa3eeeb69ae30dd0247865e06c640585fea" }
vitaminc-prf = { git = "https://github.com/cipherstash/vitaminc", rev = "04f4faa3eeeb69ae30dd0247865e06c640585fea" }
vitaminc-protected = { git = "https://github.com/cipherstash/vitaminc", rev = "04f4faa3eeeb69ae30dd0247865e06c640585fea" }

[package.metadata.docs.rs]
all-features = true
