name: "stack-auth CRAP gate"

# Gates PRs that touch stack-auth on the CRAP (Change Risk Anti-Patterns) metric:
# cyclomatic complexity weighted by test coverage, so it surfaces complex,
# under-tested functions — the kind of code where a subtle bug like CIP-3233
# (#2036) can hide.
#
# Blocking: the `crap:stack-auth` mise task runs with `--fail-above`, so the job
# fails when any function's CRAP score exceeds the threshold in .cargo-crap.toml
# (30). Offending functions surface as inline PR annotations (`--format github`).
# To relax this to regression-only later, switch to `--baseline`/`--fail-regression`.
on:
  pull_request:
    paths:
      - packages/stack-auth/**
      - .cargo-crap.toml
      - .github/workflows/crap-stack-auth.yml
      # Ordering matters, this needs to stay at the end if we want to include the above, but exclude all .md files.
      - "!**.md"
      - "!**.example"

  workflow_dispatch:

defaults:
  run:
    shell: bash

# Read-only: failures surface as job status + inline annotations, not a comment.
permissions:
  contents: read

env:
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  NEXTEST_PROFILE: ci

jobs:
  crap-stack-auth:
    runs-on: blacksmith-8vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust

      - name: Install llvm-tools-preview (required by cargo-llvm-cov)
        run: rustup component add --toolchain "$(rustup show active-toolchain | cut -d' ' -f1)" llvm-tools-preview

      - name: Fix permissions on target directory
        run: |
          mkdir -p ./target
          sudo chown -R "$(id -u):$(id -g)" ./target

      - name: Run CRAP gate
        # Reuse the `crap:stack-auth` mise task as the single source of truth for the
        # coverage + `cargo crap` invocation (see packages/stack-auth/tasks.toml), so
        # the exclusions, threshold and `--fail-above` gate live in one place. mise
        # forwards trailing args (after `--`) to the task's last command (`cargo
        # crap`); `--format github` emits one `::warning` annotation per offending
        # function so they show inline on the PR before the job fails.
        run: mise run crap:stack-auth -- --format github
