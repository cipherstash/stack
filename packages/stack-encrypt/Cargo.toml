[package]
name = "stack-encrypt"
description = "Encrypt Rust values under per-value ZeroKMS data keys via the vitaminc cipher traits"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license-file = "LICENSE"
# Not yet released: keep release-plz from picking this crate up (it processes
# any workspace crate whose Cargo.toml lacks `publish = false`), and the git
# vitaminc deps below have no registry version to publish against anyway.
publish = false

[dependencies]
# No default features: `stack-encrypt` only ever takes a `DataKeySource`, so
# it has no use for stack-kms's `profile` feature (the CLI's on-disk
# `secretkey.json` via `stack-profile`). Consumers that want it enable it on
# their own `stack-kms` dependency.
stack-kms = { path = "../stack-kms", default-features = false }

# The revised Cipher/Decipher traits, ContextTag, Element, and the PRF crates
# have all merged to vitaminc main but are not yet published (crates.io is 200+
# commits behind). Pinned to a commit rather than `branch = "main"` so a
# `cargo update` cannot silently move the trait definitions under this crate,
# and declared here rather than via the workspace dep so the rest of the suite
# stays on the published 0.2.0-pre until the next vitaminc release.
vitaminc-aead = { git = "https://github.com/cipherstash/vitaminc", rev = "06fc3eaf8e39eab4aa9c6107c0ff2fc2952bebc3" }
vitaminc-encrypt = { git = "https://github.com/cipherstash/vitaminc", rev = "06fc3eaf8e39eab4aa9c6107c0ff2fc2952bebc3" }
vitaminc-hmac = { git = "https://github.com/cipherstash/vitaminc", rev = "06fc3eaf8e39eab4aa9c6107c0ff2fc2952bebc3" }
vitaminc-prf = { git = "https://github.com/cipherstash/vitaminc", rev = "06fc3eaf8e39eab4aa9c6107c0ff2fc2952bebc3" }
vitaminc-protected = { git = "https://github.com/cipherstash/vitaminc", rev = "06fc3eaf8e39eab4aa9c6107c0ff2fc2952bebc3" }
serde = { workspace = true }

cllw-ore = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
stack-kms = { path = "../stack-kms", features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }
vitaminc-hmac = { git = "https://github.com/cipherstash/vitaminc", rev = "06fc3eaf8e39eab4aa9c6107c0ff2fc2952bebc3" }
vitaminc-protected = { git = "https://github.com/cipherstash/vitaminc", rev = "06fc3eaf8e39eab4aa9c6107c0ff2fc2952bebc3" }

[package.metadata.docs.rs]
all-features = true
