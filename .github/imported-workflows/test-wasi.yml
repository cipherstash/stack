name: "WASI check (Go/wazero target)"
on:
  push:
    branches:
      - main
    paths:
      # The gate must be fail-closed over its build inputs, not just the five
      # checked crates: their dependency closure includes other local
      # packages/ crates (e.g. zerokms-protocol -> cipherstash-config), and
      # root Cargo.toml (workspace deps/features) or .cargo/ config can
      # change what compiles for the target without touching Cargo.lock.
      # Trigger on all of packages/ rather than enumerating the closure,
      # which would silently drift.
      - packages/**
      # The guest is a detached workspace and the Go binding a separate
      # module, so nothing else in CI compiles, tests or links them — this
      # job is their only gate.
      - bindings/go/stackencrypt/**
      - scripts/check-wasm-imports.py
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - mise.toml
      - .github/workflows/test-wasi.yml
      # Ordering matters, this needs to stay at the end if we want to include the above, but exclude all .md files.
      - "!**.md"
      - "!**.example"

  pull_request:
    paths:
      - packages/**
      # The guest is a detached workspace and the Go binding a separate
      # module, so nothing else in CI compiles, tests or links them — this
      # job is their only gate.
      - bindings/go/stackencrypt/**
      - scripts/check-wasm-imports.py
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - mise.toml
      - .github/workflows/test-wasi.yml
      # Ordering matters, this needs to stay at the end if we want to include the above, but exclude all .md files.
      - "!**.md"
      - "!**.example"

  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  wasi-check:
    runs-on: blacksmith-8vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust

      - name: Fix permissions on target directory
        run: |
          mkdir -p ./target
          sudo chown -R "$(id -u):$(id -g)" ./target

      # The HTTP-free core compiles for wasm32-wasip1 with no JS-host backend
      # and no native HTTP/TLS stack in its dependency tree — the invariant
      # the Go/wazero binding of stack-encrypt is built on. See
      # docs/plans/stack-encrypt-go-bindings.md and wasm-analysis.md Layer 6.
      - name: WASI core check
        run: mise run wasm:wasi-check

      # The same no-http shape, exercised on the host: unit tests, doctests,
      # and rustdoc (-D warnings) must hold with default features off — the
      # compile gate above cannot see doc examples or intra-doc links.
      - name: No-http tests and docs
        run: mise run wasm:no-http-test

      # The stack-encrypt WASI guest (bindings/go/stackencrypt/guest) is a
      # detached workspace: `test:unit` and the workspace-wide lints never
      # see it, so without these two steps its tests could fail and its
      # wasm-only modules stop compiling with every check still green.
      - name: Guest lint and tests
        run: mise run wasm:guest:test

      # Builds the release module and asserts its host-import surface is
      # exactly WASI (minus ambient filesystem/sockets) plus the two
      # `cipherstash_transport` functions — the property the Go embedder's
      # sandboxing rests on, checkable only on the linked artifact.
      - name: Guest release build and import-surface gate
        run: mise run wasm:guest:build

      # The Go binding (bindings/go/stackencrypt) embeds the module built
      # above: format, vet and hermetic tests (import surface, transport
      # bridge against an httptest ZeroKMS, guest-parser acceptance of every
      # encoding the package builds, hostile ABI inputs, key residency), on
      # amd64 and 386. Live round trips through ZeroKMS are the phase 5
      # harness's.
      - name: Go binding
        env:
          # The guest's memory lock (bindings/go/stackencrypt/memory.go) is
          # best effort, so its test skips where RLIMIT_MEMLOCK refuses it —
          # a developer laptop's default. CI raises the limit and sets this
          # so the skip is an error here and the lock is really exercised.
          STACKENCRYPT_TESTS_REQUIRE_LOCK: "1"
        run: |
          ulimit -l "$(ulimit -H -l)"
          echo "RLIMIT_MEMLOCK: $(ulimit -l) KiB"
          mise run go:stackencrypt:test
