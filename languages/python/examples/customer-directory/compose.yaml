services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer_directory
    ports:
      - 127.0.0.1:5438:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d customer_directory]
      interval: 1s
      timeout: 3s
      retries: 30
