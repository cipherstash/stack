# release-plz configuration for the ROOT Cargo workspace: the stack-* crates.
#
# `.github/workflows/release-plz.yml`'s `release-crates` job passes
# `manifest_path: Cargo.toml` and `config: release-plz.toml`. The EQL workspace
# has its own file at packages/eql/release-plz.toml.
#
# Five crates publish from here, in three version groups:
#
# - `stack-auth` and `stack-profile` (the 0.43 line). In cipherstash-suite
#   they shared a group with `cipherstash-client`, which stays there.
# - `stack-kms` (from 0.1.0), on its own. It is a standalone ZeroKMS client,
#   changes for its own reasons (the ZeroKMS protocol, stack-auth), and is
#   usable without stack-encrypt. stack-encrypt depends on it publicly and
#   re-exports it as `stack_encrypt::kms`, so its callers always get the
#   version stack-encrypt was built against.
# - `stack-encrypt` and `stack-encrypt-derive` (from 0.1.0). The derive emits
#   code against `stack-encrypt`'s paths and traits, so the two move as one.
#   `eql-bindings` depends on `stack-encrypt` (its optional `stack-encrypt`
#   feature), so a crates.io release of `eql-bindings` needs the matching
#   `stack-encrypt` published first.
#
# Every other workspace member is `publish = false` in its Cargo.toml and is
# also listed below with `release = false`, so `release-plz update` does not
# bump its version or write its changelog either. Each also repeats
# `publish = false`: the workspace `publish = true` applies to every package
# that does not override it, and release-plz refuses to run when that
# contradicts the Cargo.toml.
#
# Tags are release-plz's default, `<crate>-v<semver>`. No workflow triggers
# on any of them.

[workspace]
changelog_config = "cliff.toml"
git_tag_enable = true
git_release_enable = true
publish = true
# Matches cipherstash-suite and packages/eql/release-plz.toml.
semver_check = false

[[package]]
name = "stack-auth"
version_group = "stack-auth"

[[package]]
name = "stack-profile"
version_group = "stack-auth"

[[package]]
name = "stack-kms"
version_group = "stack-kms"

[[package]]
name = "stack-encrypt"
version_group = "stack-encrypt"

[[package]]
name = "stack-encrypt-derive"
version_group = "stack-encrypt"

[[package]]
name = "stack-guest-abi"
release = false
publish = false

[[package]]
name = "stack-auth-node"
release = false
publish = false

[[package]]
name = "stack-profile-node"
release = false
publish = false

[[package]]
name = "stack-auth-wasm"
release = false
publish = false
