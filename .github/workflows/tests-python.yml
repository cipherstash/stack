name: Tests (Python)

# The Python SDK workspace at languages/python: its two crates
# (stackencrypt-core, stackencrypt-engine) and the pure-Python package
# `stackencrypt`. The fourth Cargo workspace, and the first one whose checks
# nothing else runs: tests-crates.yml compiles the stack-* crates but never
# links them into pyo3, and tests.yml's gate excludes those crates on purpose.
# So a stack-encrypt change that breaks the engine crate is caught here or
# nowhere. scripts/__tests__/python-ci.test.mjs derives the `pull_request`
# filter below from the workspace's Cargo.lock, so a new path dependency fails
# that test until the filter follows.
#
# Two jobs. `python` runs the Rust checks and the pure-Python suite on the
# oldest supported interpreter (the `requires-python` floor) and the one
# mise.toml names, since a wheel tagged abi3-py39 is a claim about the floor
# that only a run on the floor tests. `wheels` builds one abi3 wheel per platform the FFI
# ships for, and uploads them as artifacts; nothing is released. The two jobs
# are independent, so a pytest failure does not hide whether the wheels build.
#
# No job here holds a CipherStash credential. The live test job (credentials,
# Postgres) lands with the first `encrypt` ticket (#1389), as its own job.

on:
  pull_request:
    paths:
      - languages/python/**
      # The crates the workspace compiles by path, in the order Cargo.lock
      # lists them: stack-encrypt and its derive macro, stack-kms, and the
      # stack-auth and stack-profile that stack-kms's `profile` feature pulls
      # in. The root manifest comes with them: their requirements are
      # `{ workspace = true }` and resolve from the root Cargo.toml even when
      # built from this workspace.
      - packages/stack-encrypt/**
      - packages/stack-encrypt-derive/**
      - packages/stack-kms/**
      - packages/stack-auth/**
      - packages/stack-profile/**
      - Cargo.toml
      # The EQL codegen and the catalog it reads: the SDK's marker names are
      # generated from the catalog (#1385), so a change to either must rerun
      # the suite that reads them.
      - packages/eql/crates/eql-codegen/**
      - packages/eql/crates/eql-domains/**
      # The Rust version the workspace builds under; its own mise.toml
      # is under languages/python/** above.
      - mise.toml
      - .github/workflows/tests-python.yml
  # Unfiltered, like tests-rust.yml: every push to main runs the suite, so
  # main runs a superset of what pull requests run. Recorded in
  # scripts/__tests__/workflow-paths-filter-parity.test.mjs.
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  python:
    name: "Python ${{ matrix.python }}: fmt, clippy, cargo test, pytest"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      # Both interpreters report: a failure on 3.9 alone is the abi3 floor
      # breaking, and that reads differently from a failure on both.
      fail-fast: false
      matrix:
        # Quoted on purpose: YAML reads a bare 3.10 as the number 3.1.
        python: ["3.9", "3.14"]
    env:
      RUSTFLAGS: "-D warnings"
      # languages/python/mise.toml names python = "3.14" for the local loop.
      # mise reads MISE_<TOOL>_VERSION ahead of any config file, so this one
      # variable moves every step, the mise-action install included, to the
      # leg's interpreter; `mise run build` and `test:cargo` take `python3`
      # from PATH and so follow it. The step "The interpreter is the leg's"
      # below is what proves it took.
      MISE_PYTHON_VERSION: ${{ matrix.python }}
    defaults:
      run:
        working-directory: languages/python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # In the workspace folder, so mise merges languages/python/mise.toml
      # (python, uv, the tasks) over the root one (rust 1.94.1). Only the
      # three tools this job uses: with no install_args, `install: true`
      # also installs the root's Go and golangci-lint, which nothing here
      # runs. The cache key is shared by both legs (it hashes the config, not
      # the environment), so the leg that saves first holds its interpreter
      # and the other installs its own, uncached. That costs the other leg a
      # download, and nothing else: see the interpreter check below.
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          version: 2026.4.0
          install: true
          install_args: python uv rust
          working_directory: languages/python
          cache: true
          # Must name runs-on's image; see scripts/__tests__/workflow-mise-cache-image.test.mjs
          cache_key_prefix: mise-v1-ubuntu-2404

      # mise caches its rust install as a symlink into ~/.rustup, which the
      # cache does not hold, so on a cache hit the components mise.toml
      # declares can be missing. A no-op when they are there. The same step
      # as tests-crates.yml, for the same reason.
      - name: Add rustfmt and clippy to the toolchain mise installed
        run: rustup component add rustfmt clippy

      # The matrix is decorative unless the interpreter on PATH is the leg's.
      # A version mise stopped reading from the environment would run both
      # legs on 3.14 and both would go green.
      - name: The interpreter is the leg's
        env:
          WANT: ${{ matrix.python }}
        run: |
          set -euo pipefail
          have="$(mise x -- python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          if [ "$have" != "$WANT" ]; then
            echo "::error::python3 on PATH is $have, this leg wants $WANT: MISE_PYTHON_VERSION was not honoured"
            exit 1
          fi
          echo "python3 is $have"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: languages/python

      - name: rustfmt
        run: cargo fmt --all --check

      # pyo3's build script asks the `python3` on PATH for its configuration,
      # which is why this runs after mise is installed and per interpreter.
      - name: clippy
        run: cargo clippy --locked --no-deps --workspace --all-targets -- -D warnings

      # `cargo test --locked` for both crates. The task puts the interpreter's
      # library directory on the loader path, because the engine crate links
      # libpython outside a wheel.
      - name: cargo test
        run: mise run test:cargo

      # Builds the extension with maturin (dev profile) into a virtualenv for
      # the leg's interpreter and runs pytest in it.
      - name: pytest
        run: mise run test

  # One abi3-py39 wheel per platform the FFI ships for, by the same Rust
  # triples (python-ci.test.mjs holds the list to the protect-ffi platform
  # packages). The wheels are uploaded as artifacts and nothing publishes them:
  # the spec puts PyPI out of scope. The build time of each is written to the
  # leg's own job summary and, as one table, to `wheels-summary`'s.
  #
  # Release profile, deliberately: the local loop builds the dev profile for
  # speed (languages/python/mise.toml), and the number this job records is the
  # cost of the wheel a user would install.
  wheels:
    name: "wheel ${{ matrix.platform }}"
    strategy:
      # One platform failing must not cancel the other five: the failure is
      # usually specific to a toolchain, and seeing which of the six are fine
      # is most of the diagnosis.
      fail-fast: false
      matrix:
        # `platform` is the FFI's name for the leg and `target` its triple,
        # read from languages/typescript/packages/protect-ffi/platforms/*/package.json.
        # `wheel` is the platform tag the wheel's filename must carry, and the
        # one fact each leg checks about what it built. `native` marks the legs
        # whose runner can import the wheel it built.
        #
        # Linux builds run inside maturin-action's manylinux containers, which
        # is what gives the gnu wheels their glibc floor: 2.28, the same floor
        # the FFI's zigbuild passes as `--target <triple>.2.28`. The musl wheel
        # is built in the musllinux_1_2 container, a musl system, as the FFI's
        # musl binary is built in Alpine. Both Darwin legs share macos-latest,
        # which is arm64, so `target` is what makes darwin-x64 an x86_64 wheel
        # and not a second arm64 one with the wrong name.
        include:
          - platform: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            os: blacksmith-4vcpu-ubuntu-2404
            manylinux: "2_28"
            wheel: manylinux_2_28_x86_64
            native: true
          - platform: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            os: blacksmith-4vcpu-ubuntu-2404
            manylinux: "2_28"
            wheel: manylinux_2_28_aarch64
            native: false
          - platform: linux-x64-musl
            target: x86_64-unknown-linux-musl
            os: blacksmith-4vcpu-ubuntu-2404
            manylinux: musllinux_1_2
            wheel: musllinux_1_2_x86_64
            native: false
          - platform: darwin-x64
            target: x86_64-apple-darwin
            os: macos-latest
            manylinux: auto
            wheel: macosx_[0-9_]*_x86_64
            native: false
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            manylinux: auto
            wheel: macosx_[0-9_]*_arm64
            native: true
          - platform: win32-x64-msvc
            target: x86_64-pc-windows-msvc
            os: windows-latest
            manylinux: auto
            wheel: win_amd64
            native: true
    runs-on: ${{ matrix.os }}
    # A release build of the stack-encrypt graph, cross-compiled on two legs,
    # on a 4 vCPU runner with no registry cache inside the container. Wider
    # than the other jobs on purpose; tighten once a few runs have shown the
    # real number.
    timeout-minutes: 90
    steps:
      # Git for Windows defaults to CRLF on checkout. `cargo fmt` is not run
      # here, but a CRLF pyproject.toml is what maturin would read.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # One source of truth for the Rust version: the root mise.toml the
      # `python` job builds under. mise itself is not installed here: the
      # Linux legs compile inside a container, where maturin-action installs
      # the toolchain this names. If that line changes shape, fail here by name
      # rather than hand maturin-action an empty toolchain, which it would
      # read as "stable".
      - name: Rust version from mise.toml
        id: rust
        run: |
          version=$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)
          if [ -z "$version" ]; then
            echo 'no rust = { version = "..." } line in mise.toml; the Rust version line has changed shape' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The floor, not the newest: an abi3-py39 wheel claims to load on 3.9,
      # and the import below is that claim tested. maturin needs no
      # interpreter for an abi3 build, so this is for the import alone.
      # "3.9" resolves to the newest 3.9.x the runner has a build for: 3.9.13
      # on arm64 macOS and on Windows, where the later security releases
      # shipped no binaries (actions/python-versions manifest, 2026-10-27),
      # and 3.9.25 on Linux and x64 macOS.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"

      # The toolchain the wheel is built with, installed before the cache step
      # so that step keys on it: rust-cache reads `rustc -vV` from the default
      # toolchain, and without this it would key on whatever the runner image
      # ships and never follow the version mise.toml names. maturin-action
      # installs the same version again inside the Linux containers, where
      # this install is not visible; `rustup toolchain install` is a no-op
      # where it already is.
      - name: Install the Rust toolchain mise.toml names
        env:
          RUST_VERSION: ${{ steps.rust.outputs.version }}
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      # Keyed by target as well as by lockfile, so the six legs do not evict
      # each other. On the three host legs this caches the registry and the
      # workspace `target/` directory. On the three container legs it is weak:
      # the container keeps its own registry, and writes `target/` as root
      # through the bind mount, so the post step may only warn. It stays on
      # every leg because every leg compiles Rust (#1383).
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: languages/python
          key: ${{ matrix.target }}

      - name: Start the clock
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      # `--locked`: the Cargo.lock in the tree is the one built, as in every
      # other check of this workspace. `--out dist` puts the wheel where the
      # steps below and the artifact upload look.
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: languages/python
          command: build
          args: --release --locked --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: ${{ steps.rust.outputs.version }}

      # The build time is the number this job exists to record (the spec's
      # scorecard asks for it per platform). Written here, to this leg's
      # summary, and to a file the `wheels-summary` job gathers into one table.
      - name: Record the build time
        env:
          PLATFORM: ${{ matrix.platform }}
          START: ${{ steps.clock.outputs.start }}
        run: |
          set -euo pipefail
          seconds=$(( $(date +%s) - START ))
          mkdir -p languages/python/timing
          echo "$seconds" > "languages/python/timing/${PLATFORM}.seconds"
          echo "Built the ${PLATFORM} wheel in ${seconds}s" >> "$GITHUB_STEP_SUMMARY"

      # Exactly one wheel, tagged for the floor (cp39-abi3) and for this leg's
      # platform. A wrong `target` on the shared Darwin runner, or a container
      # that produced a manylinux tag below the floor, both show up in the
      # filename and nowhere else that this job reads.
      - name: The wheel is one, abi3-py39, for this platform
        env:
          PLATFORM: ${{ matrix.platform }}
          WHEEL_TAG: ${{ matrix.wheel }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(languages/python/dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected one wheel in languages/python/dist, found ${#wheels[@]}: ${wheels[*]}"
            exit 1
          fi
          name=$(basename "${wheels[0]}")
          echo "$name"
          if ! [[ "$name" =~ ^stackencrypt-[^-]+-cp39-abi3-${WHEEL_TAG}\.whl$ ]]; then
            echo "::error::${name} is not a stackencrypt cp39-abi3 wheel tagged ${WHEEL_TAG} (the ${PLATFORM} leg)"
            exit 1
          fi

      # On the legs whose runner is the wheel's platform, install it into the
      # floor interpreter and load both halves. The cross-compiled legs
      # (linux-arm64-gnu, linux-x64-musl, darwin-x64) cannot run theirs here;
      # for them the filename check above is the whole verification.
      - name: Import the wheel on Python 3.9
        if: ${{ matrix.native }}
        run: |
          set -euo pipefail
          python -m pip install --no-index --no-deps languages/python/dist/*.whl
          python -c 'import stackencrypt as s; print("stackencrypt", s.__version__, "engine", s.__engine__)'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.platform }}
          path: languages/python/dist/*.whl
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-timing-${{ matrix.platform }}
          path: languages/python/timing/*.seconds
          if-no-files-found: error
          retention-days: 14

  # The six wheels in one place: counts them, and writes one table of build
  # time per platform to the job summary. A missing wheel fails here by
  # platform name, so a leg that uploaded nothing is not mistaken for one
  # whose job was skipped.
  wheels-summary:
    name: six wheels, build time per platform
    needs: [wheels]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: wheels

      - name: Six wheels, one per platform, and their build times
        run: |
          set -euo pipefail
          shopt -s nullglob
          platforms="linux-x64-gnu linux-arm64-gnu linux-x64-musl darwin-x64 darwin-arm64 win32-x64-msvc"
          wheels=(wheels/*.whl)
          {
            echo "## Python wheels"
            echo ""
            echo "| platform | wheel | build time |"
            echo "|---|---|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          missing=0
          for platform in $platforms; do
            timing="wheels/${platform}.seconds"
            if [ ! -f "$timing" ]; then
              echo "::error::no build time recorded for ${platform}"
              missing=1
              continue
            fi
            echo "| ${platform} | see artifact wheel-${platform} | $(cat "$timing")s |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${wheels[@]##*/}" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          if [ "${#wheels[@]}" -ne 6 ] || [ "$missing" -ne 0 ]; then
            echo "::error::expected six wheels with six build times, found ${#wheels[@]} wheels: ${wheels[*]##*/}"
            exit 1
          fi
