[package]
name = "recipher-js"
description = "The Node addon of @cipherstash/recipher: the classes its TypeScript exports, over the Stack Encrypt engine"
version = "0.0.0"
edition.workspace = true
# Literal, not inherited: scripts/__tests__/cargo-publish-opt-out.test.mjs
# greps each member for this exact line.
publish = false
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# `createTesting`: a cipher over the engine's deterministic test key source
# (`stack_encrypt::kms::DeterministicSource`), for
# `@cipherstash/recipher/testing`. No credentials, no network. The debug
# build (`build:debug`) has it; the release build (`build:native`) does not,
# and `tests/boundaries.rs` checks that a default build cannot reach it.
testing = ["stack-encrypt/test-support"]

[dependencies]
# The engine, by path, so a build carries the engine of its own commit.
# `dynamic` is the runtime value model a binding speaks. `http` builds a
# cipher over ZeroKMS from the credentials it detects.
stack-encrypt = { path = "../../../../../packages/stack-encrypt", default-features = false, features = ["dynamic", "http"] }
# The auth strategy the detected cipher's key source is generic over.
stack-auth = { path = "../../../../../packages/stack-auth", default-features = false, features = ["http"] }
# napi-rs 3, as `recipher-value-napi` is. The default features of napi-rs load
# Node-API by name at run time (`dyn-symbols`), so the crate's own tests link
# without Node.
#
# The value bridge's walk needs `napi6`, for BigInt and property enumeration.
# `Symbol.for` needs `napi9`, and Node 18.17 and later provide `napi9`.
# `Symbol.for` makes the key of a decrypted row's `inspect`. `tokio_rt` runs
# the engine's futures on napi's runtime.
napi = { version = "3", features = ["napi9", "tokio_rt", "serde-json"] }
napi-derive = "3"
# The value bridge: every JavaScript value is read and built through it.
recipher-value-napi = { path = "../value-napi" }
# The frame `JsBuilder::build` takes, and the frame writer a row is split
# with. The version the engine resolves.
vitaminc-aead = "0.10.0"
# `OpaqueDebug`, and the protected buffer a frame is held in. The version
# the engine resolves.
vitaminc-protected = "0.10.0"
# Every error is a miette diagnostic: the engine's, the value bridge's, and
# the SDK's own, which derive `Diagnostic` and `thiserror::Error`. The
# versions the engine resolves.
miette = "7.5.0"
thiserror = "1.0.56"
# For the structured fields of an engine error (`ErrorPayload::payload`).
serde_json = "1"
# The engine's opaque path wipes a value it did not seal. The version the
# engine resolves.
zeroize = "1"
# Deserialises the kind passed to `Ciphertext.fromBytes`, and a record's
# declaration. The addon reads each one from its frame, through the frame's
# serde support.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
stack-encrypt = { path = "../../../../../packages/stack-encrypt", default-features = false, features = ["dynamic", "http", "test-support"] }
tokio = { version = "1", features = ["rt", "macros"] }
# The values the engine-interop tests encrypt through the engine's typed API,
# and the types the counting key source names. The versions the engine
# resolves.
jiff = { version = "1.0.0", default-features = false }
rust_decimal = { version = "1", default-features = false }
uuid = "1"

[build-dependencies]
napi-build = "2"
