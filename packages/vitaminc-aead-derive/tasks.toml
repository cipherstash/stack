# Tasks for vitaminc-aead-derive, imported from cipherstash/vitaminc. Included from the
# root mise.toml.

# Rustdoc with warnings as errors, which the root `doc` task fans out to.
["doc:vitaminc-aead-derive"]
description = "Build docs for vitaminc-aead-derive with all features (warnings are errors)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc -p vitaminc-aead-derive --no-deps --all-features"
