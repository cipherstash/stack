[package]
name = "stack-encrypt"
description = "AES-256-GCM-SIV cipher implementing the vitaminc Cipher traits, keyed by ZeroKMS data keys"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license-file = "LICENSE"

[dependencies]
stack-kms = { path = "../stack-kms" }

# The revised Cipher/Decipher traits, ContextTag, and the PRF crates have all
# merged to vitaminc main but are not yet published (crates.io is 200+ commits
# behind). Pinned here rather than via the workspace dep so the rest of the
# suite stays on the published 0.2.0-pre until the next vitaminc release.
vitaminc-aead = { git = "https://github.com/cipherstash/vitaminc", branch = "main" }
vitaminc-protected = { git = "https://github.com/cipherstash/vitaminc", branch = "main" }
zeroize = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

aes-gcm-siv = "0.11.1"

[dev-dependencies]
stack-kms = { path = "../stack-kms", features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }
vitaminc-protected = { git = "https://github.com/cipherstash/vitaminc", branch = "main" }

[package.metadata.docs.rs]
all-features = true
