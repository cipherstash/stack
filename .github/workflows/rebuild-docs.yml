name: Rebuild Docs

# Fires the docs-site rebuild webhook when a release tag lands.
#
# TWO TAG FAMILIES, ONE WEBHOOK. This file used to watch only the changesets tag
# for `@cipherstash/stack`. The EQL port added the second family: the imported
# copy at `packages/eql/.github/workflows/rebuild-docs.yml` watched `eql-*` and
# ran nowhere, because GitHub reads workflows from the repository root alone.
# Merging them rather than keeping two files was the obvious call — the job is
# one `curl` against one secret, and nothing binds to either filename.
#
# `!eql-bindings-*` IS PART OF THE RELEASE IDENTITY, not a tidy-up. release-plz
# tags the Rust crate `eql-bindings-v<semver>` (its default workspace tag), and
# a crate release must not fire the docs rebuild — nor the SQL build or the
# Postgres image, which is why `packages/eql/release-plz.toml` chose a tag shape
# the `eql-*` automation does not match. GitHub applies these patterns in order:
# a ref matching a negative pattern AFTER a positive one is excluded, so
# `eql-bindings-v3.0.6` matches `eql-*` and is then dropped.
on:
  push:
    tags:
      - '@cipherstash/stack@*'
      - 'eql-*'
      - '!eql-bindings-*'

permissions:
  contents: read

jobs:
  trigger-docs-rebuild:
    name: Trigger Docs Rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOCS_WEBHOOK_URL }}
        run: |
          curl -X POST "$WEBHOOK_URL"
