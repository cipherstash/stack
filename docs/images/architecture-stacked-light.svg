<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="CipherStash architecture diagram"><rect width="760" height="1100" fill="#eae8dd"></rect><defs>
    <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cc3d00"></path></marker>
    <marker id="aM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(6,6,6,0.72)"></path></marker>
  </defs><path d="M66,48 H694 V740 H66 Z" fill="none" stroke="#5f7404" stroke-dasharray="6 6"></path><text x="66" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.06em"><tspan fill="#5f7404">YOUR TRUST BOUNDARY</tspan><tspan fill="rgba(6,6,6,0.55)"> — PLAINTEXT + DATA KEYS NEVER LEAVE</tspan></text><g><rect x="90" y="80" width="580" height="360" rx="2" fill="#f4f3ec" stroke="rgba(6,6,6,0.20)"></rect><text x="114" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#060606" letter-spacing="0.08em">YOUR APP</text><text x="646" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="rgba(6,6,6,0.55)" letter-spacing="0.08em" text-anchor="end">[TYPESCRIPT]</text><text x="114" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#5f7404">@cipherstash/stack</text><line x1="114" y1="166" x2="646" y2="166" stroke="rgba(6,6,6,0.10)"></line><text x="114" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="rgba(6,6,6,0.72)"><tspan fill="rgba(6,6,6,0.55)">· </tspan><tspan fill="rgba(6,6,6,0.72)">encrypt / decrypt in-app</tspan></text><text x="114" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="rgba(6,6,6,0.72)"><tspan fill="rgba(6,6,6,0.55)">· </tspan><tspan fill="rgba(6,6,6,0.72)">search on </tspan><tspan fill="#cc3d00">ciphertext</tspan></text><rect x="114" y="244" width="532" height="172" rx="2" fill="#e2e0d3" stroke="rgba(6,6,6,0.20)"></rect><text x="132" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="rgba(6,6,6,0.55)" letter-spacing="0.1em">DATA KEY DERIVATION</text><text x="628" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#5f7404" letter-spacing="0.08em" text-anchor="end">[LOCAL]</text><line x1="132" y1="284" x2="628" y2="284" stroke="rgba(6,6,6,0.10)"></line><text x="132" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#5f7404">your client key</tspan><tspan fill="rgba(6,6,6,0.55)"> — unique to this app</tspan></text><text x="132" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="rgba(6,6,6,0.72)">+ key component from ZeroKMS</tspan></text><line x1="132" y1="354" x2="628" y2="354" stroke="rgba(6,6,6,0.10)"></line><text x="132" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#060606">= per-value data keys</tspan></text><text x="132" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"><tspan fill="rgba(6,6,6,0.55)">derived here — never leave the app</tspan></text></g><g><rect x="90" y="520" width="580" height="190" rx="2" fill="#f4f3ec" stroke="rgba(6,6,6,0.20)"></rect><text x="114" y="558" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#060606" letter-spacing="0.08em">YOUR DATABASE</text><text x="646" y="558" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="rgba(6,6,6,0.55)" letter-spacing="0.08em" text-anchor="end">[POSTGRESQL]</text><text x="114" y="584" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="rgba(6,6,6,0.72)">PostgreSQL · JSONB</text><line x1="114" y1="606" x2="646" y2="606" stroke="rgba(6,6,6,0.10)"></line><text x="114" y="634" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="rgba(6,6,6,0.72)"><tspan fill="rgba(6,6,6,0.55)">· </tspan><tspan fill="rgba(6,6,6,0.72)">stores </tspan><tspan fill="#cc3d00">ciphertext only</tspan></text><text x="114" y="660" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="rgba(6,6,6,0.72)"><tspan fill="rgba(6,6,6,0.55)">· </tspan><tspan fill="rgba(6,6,6,0.72)">searchable via EQL</tspan></text></g><g><rect x="90" y="810" width="580" height="230" rx="2" fill="#f4f3ec" stroke="rgba(6,6,6,0.20)"></rect><text x="114" y="848" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#060606" letter-spacing="0.08em">ZEROKMS</text><text x="646" y="848" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="rgba(6,6,6,0.55)" letter-spacing="0.08em" text-anchor="end">[CIPHERSTASH]</text><text x="114" y="874" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="rgba(6,6,6,0.72)">holds one key component — never a whole key</text><line x1="114" y1="896" x2="646" y2="896" stroke="rgba(6,6,6,0.10)"></line><text x="114" y="924" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="rgba(6,6,6,0.72)"><tspan fill="rgba(6,6,6,0.55)">· </tspan><tspan fill="rgba(6,6,6,0.72)">unique key component per value</tspan></text><text x="114" y="950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="rgba(6,6,6,0.72)"><tspan fill="rgba(6,6,6,0.55)">· </tspan><tspan fill="rgba(6,6,6,0.72)">bulk key ops — fast</tspan></text><line x1="114" y1="1002" x2="646" y2="1002" stroke="rgba(6,6,6,0.10)"></line><text x="114" y="1026" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="rgba(6,6,6,0.55)" letter-spacing="0.04em">EVERY DECRYPTION LOGGED → SOC 2 / ISO 27001</text></g><g><rect x="106" y="798" width="272.20000000000005" height="24" rx="2" fill="#eae8dd" stroke="#5f7404"></rect><text x="120" y="814" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#5f7404" letter-spacing="0.06em">NEVER SEES PLAINTEXT OR DATA KEYS</text></g><line x1="250" y1="440" x2="250" y2="518" stroke="#cc3d00" stroke-width="1.25" marker-end="url(#aC)"></line><text x="266" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="undefined"><tspan fill="#cc3d00">ciphertext · EQL JSON</tspan></text><line x1="560" y1="520" x2="560" y2="442" stroke="#cc3d00" stroke-width="1.25" marker-end="url(#aC)"></line><text x="544" y="488" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="undefined" text-anchor="end"><tspan fill="rgba(6,6,6,0.55)">encrypted rows</tspan></text><path d="M90,150 H44 V925 H86" fill="none" stroke="rgba(6,6,6,0.72)" stroke-width="1.25" marker-end="url(#aM)"></path><text x="36" y="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="undefined" transform="rotate(-90 36 700)"><tspan fill="rgba(6,6,6,0.55)">per-value key requests (bulk)</tspan></text><path d="M670,905 H726 V330 H674" fill="none" stroke="rgba(6,6,6,0.72)" stroke-width="1.25" marker-end="url(#aM)"></path><text x="738" y="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="undefined" transform="rotate(-90 738 700)"><tspan fill="rgba(6,6,6,0.55)">key component — ½ of each key</tspan></text></svg>