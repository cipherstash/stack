[package]
name = "vitaminc-aead-frame"
description = "Transport frame and ciphertext codec for carrying Vitamin-C AEAD values and ciphertexts across an FFI boundary, and a versioned storage profile for values that are kept. Part of the Vitamin-C cryptographic suite."
documentation = "https://docs.rs/vitaminc-aead-frame"
version = "0.10.0"
repository = "https://github.com/cipherstash/stack"
authors = ["Dan Draper <dan@cipherstash.com>"]
edition = "2021"
homepage = "https://cipherstash.com"
license = "MIT"
keywords = ["cryptography", "security"]
categories = ["cryptography"]
rust-version = "1.89.0"
# Not published from this repository yet: crates.io serves 0.10.0, which was
# published from cipherstash/vitaminc. release-plz.toml lists it with
# `release = false`. Every workspace that resolves it patches crates.io's
# copy to this one.
publish = false
# scripts/ holds the storage corpus append-only check, which
# .github/workflows/storage-corpus.yml runs on a pull request that changes
# testdata/ or scripts/, against the pull request's base branch. It reads git
# history and is no part of the crate a dependent builds.
exclude = ["scripts/"]

[lints.rust]
# Set by `cargo kani`, which builds the proof harnesses in
# src/storage/proofs.rs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[package.metadata.docs.rs]
all-features = true

[dependencies]
vitaminc-aead = { version = "0.10.0", path = "../vitaminc-aead" }
vitaminc-protected = { version = "0.10.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
# serde over the transport frame (`vitaminc_aead_frame::serde`): read any
# `Deserialize` type from frame bytes and write any `Serialize` type as
# frame bytes, for data a host exchanges with Rust that is not plaintext.
# Also the storage profile (`vitaminc_aead_frame::storage`): the same
# mapping as a versioned blob whose format is frozen, for bytes that are
# kept (STORAGE.md).
serde = ["dep:serde", "dep:vitaminc-protected"]

[dev-dependencies]
serde_bytes = "0.11"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
serde_json = "1"
# The conformance test builds each vector's scalar independently through
# the jiff and rust_decimal conversions. vitaminc 0.10.0 also listed
# vitaminc-encrypt here, for a fixture test that no longer exists; no code
# uses it, so cargo-udeps refused it and it is gone.
vitaminc-aead = { path = "../vitaminc-aead", features = ["jiff", "rust_decimal"] }
jiff = { version = "1.0.1", default-features = false }
vitaminc-protected = "0.10.0"
rust_decimal = { version = "1.41", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Formats the bench compares the storage profile with.
borsh = { version = "1.8", features = ["derive"] }
rmp-serde = "1.3.1"

# The storage profile is behind `serde`, so the bench is too.
[[bench]]
name = "storage"
harness = false
required-features = ["serde"]
