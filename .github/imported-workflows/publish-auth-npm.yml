name: "Publish @cipherstash/auth to npm"

on:
  # Automated publish, driven by changesets (see docs/npm-releases.md).
  # Merging the "Version Packages" PR bumps `packages/stack-auth/node/package.json`
  # on `main`; that push triggers this workflow, and the `preflight` job below
  # publishes iff the new version is not already on npm (so ordinary pushes that
  # touch package.json for other reasons are no-ops). The Version Packages PR
  # review/merge is the human gate — there is no separate approval step, matching
  # cipherstash/stack.
  #
  # `@cipherstash/auth` is versioned independently of the Rust `stack-auth` crate,
  # so this must NOT trigger on release-plz's `stack-auth-v*` tags — that would
  # ship the node package at the Rust crate's version.
  push:
    branches:
      - main
    paths:
      - packages/stack-auth/node/package.json
  # Manual runs default to a dry run; flip `dry_run` off to force a real publish
  # (e.g. to re-publish a version the automated path skipped).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not actually publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  WORKING_DIR: packages/stack-auth/node

concurrency:
  group: publish-auth-npm
  cancel-in-progress: false

jobs:
  # Decides whether this run should publish, and at what version.
  #   - workflow_dispatch: honours the `dry_run` input (defaults to true).
  #   - push (Version PR merged): real publish, but only if the version in
  #     package.json is not already on npm — makes the trigger idempotent so a
  #     push that changed package.json for any other reason is a clean no-op.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
      dry_run: ${{ steps.decide.outputs.dry_run }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version "${{ env.WORKING_DIR }}/package.json")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY_RUN="${{ inputs.dry_run }}"
          else
            DRY_RUN="false"
          fi
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

          # Idempotency guard (push path only): skip if this exact version is
          # already published. `npm view` exits non-zero / empty when the exact
          # version does not exist.
          PUBLISHED=$(npm view "@cipherstash/auth@$VERSION" version 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "push" ] && [ "$PUBLISHED" = "$VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@cipherstash/auth@$VERSION already on npm — nothing to publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Will $( [ "$DRY_RUN" = "true" ] && echo 'dry-run' || echo 'publish') @cipherstash/auth@$VERSION."
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.should_publish == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: blacksmith-8vcpu-ubuntu-2404
          - target: aarch64-unknown-linux-gnu
            os: blacksmith-8vcpu-ubuntu-2404-arm
          - target: x86_64-unknown-linux-musl
            os: blacksmith-8vcpu-ubuntu-2404
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Exclude Windows build output from Defender realtime scan
        # Defender real-time scanning every file Cargo writes under target/
        # (10k+ small files) is the dominant cost of MSVC napi builds —
        # usually 2-4× slowdown vs. Linux for the same code. Excluding only
        # this package's build output keeps the mitigation scoped to the
        # generated artifacts while reducing Windows build time. See CIP-3109.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\${{ env.WORKING_DIR }}\target"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm install --omit=optional

      - name: Build native module
        working-directory: ${{ env.WORKING_DIR }}
        # `--dts native.d.ts` matches package.json's `build` script: napi writes
        # its generated typings to `native.d.ts`, leaving the hand-written
        # `index.d.ts` re-exporter untouched. Without it, napi clobbers
        # `index.d.ts` in this job's tree. Harmless today (only `*.node` is
        # uploaded), but a footgun if this job ever packs or uploads dts files.
        run: npx napi build --platform --release --target ${{ matrix.target }} --strip --dts native.d.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ env.WORKING_DIR }}/*.node
          if-no-files-found: error

  build-wasm:
    name: Build - wasm32 (bundler target)
    needs: preflight
    if: needs.preflight.outputs.should_publish == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        # The `jetli/wasm-pack-action` GitHub Action is rejected by the
        # cipherstash org allowlist (unverified creator). Install a pinned
        # version from the official GitHub release so CI is reproducible and
        # not exposed to upstream installer-script changes.
        env:
          WASM_PACK_VERSION: v0.13.1
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/wasm-pack.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build wasm artifact
        # Single source of truth shared with local `npm run build:wasm`:
        # wasm-pack → strip wasm-pack metadata → emit inline-bytes shim.
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build:wasm

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-wasm32
          path: ${{ env.WORKING_DIR }}/wasm/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [preflight, build, build-wasm]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm install --omit=optional

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ env.WORKING_DIR }}/artifacts

      - name: Move artifacts to platform packages
        working-directory: ${{ env.WORKING_DIR }}
        run: npx napi artifacts --dir artifacts

      - name: Move wasm artifact into wasm/
        # `napi artifacts` only knows about the per-platform .node files;
        # the wasm32 build is bundled directly into the main package.
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          mkdir -p wasm
          mv artifacts/bindings-wasm32/* wasm/
          ls -la wasm/

      - name: Determine version and npm tag
        id: version
        run: |
          # The version is whatever `package.json` declares (changesets bumped it
          # in the Version Packages PR; a manual dispatch publishes as-is).
          VERSION=$(jq -r .version "${{ env.WORKING_DIR }}/package.json")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *"-"* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

          echo "Publishing version: $VERSION (tag: $(if [[ "$VERSION" == *"-"* ]]; then echo next; else echo latest; fi))"

      - name: Set package versions
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # Update peerDependencies (the napi platform sub-packages) to match
          # the publish version. They live under `peerDependencies` rather than
          # `optionalDependencies` so Deno's strict npm resolver doesn't choke
          # on platform packages that don't apply to the consumer's runtime.
          jq --arg v "$VERSION" '
            .peerDependencies |= with_entries(
              if (.key | startswith("@cipherstash/auth-"))
              then .value = $v
              else .
              end
            )
          ' package.json > package.json.tmp && mv package.json.tmp package.json
          for dir in npm/*/; do
            if [ -f "$dir/package.json" ]; then
              cd "$dir"
              npm version "$VERSION" --no-git-tag-version --allow-same-version
              cd -
            fi
          done

      - name: List packages
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "=== Main package ==="
          cat package.json | jq '{name, version}'
          echo ""
          for dir in npm/*/; do
            echo "=== $(basename $dir) ==="
            cat "$dir/package.json" | jq '{name, version, os, cpu}'
            ls -la "$dir"*.node 2>/dev/null || echo "  (no .node file)"
            echo ""
          done

      - name: Publish platform packages
        if: needs.preflight.outputs.dry_run == 'false'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Publishing $(jq -r .name "$dir/package.json")..."
              npm publish "$dir" --access public --tag ${{ steps.version.outputs.npm_tag }}
            fi
          done

      - name: Publish main package
        if: needs.preflight.outputs.dry_run == 'false'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag ${{ steps.version.outputs.npm_tag }}

      - name: Dry run summary
        if: needs.preflight.outputs.dry_run == 'true'
        run: echo "Dry run complete. Set dry_run to false to actually publish."
