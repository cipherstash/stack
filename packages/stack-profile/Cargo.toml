[package]
name = "stack-profile"
description = "Centralised ~/.cipherstash profile file management"
license-file = "LICENSE"
version = "0.43.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
dirs = "4.0.0"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# The default device name is the hostname, which only the creating half of
# `DeviceIdentity` needs — and that half is native-only: the crate builds for
# wasm32-wasip1 as the Go binding's credential guest, which reads an identity
# the CLI created and never creates one (gethostname has no wasip1 body).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gethostname = "0.5"

[dev-dependencies]
tempfile = "3.21.0"
