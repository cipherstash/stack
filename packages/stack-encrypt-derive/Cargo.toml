[package]
name = "stack-encrypt-derive"
description = "Derive macros for stack-encrypt's target-directed encryption"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license-file = "LICENSE"
# Not yet released, like stack-encrypt (which is the only crate that should
# depend on this one: the macros are re-exported from there).
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }

# The dev-dependencies below are used only by the crate-level doctests.
# `cargo-udeps` cannot see into rustdoc, so it reports them as unused.
[package.metadata.cargo-udeps.ignore]
development = ["stack-encrypt", "stack-kms", "tokio"]

[dev-dependencies]
# The crate-level examples are real doctests, run against the fake key
# source. A dev-dependency cycle back to `stack-encrypt` is the usual shape
# for a derive crate (cf. serde_derive -> serde).
stack-encrypt = { path = "../stack-encrypt" }
stack-kms = { path = "../stack-kms", features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }
