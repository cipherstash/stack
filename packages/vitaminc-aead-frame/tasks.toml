# Tasks for vitaminc-aead-frame, imported from cipherstash/vitaminc. Included from the
# root mise.toml.

# Rustdoc with warnings as errors, which the root `doc` task fans out to.
# It builds the public docs, then the docs of private items too: only the
# public build warns when a public doc links to a private item, and only
# the private build checks the links in private docs.
["doc:vitaminc-aead-frame"]
description = "Build docs for vitaminc-aead-frame with all features, public then private items (warnings are errors)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
  "cargo doc -p vitaminc-aead-frame --no-deps --all-features",
  "cargo doc -p vitaminc-aead-frame --no-deps --all-features --document-private-items",
]
