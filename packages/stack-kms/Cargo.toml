[package]
name = "stack-kms"
description = "Standalone client for ZeroKMS key generation and retrieval"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license-file = "LICENSE"
# Published to crates.io by release-plz.yml; release-plz.toml puts it in the
# `stack-kms` version group.

[features]
default = ["profile", "http"]
# The default transport: `HttpConnection`, speaking HTTPS via reqwest, and the
# `StackKmsBuilder` that configures it. Off, the crate has no HTTP client and
# no TLS stack in its graph; a host that provides its own transport (the
# WASI/wazero guest, where HTTP is a host import) implements
# `ZeroKMSConnection` itself and builds the client with `StackKms::connect`.
http = ["dep:reqwest", "dep:lazy_static", "stack-auth/http"]
# Loads the client key from the CLI's on-disk profile (`secretkey.json`, via
# `stack-profile`): `SecretKey: ProfileData` and `KeyProvider for ProfileStore`.
# Disable for consumers that only ever source the key in-memory or from the
# environment. Never compiled on wasm32 regardless.
profile = ["dep:stack-profile"]
# Exposes `FakeDataKeySource`, a deterministic in-memory `DataKeySource` for
# downstream crates (e.g. `stack-encrypt`) to unit-test encrypt/decrypt without
# ZeroKMS credentials or network access.
test-support = []
# Enables HTTP/2 in the reqwest client. ZeroKMS endpoints negotiate h2 via
# ALPN; without it reqwest is HTTP/1.1-only and opens a connection per
# concurrent request (`max_concurrent_reqs`), which can exhaust client-side
# ephemeral ports under load. Off by default while we validate it; intended to
# default-on later. Mirrors the same feature on `cipherstash-client`.
http2 = ["http", "reqwest/http2"]

[dependencies]
recipher = { workspace = true }
# The workspace entry is already `default-features = false`, so stack-auth's
# `http` feature rides on this crate's `http` feature rather than arriving by
# default.
stack-auth = { workspace = true }
zerokms-protocol = { workspace = true }

vitaminc = { workspace = true, features = ["protected", "random"] }
# The key-provider traits `ZeroKmsKeyset` implements (`KeyProvider`,
# `IndexKeyProvider`, `Binding`) and their value types. `default-features =
# false` keeps every vendor SDK — and the native HTTP/TLS stack the WASI gate
# forbids — out of this crate's graph: nothing here talks to AWS, Azure,
# Google Cloud or Vault, only to ZeroKMS.
#
# Pinned to a git rev because these traits are not published yet. Swap to a
# version once vitaminc releases them.
vitaminc-kms = { git = "https://github.com/cipherstash/vitaminc", rev = "c6009a2", default-features = false }
# Direct dep required because the `TimingSafeEq` derive macro expands to a
# `::vitaminc_protected` path.
vitaminc-protected = { workspace = true }
# `vitaminc-kms` is built against its own, newer `vitaminc-protected` — a
# different line from the workspace's `0.2.0-pre` pin above, which
# `stack-encrypt` already carries the same split for. A version-matched but
# differently-sourced dependency is a *different* type at compile time, so
# this must resolve to the identical git rev as `vitaminc-kms`'s own copy or
# every call into its types is an E0308. Renamed so it cannot collide with
# the entry above; used only by `provider.rs`.
vitaminc-protected-kms = { package = "vitaminc-protected", git = "https://github.com/cipherstash/vitaminc", rev = "c6009a2" }

blake3 = { workspace = true }
lazy_static = { workspace = true, optional = true }
miette = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

base16ct = { version = "0.2.0", features = ["alloc"] }
base64ct = { version = "1.7", features = ["alloc"] }
futures = "0.3.25"
opaque-debug = "0.3.1"
serde_cbor = "0.11.2"
serdect = { version = "0.3.0", features = ["zeroize"] }
sha2 = "0.10.6"

# Native-only and behind the `profile` feature: `stack-profile` is the
# filesystem-backed profile/config layer used by `SecretKey` (the on-disk
# `secretkey.json`) and the `ProfileStore` key provider. Wasm consumers source
# the client key in-memory instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stack-profile = { workspace = true, optional = true }

[dev-dependencies]
async-mutex = "1.4.0"
recipher = { workspace = true }
stack-auth = { workspace = true, features = ["test-utils"] }
tempfile = "3.21.0"
tokio = { workspace = true }
toml = "0.8.19"

[package.metadata.docs.rs]
all-features = true
