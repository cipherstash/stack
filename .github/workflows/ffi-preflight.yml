name: FFI release pre-flight

# `changeset publish` has no --dry-run, so this IS the dry run: build the real
# artifacts, check every binary is the architecture and libc its package name
# claims, then install the host-matching pair into a scratch project and use
# them. Point it at the Version Packages PR branch so the tarballs tested carry
# the exact versions that will publish.
#
# It never publishes, and cannot — both authentication paths are absent, which
# takes more than the one line it looks like. No `id-token` permission closes
# OIDC; a plain `NPM_TOKEN` would authenticate a publish regardless, so there is
# also no secret passed (no `secrets: inherit` on the call below), no
# `registry-url` on setup-node (that is what writes an `_authToken` line into
# .npmrc), and no NPM_TOKEN or NODE_AUTH_TOKEN anywhere. Adding any one of them
# turns this dry run into a publisher.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build and test (e.g. changeset-release/main)
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  artifacts:
    name: Build artifacts
    uses: ./.github/workflows/_build-ffi-artifacts.yml
    with:
      ref: ${{ inputs.ref }}

  smoke:
    name: Install and smoke-test
    needs: [artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ffi-tarballs
          path: ffi-dist

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      # The five non-host platform tarballs cannot be installed here — npm
      # rejects an explicitly-requested package whose os/cpu does not match,
      # with EBADPLATFORM — so they are verified statically instead.
      #
      # ARCHITECTURE, not size. `macos-latest` is arm64, so a darwin-x64 job
      # that lost its CARGO_BUILD_TARGET would emit a perfectly valid ARM binary
      # of the expected size, install cleanly on an Intel Mac, and fail to
      # dlopen. Size checks pass every one of those.
      - name: Verify each binary's architecture
        run: |
          set -euo pipefail
          declare -A EXPECT=(
            [darwin-arm64]='Mach-O 64-bit.*arm64'
            [darwin-x64]='Mach-O 64-bit.*x86_64'
            [linux-arm64-gnu]='ELF 64-bit.*ARM aarch64'
            [linux-x64-gnu]='ELF 64-bit.*x86-64'
            [linux-x64-musl]='ELF 64-bit.*x86-64'
            [win32-x64-msvc]='PE32\+.*x86-64'
          )
          checked=0
          mkdir -p probe && cd probe
          for tgz in ../ffi-dist/*.tgz ; do
            name=$(tar xzOf "$tgz" package/package.json | node -p \
              "JSON.parse(require('node:fs').readFileSync(0,'utf8')).name")
            platform="${name#@cipherstash/protect-ffi-}"
            # The wrapper: its name has no platform suffix, so the strip above
            # was a no-op.
            [ "$platform" = "$name" ] && continue
            test -n "${EXPECT[$platform]+set}" || {
              echo "::error::no expected architecture recorded for $platform"; exit 1; }
            rm -rf x && mkdir x && tar xzf "$tgz" -C x
            desc=$(file -b x/package/index.node)
            echo "$platform: $desc"
            # Unquoted on purpose: quoting the right-hand side of =~ makes bash
            # match it literally, and this is a pattern.
            [[ "$desc" =~ ${EXPECT[$platform]} ]] || {
              echo "::error::$platform binary is '$desc', expected ${EXPECT[$platform]}"
              exit 1; }

            # `file` reads linux-x64-gnu and linux-x64-musl identically — both
            # are "ELF 64-bit … x86-64" — so the check above passes if the two
            # are swapped, and the failure lands on an Alpine user at runtime.
            # The ABI is only visible in the dynamic section: the gnu build
            # links libc.so.6, the musl build does not (RUSTFLAGS drops
            # crt-static, so it stays dynamic against musl's own libc).
            #
            # `readelf` into a VARIABLE, never into `grep -q` — the same
            # SIGPIPE-under-pipefail trap documented in
            # _build-ffi-artifacts.yml, and here the musl branch fails OPEN.
            # A poisoned pipeline is non-zero, the `if` below is therefore
            # false, and the check reports "no glibc NEEDED entry" for the
            # exact binary it exists to reject. A dynamic section is far longer
            # than a tarball listing, so the writer is all but certain to still
            # be writing when grep leaves.
            case "$platform" in
              linux-x64-gnu|linux-arm64-gnu)
                dynamic=$(readelf -d x/package/index.node)
                grep -q 'NEEDED.*libc\.so\.6' <<< "$dynamic" || {
                  echo "::error::$platform does not link glibc"; exit 1; } ;;
              linux-x64-musl)
                dynamic=$(readelf -d x/package/index.node)
                if grep -q 'NEEDED.*libc\.so\.6' <<< "$dynamic" ; then
                  echo "::error::linux-x64-musl links glibc — it is the gnu binary"
                  exit 1
                fi
                echo "linux-x64-musl: no glibc NEEDED entry" ;;
            esac
            checked=$((checked + 1))
          done
          # Every platform in the table above, or the loop skipped one and
          # reported success for a set it never saw. Counted from the table
          # rather than hardcoded, so adding a platform does not leave a stale
          # number reading as a build defect.
          test "$checked" -eq "${#EXPECT[@]}" || {
            echo "::error::checked $checked platform binaries, expected ${#EXPECT[@]}"
            exit 1; }

      - name: Install the wrapper and the host platform package
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke && cd /tmp/smoke
          echo '{"name":"smoke","version":"1.0.0","type":"module","private":true}' > package.json
          # The wrapper's tarball name is the only one where a digit follows
          # `protect-ffi-`; every platform package has its platform there.
          wrapper=$(ls "$GITHUB_WORKSPACE"/ffi-dist/cipherstash-protect-ffi-[0-9]*.tgz)
          host=$(ls "$GITHUB_WORKSPACE"/ffi-dist/*linux-x64-gnu*.tgz)
          npm install --no-audit --no-fund "$wrapper" "$host"

      - name: Smoke-test the installed artifact
        run: |
          set -euo pipefail
          cd /tmp/smoke
          cat > smoke.mjs <<'EOF'
          import { createRequire } from 'node:module'
          const require = createRequire(import.meta.url)
          const cjs = require('@cipherstash/protect-ffi')
          // Since the laziness change a bare require proves nothing — the
          // binding resolves on first use, not on import. This forces it, and
          // is pure: no client, no credentials, no network.
          cjs.assertNativeBindingAvailable()
          if (typeof cjs.isEncrypted !== 'function') throw new Error('no isEncrypted')
          const wasm = await import('@cipherstash/protect-ffi/wasm')
          if (typeof wasm.newClient !== 'function') throw new Error('./wasm did not resolve')
          const inline = await import('@cipherstash/protect-ffi/wasm-inline')
          if (typeof inline.newClient !== 'function') throw new Error('./wasm-inline did not resolve')
          console.log('smoke OK')
          EOF
          node smoke.mjs
