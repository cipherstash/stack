# Tasks for recipher-frame, imported from cipherstash/vitaminc. Included from the
# root mise.toml.

# Rustdoc with warnings as errors, which the root `doc` task fans out to.
["doc:recipher-frame"]
description = "Build docs for recipher-frame with all features (warnings are errors)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc -p recipher-frame --no-deps --all-features"
