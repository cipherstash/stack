name: Third Party Uses
on:
  push:
    branches: [main]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # None of these is a local path, so none of them has an `action.yml` on
      # this filesystem to open. A traversal that treats every `uses:` as a
      # path fails here rather than on the composite fixtures.
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - uses: cipherstash/some-action/nested/path@v1
      - uses: docker://alpine:3.19
      - run: pnpm publish --no-git-checks
