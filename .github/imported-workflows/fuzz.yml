name: "Fuzz (cargo-fuzz)"

# libFuzzer fuzzing for the public string parsers (see packages/*/fuzz/ and the
# `fuzz:*` mise tasks). Two jobs with deliberately different roles:
#
#   * fuzz-regression (pull_request, blocking): builds every harness — which
#     catches harness/API drift, e.g. a changed `FromStr` signature — and
#     replays the committed seed corpus with `-runs=0`. This is deterministic
#     (no fuzzing), so it is safe to gate PRs: it fails only if a harness stops
#     compiling or a committed corpus input crashes.
#
#   * fuzz-campaign (schedule + manual, non-blocking on PRs): the actual
#     time-boxed bug-finding run. A timed fuzz run is nondeterministic, so it
#     must NOT gate PRs; it runs nightly against the default branch and on
#     demand. Each target's corpus is persisted across runs via actions/cache
#     so coverage compounds, minimized with `cargo fuzz cmin` to stay small, and
#     any crash reproducer is uploaded as an artifact.
on:
  pull_request:
    paths:
      - packages/cts-common/**
      - packages/stack-auth/**
      - packages/stack-kms/**
      - .github/workflows/fuzz.yml
      # Ordering matters: keep these excludes last so docs-only changes are skipped.
      - "!**.md"
      - "!**.example"
  schedule:
    # Nightly at 04:27 UTC. Scheduled runs only fire from the default branch.
    - cron: "27 4 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to fuzz each target (campaign job)"
        default: "120"

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  fuzz-regression:
    name: "fuzz regression (${{ matrix.slug }})"
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - { task: "fuzz:crn", slug: crn }
          - { task: "fuzz:workspace-id", slug: workspace-id }
          - { task: "fuzz:region", slug: region }
          - { task: "fuzz:access-key", slug: access-key }
          - { task: "fuzz:jwt-decode", slug: jwt-decode }
          - { task: "fuzz:client-key", slug: client-key }
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - name: Install nightly toolchain (cargo-fuzz requires it)
        run: rustup toolchain install nightly --profile minimal
      - name: "Build harness + replay seed corpus (${{ matrix.slug }})"
        # `-runs=0` replays the committed seed corpus once and exits without
        # fuzzing. The trailing args override the task's default `-max_total_time`.
        run: mise run ${{ matrix.task }} -- -runs=0

  fuzz-campaign:
    name: "fuzz campaign (${{ matrix.slug }})"
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # `dir`/`target` drive the corpus path and `cargo fuzz cmin`.
        include:
          - { task: "fuzz:crn",          slug: crn,          dir: packages/cts-common, target: crn_parse }
          - { task: "fuzz:workspace-id", slug: workspace-id, dir: packages/cts-common, target: workspace_id_parse }
          - { task: "fuzz:region",       slug: region,       dir: packages/cts-common, target: region_parse }
          - { task: "fuzz:access-key",   slug: access-key,   dir: packages/stack-auth, target: access_key_parse }
          - { task: "fuzz:jwt-decode",   slug: jwt-decode,   dir: packages/stack-auth, target: jwt_decode }
          - { task: "fuzz:client-key",   slug: client-key,   dir: packages/stack-kms,  target: client_key_encoded }
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - name: Install nightly toolchain (cargo-fuzz requires it)
        run: rustup toolchain install nightly --profile minimal

      # Persist the corpus across runs so coverage compounds. A cache key is
      # write-once, so save under a unique per-run key and use a prefix
      # `restore-keys` to load the most recent prior corpus. The committed seeds
      # come from the checkout and merge with the restored corpus at runtime.
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.dir }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.slug }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.slug }}-

      - name: "Fuzz ${{ matrix.slug }}"
        # The trailing `-max_total_time` (last value wins) overrides the task default.
        run: mise run ${{ matrix.task }} -- -max_total_time=${{ github.event.inputs.max_total_time || '120' }}

      - name: "Minimize corpus (${{ matrix.slug }})"
        # Drop inputs that don't add coverage so the persisted corpus stays small
        # and fast to load. Skipped automatically if the Fuzz step found a crash.
        working-directory: ${{ matrix.dir }}
        run: |
          cargo +nightly fuzz cmin ${{ matrix.target }} --sanitizer none --target "$(rustc -vV | sed -n 's/^host: //p')"

      - name: Save corpus
        # Save even on crash: the grown corpus is still valuable, and the crash
        # input lives in artifacts/, not corpus/.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.dir }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.slug }}-${{ github.run_id }}

      - name: Upload crash reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.slug }}
          path: packages/*/fuzz/artifacts/**
          if-no-files-found: ignore
