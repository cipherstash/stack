[package]
name = "stack-encrypt"
description = "Encrypt Rust values under per-value ZeroKMS data keys via the vitaminc cipher traits"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license-file = "LICENSE"
# Published to crates.io by release-plz.yml; release-plz.toml puts it in the
# `stack-encrypt` version group.

[dependencies]
# `profile` (native only; stack-kms gates it off wasm32 itself) lets
# `StackCipher::new()` fall back to the client key `stash auth login` writes
# to the profile directory (`secretkey.json`) when CS_CLIENT_ID /
# CS_CLIENT_KEY are not set — the same place `AutoStrategy` finds the token.
stack-kms = { path = "../stack-kms", version = "0.1.0", default-features = false, features = ["profile"] }
# `StackCipher::new()` builds a ZeroKMS client from the environment, so its
# return type names the auto-detected auth strategy. Only needed with `http`.
stack-auth = { workspace = true, optional = true }
# `#[derive(EncryptFrom)]` / `#[derive(DecryptInto)]`, re-exported from `target`.
stack-encrypt-derive = { path = "../stack-encrypt-derive", version = "0.3.0" }

# The workspace vitaminc (0.6.0): one canonical context encoding shared by
# the AEAD and PRF derivations (`IntoContext`, cipherstash/vitaminc#339),
# `NonEmpty::with`, `From<integer> for NonEmpty` (#314) and the parts view
# (#318), all of which this crate relies on. All five must share one
# version or the aead crate is duplicated.
vitaminc-aead = { workspace = true }
vitaminc-encrypt = { workspace = true }
vitaminc-hmac = { workspace = true }
# Equality terms derive over `vitaminc-normalize`'s encoding of a value
# (the workspace turns on vitaminc-prf's `normalize` feature): one term per
# number whatever its width, text in Unicode 16 NFC. Match text is
# normalized by the same crate before it is tokenized.
vitaminc-normalize = { workspace = true }
# The order targets (`OrderTarget`) and the scheme traits clww-ore and
# ore-rs implement, which order terms encrypt through.
vitaminc-ore = { workspace = true }
vitaminc-prf = { workspace = true }
vitaminc-protected = { workspace = true }
# `dynamic` only: serde over the transport frame, which reads a binding's
# control data (statistics, options, a plan) into typed messages.
vitaminc-aead-frame = { workspace = true, optional = true, features = ["serde"] }
serde = { workspace = true }
# The order terms' serde: lowercase hex in JSON, raw bytes in a binary
# format, through serdect's constant-time hex.
serdect = { workspace = true }
# `Descriptor`: the base64 rendering of a non-textual context for ZeroKMS,
# and the JSON index's chain fields, header and ordering term on the wire:
# padded standard base64, the one form PostgreSQL's `decode(x, 'base64')`
# reads and `encode(x, 'base64')` writes.
base64ct = { version = "1.7", features = ["alloc"] }
# The JSON index's ciphertext field on the wire, which nothing in SQL
# decodes: RFC 1924 base85, five characters per four bytes. SIMD on
# aarch64 and x86_64, portable scalar code elsewhere (wasm32 included).
base85-simd = "0.1.0"
# The JSON index's token chain: SHA-256 is what links a node to its
# children, because core PostgreSQL computes `sha256(bytea)` and can walk
# the chain server-side (`json` module). The same version vitaminc-hmac
# already builds, so nothing new is compiled.
sha2 = "0.11"

clww-ore = { workspace = true }
# Block ORE (`OreBlock`): ore-rs's `BlockOre`, its 6-bit schemes behind
# the same vitaminc-ore traits clww-ore implements.
ore-rs = { workspace = true }
# Every error derives `miette::Diagnostic` (a code, and help where a caller
# can act) and gives its structured fields as a `serde_json` map through
# `ErrorPayload`. Both are already in the graph through stack-kms.
miette = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
# `value::{Date, Timestamp}` to and from chrono's types (the `chrono`
# feature), and `value::Decimal` to and from rust_decimal's (`rust_decimal`).
chrono = { version = "0.4.44", optional = true, default-features = false }
rust_decimal = { version = "1", optional = true, default-features = false }

[features]
default = ["http"]
# `StackCipher::new()` / `StackCipher::builder().init()` from the environment:
# the default HTTP transport in stack-kms and the auto-detected auth strategy
# in stack-auth. Off, a cipher is built over an explicit `DataKeySource`
# (`StackCipher::builder().kms(..)`) and no HTTP client or TLS stack is in
# the dependency graph — the shape the WASI/wazero guest builds against.
http = ["dep:stack-auth", "stack-auth/http", "stack-kms/http"]
# `stack_encrypt::dynamic`: encrypt and decrypt values whose types are known
# only at runtime, as an FFI binding's are. Off by default — it is only of
# use to a binding author. Its transport frames are vitaminc-aead's own.
dynamic = ["dep:vitaminc-aead-frame"]
# Conversions between chrono's `NaiveDate` / `DateTime<Utc>` and
# `value::Date` / `value::Timestamp`.
chrono = ["dep:chrono", "vitaminc-aead/chrono"]
# Conversions between rust_decimal's `Decimal` and `value::Decimal`.
rust_decimal = ["dep:rust_decimal", "vitaminc-aead/rust_decimal"]
# `stack_encrypt::kms::FakeDataKeySource`: the in-memory key source for tests
# with no ZeroKMS, so a caller's dev-dependency on stack-encrypt is enough and
# no direct stack-kms dependency has to agree with this crate's.
test-support = ["stack-kms/test-support"]

[dev-dependencies]
# `default-features = false` here too: dev-dependency features unify into the
# `cargo test -p stack-encrypt --no-default-features` graph, so leaving the
# default on would silently pull `stack-kms/http` -> `stack-auth/http` ->
# reqwest back into the "no HTTP" gate (`wasm:no-http-test`). The tests only
# need `FakeDataKeySource` (`test-support`).
stack-kms = { path = "../stack-kms", default-features = false, features = ["test-support"] }
# To build the request errors ZeroKMS answers a keyset lookup with (a name it
# does not know, a request that got no answer) in a test double. Already in
# the no-HTTP graph through stack-kms; it has no features of its own.
zerokms-protocol = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
# Compile-fail tests for the derive diagnostics (`tests/ui`).
trybuild = "1"
# The JSON index's executable leakage profile (`tests/json_leakage`): random
# columns for its positive control, and the seeded generator its simulator
# draws from. Already in the workspace graph (stack-auth, stack-guest-abi).
proptest = { version = "1.7", default-features = false, features = ["std"] }

# The derive diagnostics are recorded with every feature on, as `test:unit`
# and CI run them. They cannot be relied on to hold under both feature sets
# — rustc lists a trait's other implementors in its help, and the `dynamic`
# feature adds implementors (`ValueFrame`) that can join such a list — so
# the test is only built with that feature rather than skipped at runtime.
[[test]]
name = "ui"
required-features = ["dynamic"]

[[example]]
name = "encrypted_record"
required-features = ["http"]

[[example]]
name = "mixed_user"
required-features = ["http"]

[[example]]
name = "search_terms"
required-features = ["http"]

[[example]]
name = "zerokms_auth"
required-features = ["http"]

[package.metadata.docs.rs]
all-features = true
