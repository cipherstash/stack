# Tasks for stack-encrypt-jsonpath, the JSONPath grammar stack-encrypt and its
# derive share. Included from the root mise.toml.

# Rustdoc with warnings as errors, which the root `doc` task fans out to.
# It builds the public docs, then the docs of private items too: only the
# public build warns when a public doc links to a private item, and only
# the private build checks the links in private docs.
["doc:stack-encrypt-jsonpath"]
description = "Build docs for stack-encrypt-jsonpath with all features, public then private items (warnings are errors)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
  "cargo doc -p stack-encrypt-jsonpath --no-deps --all-features",
  "cargo doc -p stack-encrypt-jsonpath --no-deps --all-features --document-private-items",
]
