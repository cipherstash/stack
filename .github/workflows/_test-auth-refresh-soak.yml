name: Auth refresh cancellation soak

on:
  workflow_call:
    inputs:
      long:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  soak:
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 30
    env:
      MISE_ENV: test
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          version: 2026.4.0
          install: true
          working_directory: .
          cache: true
          cache_key_prefix: mise-v1-ubuntu-2204
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Short seeded soak
        if: ${{ !inputs.long }}
        run: cargo nextest run --locked -p stack-auth --all-features -E 'test(cancellation_soak_short)' --success-output final
      - name: Long seeded soak
        if: inputs.long
        run: mise run test:soak:stack-auth
