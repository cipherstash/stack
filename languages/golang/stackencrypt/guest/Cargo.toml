# stack-encrypt WASI guest: `StackCipher` over host-provided HTTP under
# WASI/wazero, embedded by the Go module one directory up (Phase 3/4 of
# docs/plans/stack-encrypt-go-bindings.md).
#
# Deliberately a standalone workspace (same pattern as the fuzz crates and
# vitaminc's guest): this crate targets wasm32-wasip1 and is consumed as a
# .wasm artifact, so its wasm-only profile and target must not leak into
# workspace builds.
#
# Build: mise run wasm:guest:build   (or: cargo build --target wasm32-wasip1 --release)
[package]
name = "stack-encrypt-guest"
description = "WASI guest module exposing stack-encrypt to non-Rust hosts (Go/wazero)"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
# cdylib: the .wasm guest module. rlib: lets the ops/config/status modules
# unit-test natively (`cargo test` here, no wasm toolchain needed).
crate-type = ["cdylib", "rlib"]

[dependencies]
# The stack crates with default features off: no reqwest, no native TLS —
# HTTP comes from the host (see `wasm:wasi-check` in the suite root).
stack-auth = { path = "../../../../packages/stack-auth", default-features = false }
stack-encrypt = { path = "../../../../packages/stack-encrypt", default-features = false }
stack-kms = { path = "../../../../packages/stack-kms", default-features = false }
zerokms-protocol = { path = "../../../../packages/zerokms-protocol" }

# The FFI codec + `FfiValue` tree, shared with vitaminc's own guest — one
# codec, not a fork. Same rev the suite pins for the other vitaminc crates.
vitaminc-aead-value = { git = "https://github.com/cipherstash/vitaminc", rev = "04f4faa3eeeb69ae30dd0247865e06c640585fea" }
vitaminc-protected = { git = "https://github.com/cipherstash/vitaminc", rev = "04f4faa3eeeb69ae30dd0247865e06c640585fea" }

futures = { version = "0.3", default-features = false, features = ["executor"] }
serde = "1"
serde_json = "1"
uuid = "1"
zeroize = "1"

[dev-dependencies]
stack-kms = { path = "../../../../packages/stack-kms", default-features = false, features = ["test-support"] }
# For minting a valid client-key fixture in the config tests.
recipher = { path = "../../../../packages/recipher" }

[profile.release]
# Smaller .wasm; the guest is IO-bound on the FFI copy and the ZeroKMS round
# trip, not on codegen.
opt-level = "s"
lto = true
strip = true
