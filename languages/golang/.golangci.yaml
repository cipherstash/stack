version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
    - wsl_v5
  settings:
    wsl_v5:
      default: none
      enable:
        - after-defer
        - after-block
        - return
      branch-max-lines: 2
  exclusions:
    presets:
      # Unchecked Close, Flush, fmt.Fprint* and friends.
      - std-error-handling
    rules:
      # Test fixtures, weak rand and subprocesses are fine in tests;
      # guesttest is imported only by _test files.
      - path: (_test\.go|internal/guesttest/)
        linters:
          - gosec
      # Layout policy for control only; keep other packages' existing policy.
      - path-except: '^control/[^/]+\.go$'
        linters:
          - wsl_v5

formatters:
  enable:
    - gofmt
    - goimports
