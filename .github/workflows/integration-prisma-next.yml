name: Integration — prisma-next (EQL v3)

# Real ZeroKMS ciphertext against a real Postgres, on BOTH database variants —
# the prisma-next leg of the shared test-kit family driver (the same catalog,
# oracle, and single-vs-bulk crossover as the Drizzle and Supabase jobs).
#
# The prisma-next adapter talks straight to the database, so it does not need
# PostgREST — but it does need to work on managed Postgres, where the `postgres`
# role is not a superuser, the EQL install takes its self-skipping path, and the
# ORE domains cannot hold data. The Supabase compose file brings up PostgREST
# too; this job simply ignores it.
#
# Separate from `tests.yml` on purpose: these suites need CipherStash credentials
# and a database, and they THROW rather than skip when unconfigured. Keeping them
# out of the unit job is what lets `pnpm test` stay runnable with neither.

on:
  push:
    branches: [main]
    # The same files as the `selector` job's filter.
    # scripts/__tests__/workflow-paths-filter-parity.test.mjs compares them.
    paths:
      - 'languages/typescript/packages/stack/src/eql/v3/**'
      - 'languages/typescript/packages/stack-prisma/**'
      # Source layers the adapter's encoding/round-trip rests on: a break here
      # (not just under src/eql/v3) can produce wrong rows, so trigger the live
      # suite that would catch it.
      - 'languages/typescript/packages/stack/src/encryption/**'
      - 'languages/typescript/packages/stack/src/schema/**'
      - 'languages/typescript/packages/test-kit/**'
      - 'languages/typescript/packages/cli/src/installer/**'
      - 'local/docker-compose.postgres.yml'
      - 'local/docker-compose.supabase.yml'
      - 'local/supabase-init.sql'
      - '.github/workflows/integration-prisma-next.yml'
      - '.github/actions/integration-setup/**'
      - '.github/actions/integration-db/**'
      - '.github/actions/build-ffi-binding/**'
      - '.github/actions/build-auth-binding/**'
      # The Rust that produces every EQL payload these suites round-trip.
      # Absorbing protect-ffi put it in-tree, so a crate change can now
      # break them in a PR that touches no TypeScript at all.
      #
      # The manifests are here for the same reason as the sources: a
      # dependency bump in Cargo.lock changes the compiled encryption core
      # without touching a .rs file, and package.json / mise.toml carry the
      # build scripts and the toolchain pin. Matching the filter in
      # tests-rust.yml, which already covers all four.
      - 'languages/typescript/packages/protect-ffi/crates/**'
      - 'languages/typescript/packages/protect-ffi/src/**'
      - 'languages/typescript/packages/protect-ffi/Cargo.toml'
      - 'languages/typescript/packages/protect-ffi/Cargo.lock'
      - 'languages/typescript/packages/protect-ffi/package.json'
      - 'languages/typescript/packages/protect-ffi/mise.toml'
      # Out of that package, and a compile input all the same: the cdylib
      # crate carries
      # `eql-bindings = { path = "../../../../../../packages/eql/crates/eql-bindings" }`, so the
      # EQL wire types are linked into the `index.node` this job encrypts
      # through. The native cache key in `.github/actions/build-ffi-binding`
      # hashes both, so an edit here misses that cache and the binding gets
      # rebuilt — correctly. Without these two entries the miss never happens,
      # because the workflow does not trigger at all: a payload-encoding change
      # under packages/eql/crates merges with this suite green by absence.
      # Pinned by scripts/__tests__/wasm-build-inputs-paths-filter.test.mjs.
      - 'packages/eql/crates/**'
      - 'packages/eql/Cargo.toml'
  # No path filter: a workflow that a path filter skips leaves its required
  # checks pending, and GitHub's documentation on required status checks says
  # that blocks a merge. The trigger paths are in the `selector` job instead.
  pull_request:
    branches: ['**']

jobs:
  # The selector job: it decides which jobs a pull request runs. It runs on
  # every event and is never skipped, because the gated jobs need it. When it
  # cannot decide it fails, and that fails the summary job: a selector that
  # answered nothing would skip every gated job, and the summary job counts a
  # skipped job as passed (ADR 0003).
  #
  # On a GitHub-hosted runner because the gated jobs wait for it. No checkout:
  # on a pull request, dorny/paths-filter lists the changed files through the
  # GitHub API.
  selector:
    name: Selector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Each output is named after the filter that decides it.
    # `scripts/__tests__/workflow-selectors.test.mjs` follows a job's `if:` to
    # its filter by that name.
    outputs:
      prisma_next: ${{ steps.decide.outputs.prisma_next }}
    steps:
      # Only on a pull request, which has a base to compare with. Other events
      # select every job in the step below.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            # The same list as `on.push.paths`, which says why each entry
            # is there.
            prisma_next:
              - "languages/typescript/packages/stack/src/eql/v3/**"
              - "languages/typescript/packages/stack-prisma/**"
              - "languages/typescript/packages/stack/src/encryption/**"
              - "languages/typescript/packages/stack/src/schema/**"
              - "languages/typescript/packages/test-kit/**"
              - "languages/typescript/packages/cli/src/installer/**"
              - "local/docker-compose.postgres.yml"
              - "local/docker-compose.supabase.yml"
              - "local/supabase-init.sql"
              - ".github/workflows/integration-prisma-next.yml"
              - ".github/actions/integration-setup/**"
              - ".github/actions/integration-db/**"
              - ".github/actions/build-ffi-binding/**"
              - ".github/actions/build-auth-binding/**"
              - "languages/typescript/packages/protect-ffi/crates/**"
              - "languages/typescript/packages/protect-ffi/src/**"
              - "languages/typescript/packages/protect-ffi/Cargo.toml"
              - "languages/typescript/packages/protect-ffi/Cargo.lock"
              - "languages/typescript/packages/protect-ffi/package.json"
              - "languages/typescript/packages/protect-ffi/mise.toml"
              - "packages/eql/crates/**"
              - "packages/eql/Cargo.toml"

      # Explicit default, not `|| 'true'`, which trips GitHub's inconsistent
      # treatment of the string 'false'. On a pull request, an answer other than
      # `true` or `false` means the filter did not decide, so the step fails
      # rather than write it.
      #
      # The event and the answers arrive through `env:`, not through a `${{ }}`
      # in the script. That lets `scripts/__tests__/workflow-selectors.test.mjs`
      # run this script and read back what it wrote.
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRISMA_NEXT: ${{ steps.filter.outputs.prisma_next }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            PRISMA_NEXT=true
          fi
          answers=(
            "prisma_next=$PRISMA_NEXT"
          )
          for answer in "${answers[@]}"; do
            case "${answer#*=}" in
              true|false) echo "$answer" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "::error::The path filter answered '${answer#*=}' for ${answer%%=*}. The selector cannot decide which jobs to run."
                exit 1
                ;;
            esac
          done

  integration:
    name: prisma-next v3 integration (db=${{ matrix.db }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # No concurrency group: `integration-db` gives each job its own compose
    # project and ephemeral host ports, so live-DB jobs no longer contend and do
    # not need serialising. See that action for why the old
    # `integration-live-db-<db>` group had to go (it cancelled a third
    # contender rather than queueing it).
    #
    # Fork PRs have no secrets. Skip cleanly rather than fail on something the
    # contributor cannot fix — `tests.yml` still gives them a green signal.
    # Every OTHER event runs, which is why this gates on "not a fork PR" rather
    # than listing the event names allowed through: the listing form skipped
    # the job on `workflow_dispatch` in integration-protect-ffi.yml, making a
    # declared manual trigger do nothing. Enforced by
    # scripts/__tests__/workflow-dispatch-job-conditions.test.mjs.
    needs: [selector]
    # The first clause is the selector's answer; both are exclusions of
    # pull_request, not lists of events.
    if: >-
      (github.event_name != 'pull_request'
       || needs.selector.outputs.prisma_next == 'true')
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)

    strategy:
      fail-fast: false
      # prisma-next talks straight to Postgres, so it runs against BOTH
      # databases. The Supabase variant is not a formality: its `postgres` role
      # is not a superuser, so the EQL install takes its self-skipping path. A
      # suite that passes on a superuser database can still fail there.
      matrix:
        db: [postgres, supabase]

    env:
      CS_WORKSPACE_CRN: ${{ vars.CS_WORKSPACE_CRN }}
      CS_CLIENT_ID: ${{ vars.CS_CLIENT_ID }}
      CS_CLIENT_KEY: ${{ secrets.CS_CLIENT_KEY }}
      CS_CLIENT_ACCESS_KEY: ${{ secrets.CS_CLIENT_ACCESS_KEY }}
      # EXPLICIT, never inferred — same rationale as the Drizzle workflow.
      CS_IT_DB_VARIANT: ${{ matrix.db }}

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/integration-setup

      # Fast pre-flight: fail in seconds if a secret was rotated or cleared,
      # before the binding build and the docker pull. The in-test
      # `requireIntegrationEnv` is the correctness guarantee; this is the cheap
      # one, so nothing expensive may be ordered ahead of it.
      - name: Require CipherStash secrets
        uses: ./.github/actions/require-cs-secrets
        with:
          workspace-crn: ${{ vars.CS_WORKSPACE_CRN }}
          client-id: ${{ vars.CS_CLIENT_ID }}
          client-key: ${{ secrets.CS_CLIENT_KEY }}
          client-access-key: ${{ secrets.CS_CLIENT_ACCESS_KEY }}

      # No `wasm: true` — the prisma-next family suites go through the native
      # binding only.
      - name: Build the protect-ffi binding
        uses: ./.github/actions/build-ffi-binding

      - name: Build the @cipherstash/auth binding
        uses: ./.github/actions/build-auth-binding

      # No pre-`up` cleanup step any more: the project name is unique per job, so
      # a container leaked by a hard-killed prior run cannot hold this job's
      # name or its (ephemeral) port. Blanket-pruning would now be actively
      # unsafe — without the concurrency group, another job's stack may be live
      # on this runner.
      - name: Start ${{ matrix.db }}
        id: db
        uses: ./.github/actions/integration-db
        with:
          db: ${{ matrix.db }}

      # `globalSetup` installs EQL v3 by shelling out to the real
      # `stash eql install --eql-version 3`, so an installer regression fails
      # here rather than hiding behind a test-only SQL apply.
      - name: prisma-next v3 family suites
        run: pnpm exec turbo run test:integration --filter @cipherstash/stack-prisma --env-mode=loose
        env:
          # Step env, not a `.env` file: `dotenv/config` does not override an
          # already-set `process.env`, so these win and no secret hits disk.
          DATABASE_URL: ${{ steps.db.outputs.database-url }}
          PGRST_URL: ${{ steps.db.outputs.pgrest-url }}

      # Guarded on the project being set: if the stack never came up, there is
      # nothing to tear down and an unguarded `-p ""` would fail the job with a
      # confusing error that masks the real one.
      - name: Stop ${{ matrix.db }}
        if: always() && env.CS_COMPOSE_PROJECT != ''
        run: docker compose -p "$CS_COMPOSE_PROJECT" -f "$CS_COMPOSE_FILE" down -v

  # The summary job: the one job of this workflow that branch rules require.
  # It has the same name on every event. It passes when every needed job
  # passed or was skipped. Skipped counts as passed because the selector skips
  # a job whose trigger paths a change does not touch. A failed job still
  # fails this one, because it is in `needs` and reports its failure.
  summary:
    name: Integration (prisma-next) summary
    needs: [selector, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Needed results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A needed job reported '$result'."
                exit 1
                ;;
            esac
          done
